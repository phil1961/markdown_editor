// LOGGING SYSTEM
// ============================================================================
const Logger = {
    enabled: true,
    showInConsole: true,
    
    _format(level, module, message) {
        const time = new Date().toLocaleTimeString('en-US', { hour12: false }) + '.' + 
                    String(new Date().getMilliseconds()).padStart(3, '0');
        return `[${time}] [${module}] ${message}`;
    },
    
    _addToPanel(level, message) {
        const panel = document.getElementById('consolePanel');
        if (panel) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.textContent = message;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }
    },
    
    info(module, message) {
        if (!this.enabled) return;
        const formatted = this._format('INFO', module, message);
        if (this.showInConsole) console.log(formatted);
        this._addToPanel('info', formatted);
    },
    
    warn(module, message) {
        if (!this.enabled) return;
        const formatted = this._format('WARN', module, message);
        if (this.showInConsole) console.warn(formatted);
        this._addToPanel('warn', formatted);
    },
    
    error(module, message) {
        if (!this.enabled) return;
        const formatted = this._format('ERROR', module, message);
        if (this.showInConsole) console.error(formatted);
        this._addToPanel('error', formatted);
    },
    
    success(module, message) {
        if (!this.enabled) return;
        const formatted = this._format('OK', module, message);
        if (this.showInConsole) console.log(formatted);
        this._addToPanel('success', formatted);
    }
};

/* =========================================================================
   Doc — the live document. Markdown is the file format, not the data structure.
   ========================================================================= */
const Doc = (() => {
    const MARK_TAG = { bold: "strong", italic: "em", underline: "u", strike: "del", code: "code" };
    const TAG_MARK = { strong: "bold", b: "bold", em: "italic", i: "italic", u: "underline", del: "strike", s: "strike", code: "code" };
    const MARK_WRAP = [
        { mark: "code", open: "`", close: "`" },
        { mark: "strike", open: "~~", close: "~~" },
        { mark: "underline", open: "++", close: "++" },
        { mark: "italic", open: "*", close: "*" },
        { mark: "bold", open: "**", close: "**" }
    ];
    const BLOCKS = ["p", "div", "h1", "h2", "h3", "h4", "h5", "h6", "ul", "ol", "quote", "pre", "hr", "table"];

    let state = { blocks: [{ type: "p", inlines: [] }] };
    let sel = { from: 0, to: 0 };

    function empty() { return { blocks: [{ type: "p", inlines: [] }] }; }
    function get() { return state; }
    function selection() { return { from: sel.from, to: sel.to }; }
    function setSelection(from, to) {
        const n = totalLen(state);
        from = clamp(from, 0, n);
        to = clamp(to === undefined ? from : to, 0, n);
        if (from > to) { const t = from; from = to; to = t; }
        sel = { from, to };
        return sel;
    }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function marksOf(r) { return Array.isArray(r.marks) ? r.marks.slice().sort() : []; }
    function marksEq(a, b) { return marksOf({ marks: a }).join() === marksOf({ marks: b }).join(); }
    function inlinesText(ins) { return (ins || []).map(r => r.text || "").join(""); }

    function mergeInlines(ins) {
        const out = [];
        for (const r of ins || []) {
            if (r.type === "image") { out.push(r); continue; }
            if (!r.text) continue;
            const last = out[out.length - 1];
            if (last && last.type !== "image" && marksEq(last.marks, r.marks) && last.href === r.href) {
                last.text += r.text;
            } else out.push({ text: r.text, marks: marksOf(r), href: r.href });
        }
        return out;
    }

    function blockText(b) {
        if (!b) return "";
        if (b.type === "hr") return "";
        if (b.type === "pre") return b.text || "";
        if (b.type === "table") return (b.rows || []).map(row => (row || []).map(c => String(c || "")).join("\t")).join("\n");
        if (b.type === "ul" || b.type === "ol") return (b.items || []).map(inlinesText).join("\n");
        if (b.type === "quote") return (b.blocks || []).map(blockText).join("\n");
        return inlinesText(b.inlines);
    }

    function index(doc) {
        const blocks = doc.blocks;
        let pos = 0;
        return blocks.map((b, i) => {
            const text = b.type === "hr" ? "\n" : blockText(b);
            const from = pos;
            const to = pos + text.length;
            pos = to + (i < blocks.length - 1 ? 1 : 0);
            return { from, to, text, i, type: b.type };
        });
    }
    function totalLen(doc) {
        const ix = index(doc);
        if (!ix.length) return 0;
        return ix[ix.length - 1].to;
    }
    function locAt(doc, pos) {
        const ix = index(doc);
        const n = totalLen(doc);
        pos = clamp(pos, 0, n);
        for (let k = 0; k < ix.length; k++) {
            if (pos < ix[k].to || k === ix.length - 1) {
                if (pos <= ix[k].to) return { block: ix[k].i, offset: pos - ix[k].from };
            }
            if (pos === ix[k].to && k < ix.length - 1 && pos < ix[k + 1].from) {
                return { block: ix[k].i, offset: ix[k].text.length };
            }
        }
        const last = ix[ix.length - 1];
        return last ? { block: last.i, offset: last.text.length } : { block: 0, offset: 0 };
    }
    function itemAt(block, offset) {
        const items = block.items || [];
        if (!items.length) return { item: 0, offset: 0 };
        let o = 0;
        for (let k = 0; k < items.length; k++) {
            const n = inlinesText(items[k]).length;
            if (offset <= o + n || k === items.length - 1) {
                return { item: k, offset: clamp(offset - o, 0, n) };
            }
            o += n + 1;
        }
        const last = items.length - 1;
        return { item: last, offset: inlinesText(items[last]).length };
    }
    function innerAt(blocks, offset) {
        const list = blocks || [];
        if (!list.length) return { i: 0, offset: 0, block: null };
        let o = 0;
        for (let k = 0; k < list.length; k++) {
            const n = blockText(list[k]).length;
            if (offset <= o + n || k === list.length - 1) {
                return { i: k, offset: clamp(offset - o, 0, n), block: list[k] };
            }
            o += n + 1;
        }
        const last = list.length - 1;
        return { i: last, offset: blockText(list[last]).length, block: list[last] };
    }
    function containerAt(pos) {
        const loc = locAt(state, pos);
        let blocks = state.blocks;
        let i = loc.block;
        let offset = loc.offset;
        let block = blocks[i];
        let parentBlocks = null;
        let parentIndex = -1;
        while (block && block.type === "quote" && block.blocks && block.blocks.length) {
            parentBlocks = blocks;
            parentIndex = i;
            const inner = innerAt(block.blocks, offset);
            blocks = block.blocks;
            i = inner.i;
            offset = inner.offset;
            block = blocks[i];
        }
        return { blocks, i, offset, block, parentBlocks, parentIndex };
    }
    function cellInTable(block, offset) {
        let o = 0;
        const rows = block.rows || [];
        for (let r = 0; r < rows.length; r++) {
            const row = rows[r] || [];
            for (let c = 0; c < row.length; c++) {
                const n = String(row[c] || "").length;
                if (offset <= o + n) return { r, c, offset: clamp(offset - o, 0, n) };
                o += n;
                if (r < rows.length - 1 || c < row.length - 1) o += 1;
            }
        }
        const r = Math.max(0, rows.length - 1);
        const c = Math.max(0, ((rows[r] || []).length - 1));
        return { r, c, offset: String((rows[r] || [])[c] || "").length };
    }
    function tableContext() {
        const loc = locAt(state, sel.from);
        const block = state.blocks[loc.block];
        if (!block || block.type !== "table") return null;
        const cell = cellInTable(block, loc.offset);
        return { block, i: loc.block, row: cell.r, col: cell.c, offset: cell.offset };
    }
    function isEmptyBlock(b) {
        if (!b) return true;
        if (b.type === "hr") return false;
        return !blockText(b);
    }
    function dropTrailingEmpty(blocks) {
        const list = blocks || [];

        return list;
    }
    function exportBlocks(doc) {
        const blocks = ((doc || state).blocks || []).slice();
        while (blocks.length > 1 && blocks[blocks.length - 1].type === "p" && isEmptyBlock(blocks[blocks.length - 1])) {
            blocks.pop();
        }
        return blocks;
    }
    function ensureTrail() {
        if (!state.blocks.length) {
            state = empty();
            return true;
        }
        const last = state.blocks[state.blocks.length - 1];

        state.blocks.push({ type: "p", inlines: [] });
        return true;
    }
    function landAtEnd() {

    function splitInlinesAt(ins, offset) {
        const split = splitInlines(ins, offset);
        const left = [], right = [];
        let o = 0;
        for (const r of split) {
            const n = (r.text || "").length;
            if (o + n <= offset) left.push(r);
            else if (o >= offset) right.push(r);
            o += n;
        }
        return { left: mergeInlines(left), right: mergeInlines(right) };
    }
    function deleteInItems(items, lo, hi) {
        if (lo === hi) return items;
        let o = 0, pending = null;
        const kept = [];
        const take = ins => { pending = pending ? mergeInlines(pending.concat(ins)) : ins; };
        const flush = () => { if (pending) { kept.push(pending); pending = null; } };
        for (let k = 0; k < items.length; k++) {
            const n = inlinesText(items[k]).length;
            const a = o, c = o + n;
            const hasSep = k < items.length - 1;
            let piece = items[k];
            if (hi > a && lo < c) piece = spliceInlines(piece, Math.max(0, lo - a), Math.min(n, hi - a), "");
            take(piece);
            if (!(hasSep && lo <= c && hi > c)) flush();
            o = c + (hasSep ? 1 : 0);
        }
        flush();
        return kept.length ? kept : [[]];
    }

    /* ---- inline parse / serialize ---------------------------------------- */
    function parseInlines(s, marks) {
        marks = marks || new Set();
        const runs = [];
        let i = 0, buf = "";
        const flush = () => {
            if (buf) { runs.push({ text: buf, marks: [...marks].sort() }); buf = ""; }
        };
        const tryPair = (open, close, mark) => {
            if (marks.has(mark)) return false;
            if (open === "*" && s.startsWith("**", i)) return false;
            if (!s.startsWith(open, i)) return false;
            const from = i + open.length;
            const j = s.indexOf(close, from);
            if (j < 0 || j === from) return false;
            flush();
            const next = new Set(marks);
            next.add(mark);
            runs.push(...parseInlines(s.slice(from, j), next));
            i = j + close.length;
            return true;
        };
        while (i < s.length) {
            if (s.startsWith("![", i)) {
                const m = s.slice(i).match(/^!\[([^\]]*)\]\(([^)]+)\)/);
                if (m) {
                    flush();
                    runs.push({ type: "image", text: m[1] || "", alt: m[1], src: m[2], marks: [...marks] });
                    i += m[0].length;
                    continue;
                }
            }
            if (s[i] === "[") {
                const m = s.slice(i).match(/^\[([^\]]+)\]\(([^)]+)\)/);
                if (m) {
                    flush();
                    const inner = parseInlines(m[1], marks);
                    inner.forEach(r => { r.href = m[2]; });
                    runs.push(...inner);
                    i += m[0].length;
                    continue;
                }
            }
            if (!marks.has("bold") && !marks.has("italic") && s.startsWith("***", i)) {
                const j = s.indexOf("***", i + 3);
                if (j > i + 3) {
                    flush();
                    const next = new Set(marks);
                    next.add("bold");
                    next.add("italic");
                    runs.push(...parseInlines(s.slice(i + 3, j), next));
                    i = j + 3;
                    continue;
                }
            }
            if (tryPair("**", "**", "bold")) continue;
            if (tryPair("++", "++", "underline")) continue;
            if (tryPair("~~", "~~", "strike")) continue;
            if (tryPair("`", "`", "code")) continue;
            if (tryPair("*", "*", "italic")) continue;
            if (s[i] === "_" && (i === 0 || /[^A-Za-z0-9_]/.test(s[i - 1])) && !marks.has("italic")) {
                const j = s.indexOf("_", i + 1);
                if (j > i + 1 && (j + 1 >= s.length || /[^A-Za-z0-9_]/.test(s[j + 1]))) {
                    flush();
                    const next = new Set(marks);
                    next.add("italic");
                    runs.push(...parseInlines(s.slice(i + 1, j), next));
                    i = j + 1;
                    continue;
                }
            }
            buf += s[i++];
        }
        flush();
        return mergeInlines(runs);
    }

    function serRun(r) {
        if (r.type === "image") return "![" + (r.alt || "") + "](" + (r.src || "") + ")";
        let s = r.text || "";
        const m = r.marks || [];
        const bold = m.includes("bold");
        const italic = m.includes("italic");
        if (m.includes("code")) s = "`" + s + "`";
        if (m.includes("strike")) s = "~~" + s + "~~";
        if (m.includes("underline")) s = "++" + s + "++";
        /* Never emit ***text*** — a ** pair would wrap "*text" and round-trip wrong. */
        if (italic) s = (bold ? "_" : "*") + s + (bold ? "_" : "*");
        if (bold) s = "**" + s + "**";
        if (r.href) s = "[" + s + "](" + r.href + ")";
        return s;
    }
    function serInlines(ins) { return (ins || []).map(serRun).join(""); }

    function serBlock(b) {
        switch (b.type) {
            case "h1": case "h2": case "h3": case "h4": case "h5": case "h6":
                return "#".repeat(+b.type[1]) + " " + serInlines(b.inlines);
            case "hr": return "---";
            case "pre": return "```" + (b.lang || "") + "\n" + (b.text || "") + "\n```";
            case "ul": return (b.items || []).map(it => "- " + serInlines(it)).join("\n");
            case "ol": return (b.items || []).map((it, i) => (i + 1) + ". " + serInlines(it)).join("\n");
            case "quote": {
                const kids = dropTrailingEmpty((b.blocks || []).slice());
                const inner = kids.map(serBlock).join("\n\n");
                return inner.split("\n").map(l => l === "" ? ">" : "> " + l).join("\n");
            }
            case "table": {
                const rows = b.rows || [];
                if (!rows.length) return "";
                const pipe = row => "| " + row.join(" | ") + " |";
                const lines = [pipe(rows[0]), "| " + rows[0].map(() => "---").join(" | ") + " |"];
                for (let i = 1; i < rows.length; i++) lines.push(pipe(rows[i]));
                return lines.join("\n");
            }
            default: return serInlines(b.inlines);
        }
    }

    function parse(md) {
        if (!md) return empty();
        const fences = [];
        md = String(md).replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, body) => {
            fences.push({ lang, body: body.replace(/\n$/, "") });
            return "\n\x00FENCE" + (fences.length - 1) + "\x00\n";
        });
        const lines = md.split("\n");
        const blocks = [];
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];
            const fm = line.match(/^\x00FENCE(\d+)\x00$/);
            if (fm) { blocks.push({ type: "pre", lang: fences[+fm[1]].lang, text: fences[+fm[1]].body }); i++; continue; }
            if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim()) && line.trim().length >= 3) { blocks.push({ type: "hr" }); i++; continue; }
            const h = line.match(/^(#{1,6})\s+(.*)$/);
            if (h) { blocks.push({ type: "h" + h[1].length, inlines: parseInlines(h[2]) }); i++; continue; }
            if (/^\s*$/.test(line)) { i++; continue; }
            if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i + 1].trim())) {
                const rows = [];
                while (i < lines.length && lines[i].trim().startsWith("|") && lines[i].trim().endsWith("|")) {
                    if (!/^\|[\s\-:|]+\|$/.test(lines[i].trim())) {
                        rows.push(lines[i].split("|").slice(1, -1).map(c => c.trim()));
                    }
                    i++;
                }
                blocks.push({ type: "table", rows });
                continue;
            }
            if (/^>/.test(line)) {
                const q = [];
                while (i < lines.length && /^>/.test(lines[i])) {
                    q.push(lines[i].replace(/^>\s?/, ""));
                    i++;
                }
                blocks.push({ type: "quote", blocks: parse(q.join("\n")).blocks });
                continue;
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                const got = collectList(lines, i, /^\s*[-*+]\s+/);
                blocks.push({ type: "ul", items: got.items });
                i = got.i;
                continue;
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                const got = collectList(lines, i, /^\s*\d+\.\s+/);
                blocks.push({ type: "ol", items: got.items });
                i = got.i;
                continue;
            }
            const para = [];
            while (i < lines.length && lines[i].trim() !== ""
                && !/^(#{1,6}\s|\x00FENCE|>\s?|[-*+]\s|\d+\.\s|\|)/.test(lines[i])
                && !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
                para.push(lines[i]);
                i++;
            }
            blocks.push({ type: "p", inlines: parseInlines(para.join(" ")) });
        }
        if (!blocks.length) blocks.push({ type: "p", inlines: [] });

    }

    function collectList(lines, start, re) {
        const items = [];
        let i = start;
        while (i < lines.length) {
            if (re.test(lines[i])) {
                items.push(parseInlines(lines[i].replace(re, "")));
                i++;
                continue;
            }
            if (/^\s*$/.test(lines[i])) {
                let j = i;
                while (j < lines.length && /^\s*$/.test(lines[j])) j++;
                if (j < lines.length && re.test(lines[j])) {
                    i = j;
                    continue;
                }
            }
            break;
        }
        return { items, i };
    }

    function mergeAdjacentLists(blocks) {
        const out = [];
        for (const b of blocks) {
            const prev = out[out.length - 1];
            if (prev && (b.type === "ol" || b.type === "ul") && prev.type === b.type) {
                prev.items = (prev.items || []).concat(b.items || []);
            } else out.push(b);
        }
        return out;
    }

    function toMarkdown(doc) {
        return exportBlocks(doc || state).map(serBlock).join("\n\n");
    }

    /* ---- HTML render ----------------------------------------------------- */
    function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escUrl(u) {
        u = String(u || "").trim();
        if (/^(javascript|data|vbscript):/i.test(u)) return "#";
        return esc(u);
    }
    function wrapRun(r, from, mapped) {
        const to = from + (r.text || "").length;
        if (r.type === "image") {
            return "<img src=\"" + escUrl(r.src) + "\" alt=\"" + esc(r.alt || "") + "\""
                + (mapped ? " data-from=\"" + from + "\" data-to=\"" + to + "\"" : "") + ">";
        }
        let inner = esc(r.text || "");
        const order = ["code", "strike", "underline", "italic", "bold"];
        for (const mk of order) {
            if ((r.marks || []).includes(mk)) inner = "<" + MARK_TAG[mk] + ">" + inner + "</" + MARK_TAG[mk] + ">";
        }
        if (r.href) inner = "<a href=\"" + escUrl(r.href) + "\">" + inner + "</a>";
        if (mapped) inner = "<span data-from=\"" + from + "\" data-to=\"" + to + "\">" + inner + "</span>";
        return inner;
    }
    function renderInlines(ins, from, mapped) {
        let html = "", pos = from;
        for (const r of ins || []) {
            html += wrapRun(r, pos, mapped);
            pos += (r.text || "").length;
        }
        return html;
    }
    function renderBlock(b, from, mapped) {
        const body = () => renderInlines(b.inlines, from, mapped);
        const caretHole = () => (mapped && !inlinesText(b.inlines))
            ? "<span data-from=\"" + from + "\" data-to=\"" + from + "\"><br></span>"
            : "";
        switch (b.type) {
            case "h1": case "h2": case "h3": case "h4": case "h5": case "h6":
                return "<" + b.type + ">" + (body() || caretHole()) + "</" + b.type + ">";
            case "hr":
                return mapped
                    ? "<hr data-from=\"" + from + "\" data-to=\"" + (from + 1) + "\">"
                    : "<hr>";
            case "pre": {
                const lang = String(b.lang || "").replace(/[^a-zA-Z0-9_-]/g, "");
                const body = b.text || "";
                const inner = mapped

            const cell = cellInTable(block, offset);
            const cur = String(block.rows[cell.r][cell.c] || "");
            const t = String(text || "").replace(/\n/g, " ");
            block.rows[cell.r][cell.c] = cur.slice(0, cell.offset) + t + cur.slice(cell.offset);
            return;
        }
        if (block.type === "quote" && block.blocks) {
            const inner = innerAt(block.blocks, offset);
            insertAt(inner.block, inner.offset, text, marks);
            return;
        }
        if (block.items) {
            const it = itemAt(block, offset);
            block.items[it.item] = spliceInlines(block.items[it.item], it.offset, it.offset, text, marks);
            return;
        }
        if (block.inlines) {
            block.inlines = spliceInlines(block.inlines, offset, offset, text, marks);
            return;
        }
        if (block.text != null) {
            block.text = (block.text || "").slice(0, offset) + text + (block.text || "").slice(offset);
        }
    }

    function insertText(text) {
        let { from, to } = sel;
        if (from !== to) from = deleteRange(from, to);
        const c0 = containerAt(from);
        if (c0.block && c0.block.type === "pre") {
            const t = String(text || "");
            insertAt(c0.block, c0.offset, t, []);
            setSelection(from + t.length, from + t.length);
            return;
        }
        if (c0.block && c0.block.type === "table") {
            const t = String(text || "").replace(/\n/g, " ");
            insertAt(c0.block, c0.offset, t, []);
            setSelection(from + t.length, from + t.length);
            return;
        }
        const parts = String(text || "").split("\n");
        const leftMarks = (runContaining(from > 0 ? from - 1 : from) || {}).marks || [];
        const loc = locAt(state, from);
        insertAt(state.blocks[loc.block], loc.offset, parts[0], leftMarks);
        let pos = from + parts[0].length;
        for (let p = 1; p < parts.length; p++) {
            setSelection(pos, pos);
            splitBlock();
            pos = sel.from;
            const loc2 = locAt(state, pos);
            insertAt(state.blocks[loc2.block], loc2.offset, parts[p], leftMarks);
            pos += parts[p].length;
        }
        setSelection(pos, pos);
    }

    function insertInlineMarkdown(md) {
        let { from, to } = sel;
        if (from !== to) from = deleteRange(from, to);
        const c = containerAt(from);
        if (c.block && c.block.type === "pre") {
            insertAt(c.block, c.offset, md, []);
            setSelection(from + String(md).length);
            return;
        }
        const runs = parseInlines(md);
        const n = runs.reduce((s, r) => s + (r.text || "").length, 0);
        let ins = null, off = c.offset;
        if (c.block && c.block.items) {
            const it = itemAt(c.block, c.offset);
            ins = c.block.items[it.item];
            off = it.offset;
        } else if (c.block && c.block.inlines) {
            ins = c.block.inlines;
        }
        if (!ins) {
            insertText(md);
            return;
        }
        const { left, right } = splitInlinesAt(ins, off);
        const next = mergeInlines(left.concat(runs).concat(right));
        if (c.block.items) {
            const it = itemAt(c.block, c.offset);
            c.block.items[it.item] = next;
        } else c.block.inlines = next;
        setSelection(from + n);
    }

    function paste(text) {
        text = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        if (!text) return;
        const parsed = parse(text);
        const structured = parsed.blocks.some(b => b.type !== "p") || parsed.blocks.length > 1;
        if (!structured) {
            insertText(text.replace(/\n+$/, ""));
            return;
        }
        let { from, to } = sel;
        if (from !== to) from = deleteRange(from, to);
        setSelection(from, from);
        const loc = locAt(state, from);
        const cur = state.blocks[loc.block];
        const empty = !blockText(cur);
        let at = loc.block;
        if (!empty && loc.offset > 0) {
            if (loc.offset < blockText(cur).length) splitBlock();
            else {
                state.blocks.splice(loc.block + 1, 0, { type: "p", inlines: [] });
                at = loc.block + 1;
                setSelection(index(state)[at].from);
            }
            at = locAt(state, sel.from).block;
        }
        if (!blockText(state.blocks[at] || {})) {
            state.blocks.splice(at, 1, ...parsed.blocks);
        } else {
            state.blocks.splice(at, 0, ...parsed.blocks);
        }
        const ix = index(state);
        const last = ix[Math.min(at + parsed.blocks.length - 1, ix.length - 1)];
        setSelection(last ? last.to : totalLen(state));
    }

    function exitListAt(blockIndex, itemIndex) {
        const block = state.blocks[blockIndex];
        const before = block.items.slice(0, itemIndex);
        const after = block.items.slice(itemIndex + 1);
        const replacement = [];
        if (before.length) replacement.push({ type: block.type, items: before });
        replacement.push({ type: "p", inlines: [] });
        if (after.length) replacement.push({ type: block.type, items: after });
        state.blocks.splice(blockIndex, 1, ...replacement);
        const paraI = blockIndex + (before.length ? 1 : 0);
        const at = index(state)[paraI].from;
        setSelection(at, at);
    }

    function splitBlock() {
        const { from } = sel;
        const c = containerAt(from);
        const block = c.block;
        if (!block) return;
        if (block.type === "pre") {
            const t = block.text || "";
            const o = clamp(c.offset, 0, t.length);
            block.text = t.slice(0, o) + "\n" + t.slice(o);
            setSelection(from + 1, from + 1);
            return;
        }
        if (block.type === "table") {
            insertRow("below");
            return;
        }
        if (block.items) {
            const it = itemAt(block, c.offset);
            if (!inlinesText(block.items[it.item])) {
                if (c.blocks === state.blocks) {
                    exitListAt(c.i, it.item);
                } else {
                    const before = block.items.slice(0, it.item);
                    const after = block.items.slice(it.item + 1);
                    const replacement = [];
                    if (before.length) replacement.push({ type: block.type, items: before });
                    replacement.push({ type: "p", inlines: [] });
                    if (after.length) replacement.push({ type: block.type, items: after });
                    c.blocks.splice(c.i, 1, ...replacement);
                    setSelection(from, from);
                }
                return;
            }
            const { left, right } = splitInlinesAt(block.items[it.item], it.offset);
            block.items[it.item] = left;
            block.items.splice(it.item + 1, 0, right);
            setSelection(from + 1, from + 1);
            return;
        }
        if (!block.inlines) {
            c.blocks.splice(c.i + 1, 0, { type: "p", inlines: [] });
            setSelection(from + 1, from + 1);
            return;
        }
        const empty = !inlinesText(block.inlines);
        const atEnd = c.offset >= inlinesText(block.inlines).length;
        const last = c.i === c.blocks.length - 1;
        if (c.parentBlocks && (empty || (last && atEnd))) {
            exitQuoteAt(c);
            return;
        }
        const { left, right } = splitInlinesAt(block.inlines, c.offset);
        block.inlines = left;
        c.blocks.splice(c.i + 1, 0, { type: "p", inlines: right });
        setSelection(from + 1, from + 1);
    }

    function blockStart(target) {
        const walk = (blocks, pos) => {
            for (let i = 0; i < blocks.length; i++) {
                if (blocks[i] === target) return pos;
                if (blocks[i].blocks) {
                    const hit = walk(blocks[i].blocks, pos);
                    if (hit >= 0) return hit;
                }
                pos += blockText(blocks[i]).length + (i < blocks.length - 1 ? 1 : 0);
            }
            return -1;
        };
        return walk(state.blocks, 0);
    }

    function exitQuoteAt(c) {
        const parent = c.parentBlocks;
        const qi = c.parentIndex;
        const quote = parent[qi];
        const empty = c.block && c.block.inlines && !inlinesText(c.block.inlines);
        if (empty) quote.blocks.splice(c.i, 1);
        const para = { type: "p", inlines: [] };
        let target;
        if (!(quote.blocks && quote.blocks.length)) {
            parent.splice(qi, 1, para);
            target = para;
        } else if (parent[qi + 1] && parent[qi + 1].type === "p" && isEmptyBlock(parent[qi + 1])) {
            target = parent[qi + 1];
        } else {
            parent.splice(qi + 1, 0, para);
            target = para;
        }
        const at = blockStart(target);
        setSelection(at < 0 ? totalLen(state) : at);
    }

    function deleteBackward() {
        let { from, to } = sel;
        if (from !== to) { setSelection(deleteRange(from, to)); return; }
        if (from <= 0) return;
        const c = containerAt(from);
        const block = c.block;
        if (block && block.type === "hr") {
            c.blocks.splice(c.i, 1);
            ensureTrail();
            setSelection(from > 0 ? from - 1 : 0);
            return;
        }
        if (c.offset === 0 && c.i > 0 && c.blocks[c.i - 1] && c.blocks[c.i - 1].type === "hr") {
            c.blocks.splice(c.i - 1, 1);
            ensureTrail();
            setSelection(from > 0 ? from - 1 : 0);
            return;
        }
        if (block && block.items) {
            const it = itemAt(block, c.offset);
            if (it.offset === 0 && it.item > 0) {
                block.items[it.item - 1] = mergeInlines(block.items[it.item - 1].concat(block.items[it.item]));
                block.items.splice(it.item, 1);
                setSelection(from - 1);
                return;
            }
            if (it.offset === 0 && it.item === 0) {
                const first = block.items[0];
                const rest = block.items.slice(1);
                const para = { type: "p", inlines: first };
                if (rest.length) c.blocks.splice(c.i, 1, para, { type: block.type, items: rest });
                else c.blocks[c.i] = para;
                setSelection(from);
                return;
            }
        }
        if (c.offset === 0 && c.i > 0) {
            const prev = c.blocks[c.i - 1];
            const cur = block;
            if (prev && prev.inlines && cur && cur.inlines) {
                prev.inlines = mergeInlines(prev.inlines.concat(cur.inlines));
                c.blocks.splice(c.i, 1);
                setSelection(from - 1);
                return;
            }
            if (prev && prev.items && cur && cur.inlines) {
                prev.items.push(cur.inlines);
                c.blocks.splice(c.i, 1);
                setSelection(from - 1);
                return;
            }
        }
        deleteRange(from - 1, from);
        setSelection(from - 1);
    }
    function deleteForward() {
        let { from, to } = sel;
        if (from !== to) { setSelection(deleteRange(from, to)); return; }
        const n = totalLen(state);
        if (from >= n) return;
        deleteRange(from, from + 1);
        setSelection(from);
    }

    function load(md) {
        state = parse(md);
        ensureTrail();
        const n = totalLen(state);
        sel = { from: clamp(sel.from, 0, n), to: clamp(sel.to, 0, n) };
        return state;
    }

    /* ---- caret map ------------------------------------------------------- */
    function domPointToDoc(root, node, offset) {
        if (!root || !node) return 0;
        const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        const holder = el && el.closest ? el.closest("[data-from]") : null;
        if (holder && root.contains(holder)) {
            const base = +holder.getAttribute("data-from");
            try {
                const prefix = document.createRange();
                prefix.selectNodeContents(holder);
                prefix.setEnd(node, offset);
                return base + prefix.toString().length;
            } catch (e) { return base; }
        }
        const spans = root.querySelectorAll("[data-from]");
        if (!spans.length) return 0;
        return +spans[spans.length - 1].getAttribute("data-to") || 0;
    }
    function readPreviewSelection(root) {
        if (typeof window === "undefined") return sel;
        const s = window.getSelection();
        if (!s.rangeCount) return sel;
        const r = s.getRangeAt(0);
        const hrFromRange = () => {
            const nodes = [r.startContainer, r.endContainer];
            if (r.startContainer.nodeType === 1) {
                const c = r.startContainer.childNodes[r.startOffset];
                if (c) nodes.push(c);
            }
            for (const n of nodes) {
                if (!n) continue;
                if (n.nodeType === 1 && n.tagName === "HR" && root.contains(n)) return n;
                const el = n.nodeType === 1 ? n : n.parentElement;
                const hr = el && el.closest && el.closest("hr[data-from]");
                if (hr && root.contains(hr)) return hr;
            }
            return null;
        };
        const hr = hrFromRange();
        if (hr) {
            setSelection(+hr.getAttribute("data-from"), +hr.getAttribute("data-to") || +hr.getAttribute("data-from") + 1);
            return sel;
        }
        if (!root.contains(s.anchorNode)) return sel;
        let a = domPointToDoc(root, r.startContainer, r.startOffset);
        let b = domPointToDoc(root, r.endContainer, r.endOffset);
        setSelection(a, b);
        return sel;
    }
    function docPointToDom(root, pos) {
        const spans = [...root.querySelectorAll("[data-from]")];
        if (!spans.length) return null;
        for (let i = 0; i < spans.length; i++) {
            const a = +spans[i].getAttribute("data-from");
            const b = +spans[i].getAttribute("data-to");
            if (pos < a || pos > b) continue;
            if (pos === b && i < spans.length - 1 && +spans[i + 1].getAttribute("data-from") === pos) continue;
            let remain = pos - a;
            const walker = document.createTreeWalker(spans[i], NodeFilter.SHOW_TEXT);
            let n;
            while ((n = walker.nextNode())) {
                if (remain <= n.length) return { node: n, offset: remain };
                remain -= n.length;
            }
            const texts = spans[i].querySelectorAll ? null : null;
            return { node: spans[i], offset: 0 };
        }
        const last = spans[spans.length - 1];
        const walker = document.createTreeWalker(last, NodeFilter.SHOW_TEXT);
        let n, lastText = null;
        while ((n = walker.nextNode())) lastText = n;
        if (lastText) return { node: lastText, offset: lastText.length };
        return null;
    }
    function restorePreviewSelection(root) {
        if (typeof window === "undefined") return;
        const a = docPointToDom(root, sel.from);
        const b = docPointToDom(root, sel.to);
        if (!a || !b) return;
        try {
            const r = document.createRange();
            r.setStart(a.node, a.offset);
            r.setEnd(b.node, b.offset);
            const s = window.getSelection();
            s.removeAllRanges();
            s.addRange(r);
        } catch (e) { /* layout not ready */ }
    }

    return {
        empty, parse, load, get,
        toMarkdown, html, previewHTML,
        selection, setSelection,
        toggleMark, toggleBlock, indentQuote, outdentQuote, insertHr,
        insertRow, deleteRow, insertCol, deleteCol, tableContext,
        insertText, insertInlineMarkdown, paste, splitBlock, deleteBackward, deleteForward, deleteRange,
        marksAt, blockTypeAt, totalLen: () => totalLen(state),
        ensureTrail, landAtEnd,
        readPreviewSelection, restorePreviewSelection,
        MARK_TAG, TAG_MARK
    };
})();

// ============================================================================
// MARKDOWN PARSER — clean HTML for export. Live preview uses Doc.previewHTML.
// ============================================================================
const MarkdownParser = {
    parse(markdown) {
        return Doc.html(Doc.parse(markdown || ""));
    }
};

/* @requires-dom — HtmlToMarkdown uses document.createElement. */
// ============================================================================
// HTML TO MARKDOWN CONVERTER
// ============================================================================
const HtmlToMarkdown = {
    convert(html) {
        if (!html) return '';
        
        // Create a temporary container
        const temp = document.createElement('div');
        temp.innerHTML = html;
        
        return this.processNode(temp).trim();
    },
    
    processNode(node) {
        let result = '';
        
        for (const child of node.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                result += child.textContent;
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                result += this.convertElement(child);
            }
        }
        
        return result;
    },
    
    convertElement(el) {
        const tag = el.tagName.toLowerCase();
        const content = this.processNode(el);
        
        switch (tag) {
            case 'strong':
            case 'b':
                return this.wrapInline('**', content);
            case 'em':
            case 'i':
                return this.wrapInline('*', content);
            case 'u':
                return this.wrapInline('++', content);
            case 'del':
            case 's':
                return this.wrapInline('~~', content);
            case 'h1':
                return `# ${content}\n\n`;
            case 'h2':
                return `## ${content}\n\n`;
            case 'h3':
                return `### ${content}\n\n`;
            case 'h4':
                return `#### ${content}\n\n`;
            case 'h5':
                return `##### ${content}\n\n`;
            case 'h6':
                return `###### ${content}\n\n`;
            case 'p':
                return `${content}\n\n`;
            case 'br':
                return '\n';
            case 'hr':
                return '---\n\n';
            case 'a':
                return `[${content}](${el.getAttribute('href') || ''})`;
            case 'img':
                return `![${el.getAttribute('alt') || ''}](${el.getAttribute('src') || ''})`;
            case 'code':
                if (el.parentElement && el.parentElement.tagName.toLowerCase() === 'pre') {
                    return content;
                }
                return `\`${content}\``;
            case 'pre':
                const codeEl = el.querySelector('code');
                const lang = codeEl ? (codeEl.className.replace('language-', '') || '') : '';
                return `\`\`\`${lang}\n${content}\n\`\`\`\n\n`;
            case 'blockquote':
                return this.convertBlockquote(el);
            case 'ul':
                return this.convertList(el, 'ul');
            case 'ol':
                return this.convertList(el, 'ol');
            case 'li':
                return content;
            case 'table':
                return this.convertTable(el);
            case 'thead':
            case 'tbody':
            case 'tr':
            case 'th':
            case 'td':
                return content;
            case 'div':
                return content + (content.endsWith('\n') ? '' : '\n');
            default:
                return content;
        }
    },

    /* Keep leading/trailing spaces outside the markers so
       <strong>Widget </strong> becomes **Widget** not **Widget **. */
    wrapInline(marker, content) {
        const lead = content.match(/^\s*/)[0];
        const trail = content.match(/\s*$/)[0];
        const core = content.slice(lead.length, content.length - trail.length);
        if (!core) return content;
        return lead + marker + core + marker + trail;
    },
    
    convertBlockquote(el, depth = 1) {
        const prefix = '>'.repeat(depth) + ' ';
        let result = '';
        
        for (const child of el.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                const text = child.textContent.trim();
                if (text) {
                    result += text.split('\n').map(line => prefix + line).join('\n') + '\n';
                }
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                const tag = child.tagName.toLowerCase();
                if (tag === 'blockquote') {
                    result += this.convertBlockquote(child, depth + 1);
                } else if (tag === 'ul' || tag === 'ol') {
                    result += this.convertListInBlockquote(child, tag, depth);
                } else if (tag === 'p') {
                    const content = this.processNode(child);
                    result += content.split('\n').map(line => prefix + line).join('\n') + '\n';
                } else {
                    const content = this.convertElement(child);
                    result += content.split('\n').filter(l => l.trim()).map(line => prefix + line).join('\n') + '\n';
                }
            }
        }
        
        return result + '\n';
    },
    
    convertListInBlockquote(el, type, quoteDepth) {
        const prefix = '>'.repeat(quoteDepth) + ' ';
        let result = '';
        let index = 1;
        
        for (const li of el.querySelectorAll(':scope > li')) {
            const content = this.processNode(li);
            const marker = type === 'ol' ? `${index}. ` : '- ';
            result += prefix + marker + content + '\n';
            index++;
        }
        
        return result;
    },
    
    convertTable(el) {
        const rows = Array.from(el.querySelectorAll('tr'));
        if (!rows.length) return '';
        const cells = row => Array.from(row.querySelectorAll('th,td'))
            .map(c => this.processNode(c).replace(/\|/g, '\\|').trim());
        const header = cells(rows[0]);
        if (!header.length) return '';
        let md = '| ' + header.join(' | ') + ' |\n';
        md += '| ' + header.map(() => '---').join(' | ') + ' |\n';
        for (let i = 1; i < rows.length; i++) {
            md += '| ' + cells(rows[i]).join(' | ') + ' |\n';
        }
        return md + '\n';
    },

    convertList(el, type) {
        let result = '';
        let index = 1;
        
        for (const li of el.querySelectorAll(':scope > li')) {
            const content = this.processNode(li);
            const marker = type === 'ol' ? `${index}. ` : '- ';
            result += marker + content + '\n';
            index++;
        }
        
        return result + '\n';
    }
};

// ============================================================================
// APPLICATION STATE
// ============================================================================
const AppState = {
    currentFile: null,
    isModified: false,
    activePane: 'editor',
    viewMode: 'both', // 'editor', 'preview', or 'both'

    setModified(modified) {
        this.isModified = modified;
        DOM.unsavedIndicator.style.display = modified ? 'inline-block' : 'none';
    }
};

/* @requires-dom */
// ============================================================================
// UNDO / REDO — one stack for both panes. A snapshot is the markdown plus the
// caret in whichever pane was active. Every entry carries a label naming the
// step that produced it, so the Undo/Redo tooltips and the History panel can
// say what will happen. Typing coalesces (350 ms idle); toolbar and menu
// actions commit at once.
// ============================================================================
const History = {
    stack: [],
    index: -1,
    max: 100,
    locked: false,
    _timer: null,
    _pendingLabel: null,

    capture(label) {
        const sel = Doc.selection();
        return {
            label: label || "Edit",
            at: Date.now(),
            md: DOM.editor.value,
            from: sel.from,
            to: sel.to,
            editorFrom: DOM.editor.selectionStart,
            editorTo: DOM.editor.selectionEnd,
            pane: AppState.activePane
        };
    },

    /* A discrete step (Bold, Insert table, Paste). Flushes pending typing
       first so the typing and the step are two separate entries. */
    commit(label) {
        if (this.locked) return;
        this.flush();
        this._push(this.capture(label));
    },

    /* Typing. Coalesces into one entry until 350 ms pass without input
       or something else commits. */
    schedule(label) {
        if (this.locked) return;
        this._pendingLabel = label || "Typing";
        if (this._timer) clearTimeout(this._timer);
        this._timer = setTimeout(() => {
            this._timer = null;
            this._push(this.capture(this._pendingLabel));
        }, 350);
    },

    flush() {
        if (!this._timer) return;
        clearTimeout(this._timer);
        this._timer = null;
        this._push(this.capture(this._pendingLabel));
    },

    _push(cap) {
        const top = this.stack[this.index];
        if (top && top.md === cap.md) {
            top.from = cap.from;
            top.to = cap.to;
            top.editorFrom = cap.editorFrom;
            top.editorTo = cap.editorTo;
            top.pane = cap.pane;
            this.render();
            return;
        }
        this.stack = this.stack.slice(0, this.index + 1);
        this.stack.push(cap);
        if (this.stack.length > this.max) this.stack.shift();
        this.index = this.stack.length - 1;
        this.render();
    },

    reset(label) {
        if (this._timer) {
            clearTimeout(this._timer);
            this._timer = null;
        }
        this.stack = [];
        this.index = -1;
        this._push(this.capture(label || "Start"));
    },

    apply(cap) {
        this.locked = true;
        try {
            DOM.editor.value = cap.md;
            Doc.load(cap.md);
            Doc.setSelection(cap.from, cap.to);
            DOM.preview.innerHTML = Doc.previewHTML();
            AppState.activePane = cap.pane || "editor";
            if (cap.pane === "preview") {
                DOM.preview.focus();
                Doc.restorePreviewSelection(DOM.preview);
                IconHighlighter.checkPreviewFormats();
            } else {
                DOM.editor.focus();
                const n = DOM.editor.value.length;
                const a = Math.max(0, Math.min(n, cap.editorFrom || 0));
                const b = Math.max(0, Math.min(n, cap.editorTo || a));
                DOM.editor.setSelectionRange(a, b);
                IconHighlighter.checkEditorFormats();
            }
            EditorOps.updateStatus();
            AppState.setModified(true);
        } finally {
            this.locked = false;
        }
        this.render();
    },

    undo() {
        this.flush();
        if (this.index <= 0) return false;
        this.index--;
        this.apply(this.stack[this.index]);
        Logger.info("History", "Undo -> #" + this.index + " " + this.stack[this.index].label);
        return true;
    },

    redo() {
        this.flush();
        if (this.index >= this.stack.length - 1) return false;
        this.index++;
        this.apply(this.stack[this.index]);
        Logger.info("History", "Redo -> #" + this.index + " " + this.stack[this.index].label);
        return true;
    },

    goTo(i) {
        this.flush();
        if (i < 0 || i >= this.stack.length || i === this.index) return false;
        this.index = i;
        this.apply(this.stack[i]);
        Logger.info("History", "Jump -> #" + i + " " + this.stack[i].label);
        return true;
    },

    canUndo() { return this.index > 0; },
    canRedo() { return this.index < this.stack.length - 1; },

    /* ---- visibility ------------------------------------------------------ */

    /* What changed between entry i-1 and entry i: the text removed and the
       text added, found by stripping the common prefix and suffix. */
    diffAt(i) {
        const b = this.stack[i] ? this.stack[i].md : "";
        const a = i > 0 && this.stack[i - 1] ? this.stack[i - 1].md : "";
        let p = 0;
        const maxP = Math.min(a.length, b.length);
        while (p < maxP && a[p] === b[p]) p++;
        let s = 0;
        while (s < maxP - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
        return {
            removed: a.slice(p, a.length - s),
            added: b.slice(p, b.length - s),
            at: p,
            delta: b.length - a.length
        };
    },

    snippet(s, n) {
        n = n || 36;
        s = String(s).replace(/\n/g, "⏎");
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
    },

    summary() {
        const n = this.stack.length;
        return {
            entries: n,
            undo: Math.max(0, this.index),
            redo: Math.max(0, n - 1 - this.index),
            index: this.index,
            current: this.stack[this.index] || null,
            next: this.stack[this.index + 1] || null
        };
    },

    updateButtons() {
        const s = this.summary();
        if (DOM.undoBtn) {
            DOM.undoBtn.disabled = !this.canUndo();
            DOM.undoBtn.title = (this.canUndo() ? "Undo: " + s.current.label : "Nothing to undo") + " (Ctrl+Z)";
        }
        if (DOM.redoBtn) {
            DOM.redoBtn.disabled = !this.canRedo();
            DOM.redoBtn.title = (this.canRedo() ? "Redo: " + s.next.label : "Nothing to redo") + " (Ctrl+Y)";
        }
        if (DOM.historyBtn) {
            DOM.historyBtn.title = "History: " + s.undo + " to undo, " + s.redo + " to redo (Ctrl+Shift+H)";
        }
    },

    isPanelOpen() {
        return !!(DOM.historyPanel && DOM.historyPanel.classList.contains("visible"));
    },

    togglePanel(force) {
        if (!DOM.historyPanel) return;
        const open = force === undefined ? !this.isPanelOpen() : !!force;
        DOM.historyPanel.classList.toggle("visible", open);
        if (DOM.historyBtn) DOM.historyBtn.classList.toggle("active", open);
        if (open) this.render();
    },

    render() {
        this.updateButtons();
        if (!this.isPanelOpen() || !DOM.historyList) return;
        const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        const time = t => new Date(t).toLocaleTimeString("en-US", { hour12: false });
        const s = this.summary();
        if (DOM.historySummary) {
            DOM.historySummary.textContent = s.entries + " snapshot" + (s.entries === 1 ? "" : "s")
                + " · " + s.undo + " to undo · " + s.redo + " to redo";
        }
        let html = "";
        for (let i = this.stack.length - 1; i >= 0; i--) {
            const e = this.stack[i];
            const d = this.diffAt(i);
            const state = i === this.index ? "current" : (i < this.index ? "undo" : "redo");
            let change = "";
            if (i > 0) {
                if (d.removed) change += "<span class=\"hist-del\">−" + esc(this.snippet(d.removed)) + "</span>";
                if (d.added) change += "<span class=\"hist-add\">+" + esc(this.snippet(d.added)) + "</span>";
                if (!d.removed && !d.added) change = "<span class=\"hist-nil\">no text change</span>";
            } else {
                change = "<span class=\"hist-nil\">" + e.md.length + " chars</span>";
            }
            const hint = state === "current" ? "Current state"
                : (state === "undo" ? "Click to undo back to here" : "Click to redo forward to here");
            html += "<div class=\"hist-entry " + state + "\" data-index=\"" + i + "\" title=\"" + hint + "\">"
                + "<div class=\"hist-head\"><span class=\"hist-idx\">#" + i + "</span>"
                + "<span class=\"hist-label\">" + esc(e.label) + "</span>"
                + "<span class=\"hist-meta\">" + (e.pane === "preview" ? "preview" : "raw")
                + " · " + (d.delta >= 0 ? "+" : "") + d.delta + " · " + time(e.at) + "</span></div>"
                + "<div class=\"hist-change\">" + change + "</div>"
                + "</div>";
        }
        DOM.historyList.innerHTML = html;
        const cur = DOM.historyList.querySelector(".hist-entry.current");
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    }
};

// ============================================================================
// TABLE OPERATIONS
// ============================================================================
const TableOps = {
    openModal() {
        ModalOps.saveCaret();
        this.updatePreview();
        DOM.tableModal.classList.add('active');
        DOM.tableRows.focus();
    },
    
    closeModal() {
        DOM.tableModal.classList.remove('active');
        DOM.tableRows.value = '3';
        DOM.tableCols.value = '3';
    },
    
    updatePreview() {
        const rows = parseInt(DOM.tableRows.value) || 3;
        const cols = parseInt(DOM.tableCols.value) || 3;
        
        let html = '<table><thead><tr>';
        for (let c = 0; c < cols; c++) {
            html += `<th>Header ${c + 1}</th>`;
        }
        html += '</tr></thead><tbody>';
        
        for (let r = 0; r < rows - 1; r++) {
            html += '<tr>';
            for (let c = 0; c < cols; c++) {
                html += `<td>Cell ${r + 1}-${c + 1}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        
        DOM.tablePreview.innerHTML = html;
    },
    
    generateMarkdown(rows, cols) {
        let md = '';
        
        // Header row
        md += '|';
        for (let c = 0; c < cols; c++) {
            md += ` Header ${c + 1} |`;
        }
        md += '\n';
        
        // Separator row
        md += '|';
        for (let c = 0; c < cols; c++) {
            md += ' --- |';
        }
        md += '\n';
        
        // Data rows
        for (let r = 0; r < rows - 1; r++) {
            md += '|';
            for (let c = 0; c < cols; c++) {
                md += ` Cell ${r + 1}-${c + 1} |`;
            }
            md += '\n';
        }
        
        return md;
    },
    
    insert() {
        const rows = parseInt(DOM.tableRows.value) || 3;
        const cols = parseInt(DOM.tableCols.value) || 3;
        
        const tableMd = this.generateMarkdown(rows, cols).trim();
        this.closeModal();
        const s = ModalOps._saved;
        if (s && s.pane === "preview") {
            AppState.activePane = "preview";
            Doc.setSelection(s.from, s.to);
            Doc.paste(tableMd);
            syncFromDoc("preview");
            DOM.preview.focus();
        } else {
            const editor = DOM.editor;
            const start = s && s.editorStart != null ? s.editorStart : editor.selectionStart;
            const end = s && s.editorEnd != null ? s.editorEnd : editor.selectionEnd;
            const content = editor.value;
            let prefix = "";
            let suffix = "\n";
            if (start > 0 && content[start - 1] !== "\n") prefix = "\n\n";
            else if (start > 1 && content[start - 2] !== "\n") prefix = "\n";
            EditorOps.replaceSpan(start, end, prefix + tableMd + suffix);
            EditorOps.updatePreviewNow();
            AppState.setModified(true);
            DOM.editor.focus();
        }
        History.commit("Insert " + rows + "x" + cols + " table");
        Logger.info("Table", "Inserted " + rows + "x" + cols + " table");
    },

    apply(op) {
        if (AppState.activePane === "preview") Doc.readPreviewSelection(DOM.preview);
        if (op === "rowAbove") Doc.insertRow("above");
        else if (op === "rowBelow") Doc.insertRow("below");
        else if (op === "rowDel") Doc.deleteRow();
        else if (op === "colLeft") Doc.insertCol("left");
        else if (op === "colRight") Doc.insertCol("right");
        else if (op === "colDel") Doc.deleteCol();
        const focus = AppState.activePane === "preview" ? "preview" : "editor";
        syncFromDoc(focus);
        if (focus === "editor") DOM.editor.focus();
        const labels = {
            rowAbove: "Insert row above", rowBelow: "Insert row below", rowDel: "Delete row",
            colLeft: "Insert column left", colRight: "Insert column right", colDel: "Delete column"
        };
        History.commit(labels[op] || "Table edit");
    }
};

// ============================================================================
// EDITOR OPERATIONS
// ============================================================================
const EditorOps = {
    lineBounds(text, start, end) {
        const lineStart = text.lastIndexOf('\n', start - 1) + 1;
        let lineEnd = text.indexOf('\n', end);
        if (lineEnd === -1) lineEnd = text.length;
        return { lineStart, lineEnd };
    },

    replaceSpan(from, to, insert, selFrom, selTo) {
        const editor = DOM.editor;
        editor.setRangeText(insert, from, to, 'end');
        if (selFrom != null) {
            editor.selectionStart = selFrom;
            editor.selectionEnd = selTo;
        }
    },

    /**
     * Apply inline formatting to selected text in editor
     */
    applyInlineFormat(format) {
        const editor = DOM.editor;
        let start = editor.selectionStart;
        let end = editor.selectionEnd;
        const text = editor.value;
        while (start < end && /\s/.test(text[end - 1])) end--;
        while (start < end && /\s/.test(text[start])) start++;
        const selected = text.substring(start, end);
        if (!selected && editor.selectionStart !== editor.selectionEnd) {
            return;
        }
        
        let wrapper;
        switch (format) {
            case 'bold': wrapper = '**'; break;
            case 'italic': wrapper = '*'; break;
            case 'underline': wrapper = '++'; break;
            case 'strike': wrapper = '~~'; break;
            case 'code': wrapper = '`'; break;
            default: return;
        }
        
        // Check if already formatted
        const beforeWrapper = text.substring(start - wrapper.length, start);
        const afterWrapper = text.substring(end, end + wrapper.length);
        
        if (beforeWrapper === wrapper && afterWrapper === wrapper) {
            this.replaceSpan(start - wrapper.length, end + wrapper.length, selected,
                start - wrapper.length, end - wrapper.length);
        } else {
            const newText = wrapper + (selected || 'text') + wrapper;
            this.replaceSpan(start, end, newText, start + wrapper.length, start + wrapper.length + (selected || 'text').length);
        }
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Applied ${format} formatting`);
    },
    
    /**
     * Apply block formatting (headers, lists, quotes)
     */
    applyBlockFormat(format) {
        const editor = DOM.editor;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const text = editor.value;
        
        const { lineStart, lineEnd } = this.lineBounds(text, start, end);
        
        // Get all lines in selection
        const selectedLines = text.substring(lineStart, lineEnd).split('\n');
        
        let newLines;
        switch (format) {
            case 'h1':
            case 'h2':
            case 'h3':
            case 'h4':
            case 'h5':
            case 'h6':
                const level = parseInt(format.substring(1));
                const prefix = '#'.repeat(level) + ' ';
                newLines = selectedLines.map(line => {
                    const current = line.match(/^(#{1,6})\s/);
                    const stripped = line.replace(/^#{1,6}\s*/, '');
                    if (current && current[1].length === level) return stripped;
                    return prefix + stripped;
                });
                break;
                
            case 'bullet':
                newLines = selectedLines.map(line => {
                    // Check if already a bullet list
                    if (/^[-*+]\s/.test(line)) {
                        return line.replace(/^[-*+]\s/, '');
                    }
                    // Remove number list marker if present
                    line = line.replace(/^\d+\.\s/, '');
                    return '- ' + line;
                });
                break;
                
            case 'number':
                let num = 1;
                newLines = selectedLines.map(line => {
                    // Check if already a numbered list
                    if (/^\d+\.\s/.test(line)) {
                        return line.replace(/^\d+\.\s/, '');
                    }
                    // Remove bullet marker if present
                    line = line.replace(/^[-*+]\s/, '');
                    return `${num++}. ${line}`;
                });
                break;
                
            case 'quoteIncrease':
                newLines = selectedLines.map(line => {
                    if (/^[^>\s].*>/.test(line)) {
                        alert('Quotes can only appear at the start of lines. Remove the text before ">" first.');
                        return line;
                    }
                    if (/^>+/.test(line)) return '>' + line;
                    return '> ' + line;
                });
                break;
                
            case 'quoteDecrease':
                newLines = selectedLines.map(line => {
                    if (line.startsWith('> ')) {
                        return line.substring(2);
                    } else if (line.startsWith('>')) {
                        return line.substring(1);
                    }
                    return line;
                });
                break;
                
            case 'codeBlock':
                const code = selectedLines.join('\n');
                newLines = ['```', code, '```'];
                break;
                
            case 'hr':
                newLines = ['---', ...selectedLines];
                break;
                
            default:
                return;
        }
        
        const newContent = newLines.join('\n');
        this.replaceSpan(lineStart, lineEnd, newContent, lineStart, lineStart + newContent.length);
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Applied ${format} block formatting`);
    },
    
    /**
     * Insert link at cursor position
     */
    insertLink(text, url) {
        const editor = DOM.editor;
        const start = editor.selectionStart;
        const content = editor.value;
        
        const linkMd = `[${text}](${url})`;
        this.replaceSpan(start, editor.selectionEnd, linkMd);
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Inserted link: ${url}`);
    },
    
    /**
     * Insert image at cursor position
     */
    insertImage(alt, url) {
        const editor = DOM.editor;
        const start = editor.selectionStart;
        const content = editor.value;
        
        const imgMd = `![${alt}](${url})`;
        this.replaceSpan(start, editor.selectionEnd, imgMd);
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Inserted image: ${url}`);
    },
    
    _previewTimer: null,

    /**
     * Update preview pane from editor content (debounced)
     */
    updatePreview() {
        if (this._previewTimer) clearTimeout(this._previewTimer);
        this._previewTimer = setTimeout(() => {
            Doc.load(DOM.editor.value);
            DOM.preview.innerHTML = Doc.previewHTML();
            this.updateStatus();
        }, 30);
    },

    /**
     * Update preview immediately (for programmatic changes)
     */
    updatePreviewNow() {
        if (this._previewTimer) clearTimeout(this._previewTimer);
        Doc.load(DOM.editor.value);
        DOM.preview.innerHTML = Doc.previewHTML();
        this.updateStatus();
    },
    
    /**
     * Update status bar
     */
    updateStatus() {
        const text = DOM.editor.value;
        const lines = text.split('\n').length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        
        DOM.statusRight.textContent = `Lines: ${lines} | Words: ${words} | Characters: ${chars}`;
    }
};

/* @requires-dom */
// ============================================================================
// PREVIEW — contenteditable is an input surface. The document is Doc.
// ============================================================================
const PreviewOps = {
    _opLock: false,

    init() {
        DOM.preview.addEventListener("beforeinput", e => this.onBeforeInput(e));
        DOM.preview.addEventListener("keydown", e => this.onKeyDown(e));
        DOM.preview.addEventListener("paste", e => this.onPaste(e));
        DOM.preview.addEventListener("mousedown", e => this.onMouseDown(e));
    },

    onMouseDown(e) {
        const hr = e.target.closest && e.target.closest("#preview hr");
        if (hr && DOM.preview.contains(hr)) {
            e.preventDefault();
            AppState.activePane = "preview";
            const a = +hr.getAttribute("data-from") || 0;
            const b = +hr.getAttribute("data-to") || a + 1;
            Doc.setSelection(a, b);
            try {
                const r = document.createRange();
                r.selectNode(hr);
                const s = window.getSelection();
                s.removeAllRanges();
                s.addRange(r);
            } catch (err) { /* hr may not accept a range */ }
            DOM.preview.focus();
            IconHighlighter.checkPreviewFormats();
            return;
        }
        const last = DOM.preview.lastElementChild;
        if (!last) return;
        const below = e.clientY > last.getBoundingClientRect().bottom + 2;
        const onChrome = e.target === DOM.preview;
        if (!below && !onChrome) return;
        if (last.contains(e.target) && !below) return;
        e.preventDefault();
        AppState.activePane = "preview";
        Doc.landAtEnd();
        DOM.preview.focus();
        syncFromDoc("preview");
    },

    runOp(op) {
        if (this._opLock) return;
        this._opLock = true;
        Doc.readPreviewSelection(DOM.preview);
        if (op === "split") Doc.splitBlock();
        else if (op === "back") Doc.deleteBackward();
        else if (op === "fwd") Doc.deleteForward();
        syncFromDoc("preview");
        if (op === "split") History.commit("New line");
        else History.schedule("Delete");
        queueMicrotask(() => { this._opLock = false; });
    },

    onKeyDown(e) {
        if (AppState.activePane !== "preview") return;
        if (e.isComposing || e.keyCode === 229) return;
        const keys = { Enter: "split", Backspace: "back", Delete: "fwd" };
        const op = keys[e.key];
        if (!op) return;
        e.preventDefault();
        this.runOp(op);
    },

    onBeforeInput(e) {
        if (AppState.activePane !== "preview") return;
        const t = e.inputType || "";
        if (t === "insertCompositionText") return;
        e.preventDefault();
        if (t === "insertText" || t === "insertReplacementText") {
            Doc.readPreviewSelection(DOM.preview);
            Doc.insertText(e.data || "");
            syncFromDoc("preview");
            History.schedule("Typing");
        } else if (t === "insertParagraph" || t === "insertLineBreak") {
            this.runOp("split");
        } else if (t === "deleteContentBackward" || t === "deleteByCut") {
            this.runOp("back");
        } else if (t === "deleteContentForward") {
            this.runOp("fwd");
        }
    },

    onPaste(e) {
        if (AppState.activePane !== "preview") return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
        const html = (e.clipboardData && e.clipboardData.getData("text/html")) || "";
        if (html && /<(ol|ul)\b/i.test(html)) {
            try {
                const md = HtmlToMarkdown.convert(html);
                if (md && /(?:^|\n)\s*(?:\d+\.|[-*+])\s/.test(md)) text = md;
            } catch (err) { /* keep text/plain */ }
        }
        Doc.readPreviewSelection(DOM.preview);
        Doc.paste(text);
        syncFromDoc("preview");
        History.commit("Paste");
    },

    applyFormat(format) {
        Doc.readPreviewSelection(DOM.preview);
        applyDocFormat(format);
        syncFromDoc("preview");
    }
};

function applyDocFormat(format) {
    const inline = { bold: "bold", italic: "italic", underline: "underline", strike: "strike", code: "code" };
    if (inline[format]) Doc.toggleMark(inline[format]);
    else if (/^h[1-6]$/.test(format)) Doc.toggleBlock(format);
    else if (format === "bullet") Doc.toggleBlock("ul");
    else if (format === "number") Doc.toggleBlock("ol");
    else if (format === "quoteIncrease") Doc.indentQuote();
    else if (format === "quoteDecrease") Doc.outdentQuote();
    else if (format === "hr") Doc.insertHr();
    else if (format === "codeBlock") {
        Doc.toggleBlock("pre");
    }
}

function syncFromDoc(focus) {
    DOM.editor.value = Doc.toMarkdown();
    DOM.preview.innerHTML = Doc.previewHTML();
    if (focus === "preview") Doc.restorePreviewSelection(DOM.preview);
    EditorOps.updateStatus();
    AppState.setModified(true);
    if (focus === "preview") IconHighlighter.checkPreviewFormats();
    else IconHighlighter.checkEditorFormats();
}
