/* ==== module 35-history.js ==== */
/* @requires-dom */
// ============================================================================
// UNDO / REDO — one stack for both panes. A snapshot is the markdown plus the
// caret in whichever pane was active. Every entry carries a label naming the
// step that produced it, so the Undo/Redo tooltips and the History panel can
// say what will happen. Typing coalesces (350 ms idle); toolbar and menu
// actions commit at once.
// ============================================================================
const History = {
    stack: [],
    index: -1,
    max: 100,
    locked: false,
    _timer: null,
    _pendingLabel: null,

    capture(label) {
        const sel = Doc.selection();
        return {
            label: label || "Edit",
            at: Date.now(),
            md: DOM.editor.value,
            from: sel.from,
            to: sel.to,
            editorFrom: DOM.editor.selectionStart,
            editorTo: DOM.editor.selectionEnd,
            pane: AppState.activePane
        };
    },

    /* A discrete step (Bold, Insert table, Paste). Flushes pending typing
       first so the typing and the step are two separate entries. */
    commit(label) {
        if (this.locked) return;
        this.flush();
        this._push(this.capture(label));
    },

    /* Typing. Coalesces into one entry until 350 ms pass without input
       or something else commits. */
    schedule(label) {
        if (this.locked) return;
        this._pendingLabel = label || "Typing";
        if (this._timer) clearTimeout(this._timer);
        this._timer = setTimeout(() => {
            this._timer = null;
            this._push(this.capture(this._pendingLabel));
        }, 350);
    },

    flush() {
        if (!this._timer) return;
        clearTimeout(this._timer);
        this._timer = null;
        this._push(this.capture(this._pendingLabel));
    },

    _push(cap) {
        const top = this.stack[this.index];
        if (top && top.md === cap.md) {
            top.from = cap.from;
            top.to = cap.to;
            top.editorFrom = cap.editorFrom;
            top.editorTo = cap.editorTo;
            top.pane = cap.pane;
            this.render();
            return;
        }
        this.stack = this.stack.slice(0, this.index + 1);
        this.stack.push(cap);
        if (this.stack.length > this.max) this.stack.shift();
        this.index = this.stack.length - 1;
        this.render();
    },

    reset(label) {
        if (this._timer) {
            clearTimeout(this._timer);
            this._timer = null;
        }
        this.stack = [];
        this.index = -1;
        this._push(this.capture(label || "Start"));
    },

    apply(cap) {
        this.locked = true;
        try {
            DOM.editor.value = cap.md;
            Doc.load(cap.md);
            Doc.setSelection(cap.from, cap.to);
            DOM.preview.innerHTML = Doc.previewHTML();
            AppState.activePane = cap.pane || "editor";
            if (cap.pane === "preview") {
                DOM.preview.focus();
                Doc.restorePreviewSelection(DOM.preview);
                IconHighlighter.checkPreviewFormats();
            } else {
                DOM.editor.focus();
                const n = DOM.editor.value.length;
                const a = Math.max(0, Math.min(n, cap.editorFrom || 0));
                const b = Math.max(0, Math.min(n, cap.editorTo || a));
                DOM.editor.setSelectionRange(a, b);
                IconHighlighter.checkEditorFormats();
            }
            EditorOps.updateStatus();
            AppState.setModified(true);
        } finally {
            this.locked = false;
        }
        this.render();
    },

    undo() {
        this.flush();
        if (this.index <= 0) return false;
        this.index--;
        this.apply(this.stack[this.index]);
        Logger.info("History", "Undo -> #" + this.index + " " + this.stack[this.index].label);
        return true;
    },

    redo() {
        this.flush();
        if (this.index >= this.stack.length - 1) return false;
        this.index++;
        this.apply(this.stack[this.index]);
        Logger.info("History", "Redo -> #" + this.index + " " + this.stack[this.index].label);
        return true;
    },

    goTo(i) {
        this.flush();
        if (i < 0 || i >= this.stack.length || i === this.index) return false;
        this.index = i;
        this.apply(this.stack[i]);
        Logger.info("History", "Jump -> #" + i + " " + this.stack[i].label);
        return true;
    },

    canUndo() { return this.index > 0; },
    canRedo() { return this.index < this.stack.length - 1; },

    /* ---- visibility ------------------------------------------------------ */

    /* What changed between entry i-1 and entry i: the text removed and the
       text added, found by stripping the common prefix and suffix. */
    diffAt(i) {
        const b = this.stack[i] ? this.stack[i].md : "";
        const a = i > 0 && this.stack[i - 1] ? this.stack[i - 1].md : "";
        let p = 0;
        const maxP = Math.min(a.length, b.length);
        while (p < maxP && a[p] === b[p]) p++;
        let s = 0;
        while (s < maxP - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
        return {
            removed: a.slice(p, a.length - s),
            added: b.slice(p, b.length - s),
            at: p,
            delta: b.length - a.length
        };
    },

    snippet(s, n) {
        n = n || 36;
        s = String(s).replace(/\n/g, "⏎");
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
    },

    summary() {
        const n = this.stack.length;
        return {
            entries: n,
            undo: Math.max(0, this.index),
            redo: Math.max(0, n - 1 - this.index),
            index: this.index,
            current: this.stack[this.index] || null,
            next: this.stack[this.index + 1] || null
        };
    },

    updateButtons() {
        const s = this.summary();
        if (DOM.undoBtn) {
            DOM.undoBtn.disabled = !this.canUndo();
            DOM.undoBtn.title = (this.canUndo() ? "Undo: " + s.current.label : "Nothing to undo") + " (Ctrl+Z)";
        }
        if (DOM.redoBtn) {
            DOM.redoBtn.disabled = !this.canRedo();
            DOM.redoBtn.title = (this.canRedo() ? "Redo: " + s.next.label : "Nothing to redo") + " (Ctrl+Y)";
        }
        if (DOM.historyBtn) {
            DOM.historyBtn.title = "History: " + s.undo + " to undo, " + s.redo + " to redo (Ctrl+Shift+H)";
        }
    },

    isPanelOpen() {
        return !!(DOM.historyPanel && DOM.historyPanel.classList.contains("visible"));
    },

    togglePanel(force) {
        if (!DOM.historyPanel) return;
        const open = force === undefined ? !this.isPanelOpen() : !!force;
        DOM.historyPanel.classList.toggle("visible", open);
        if (DOM.historyBtn) DOM.historyBtn.classList.toggle("active", open);
        if (open) this.render();
    },

    render() {
        this.updateButtons();
        if (!this.isPanelOpen() || !DOM.historyList) return;
        const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        const time = t => new Date(t).toLocaleTimeString("en-US", { hour12: false });
        const s = this.summary();
        if (DOM.historySummary) {
            DOM.historySummary.textContent = s.entries + " snapshot" + (s.entries === 1 ? "" : "s")
                + " · " + s.undo + " to undo · " + s.redo + " to redo";
        }
        let html = "";
        for (let i = this.stack.length - 1; i >= 0; i--) {
            const e = this.stack[i];
            const d = this.diffAt(i);
            const state = i === this.index ? "current" : (i < this.index ? "undo" : "redo");
            let change = "";
            if (i > 0) {
                if (d.removed) change += "<span class=\"hist-del\">−" + esc(this.snippet(d.removed)) + "</span>";
                if (d.added) change += "<span class=\"hist-add\">+" + esc(this.snippet(d.added)) + "</span>";
                if (!d.removed && !d.added) change = "<span class=\"hist-nil\">no text change</span>";
            } else {
                change = "<span class=\"hist-nil\">" + e.md.length + " chars</span>";
            }
            const hint = state === "current" ? "Current state"
                : (state === "undo" ? "Click to undo back to here" : "Click to redo forward to here");
            html += "<div class=\"hist-entry " + state + "\" data-index=\"" + i + "\" title=\"" + hint + "\">"
                + "<div class=\"hist-head\"><span class=\"hist-idx\">#" + i + "</span>"
                + "<span class=\"hist-label\">" + esc(e.label) + "</span>"
                + "<span class=\"hist-meta\">" + (e.pane === "preview" ? "preview" : "raw")
                + " · " + (d.delta >= 0 ? "+" : "") + d.delta + " · " + time(e.at) + "</span></div>"
                + "<div class=\"hist-change\">" + change + "</div>"
                + "</div>";
        }
        DOM.historyList.innerHTML = html;
        const cur = DOM.historyList.querySelector(".hist-entry.current");
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    }
};

// ============================================================================
// TABLE OPERATIONS
// ============================================================================
const TableOps = {
    openModal() {
        ModalOps.saveCaret();
        this.updatePreview();
        DOM.tableModal.classList.add('active');
        DOM.tableRows.focus();
    },
    
    closeModal() {
        DOM.tableModal.classList.remove('active');
        DOM.tableRows.value = '3';
        DOM.tableCols.value = '3';
    },
    
    updatePreview() {
        const rows = parseInt(DOM.tableRows.value) || 3;
        const cols = parseInt(DOM.tableCols.value) || 3;
        
        let html = '<table><thead><tr>';
        for (let c = 0; c < cols; c++) {
            html += `<th>Header ${c + 1}</th>`;
        }
        html += '</tr></thead><tbody>';
        
        for (let r = 0; r < rows - 1; r++) {
            html += '<tr>';
            for (let c = 0; c < cols; c++) {
                html += `<td>Cell ${r + 1}-${c + 1}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        
        DOM.tablePreview.innerHTML = html;
    },
    
    generateMarkdown(rows, cols) {
        let md = '';
        
        // Header row
        md += '|';
        for (let c = 0; c < cols; c++) {
            md += ` Header ${c + 1} |`;
        }
        md += '\n';
        
        // Separator row
        md += '|';
        for (let c = 0; c < cols; c++) {
            md += ' --- |';
        }
        md += '\n';
        
        // Data rows
        for (let r = 0; r < rows - 1; r++) {
            md += '|';
            for (let c = 0; c < cols; c++) {
                md += ` Cell ${r + 1}-${c + 1} |`;
            }
            md += '\n';
        }
        
        return md;
    },
    
    insert() {
        const rows = parseInt(DOM.tableRows.value) || 3;
        const cols = parseInt(DOM.tableCols.value) || 3;
        
        const tableMd = this.generateMarkdown(rows, cols).trim();
        this.closeModal();
        const s = ModalOps._saved;
        if (s && s.pane === "preview") {
            AppState.activePane = "preview";
            Doc.setSelection(s.from, s.to);
            Doc.paste(tableMd);
            syncFromDoc("preview");
            DOM.preview.focus();
        } else {
            const editor = DOM.editor;
            const start = s && s.editorStart != null ? s.editorStart : editor.selectionStart;
            const end = s && s.editorEnd != null ? s.editorEnd : editor.selectionEnd;
            const content = editor.value;
            let prefix = "";
            let suffix = "\n";
            if (start > 0 && content[start - 1] !== "\n") prefix = "\n\n";
            else if (start > 1 && content[start - 2] !== "\n") prefix = "\n";
            EditorOps.replaceSpan(start, end, prefix + tableMd + suffix);
            EditorOps.updatePreviewNow();
            AppState.setModified(true);
            DOM.editor.focus();
        }
        History.commit("Insert " + rows + "x" + cols + " table");
        Logger.info("Table", "Inserted " + rows + "x" + cols + " table");
    },

    apply(op) {
        if (AppState.activePane === "preview") Doc.readPreviewSelection(DOM.preview);
        if (op === "rowAbove") Doc.insertRow("above");
        else if (op === "rowBelow") Doc.insertRow("below");
        else if (op === "rowDel") Doc.deleteRow();
        else if (op === "colLeft") Doc.insertCol("left");
        else if (op === "colRight") Doc.insertCol("right");
        else if (op === "colDel") Doc.deleteCol();
        const focus = AppState.activePane === "preview" ? "preview" : "editor";
        syncFromDoc(focus);
        if (focus === "editor") DOM.editor.focus();
        const labels = {
            rowAbove: "Insert row above", rowBelow: "Insert row below", rowDel: "Delete row",
            colLeft: "Insert column left", colRight: "Insert column right", colDel: "Delete column"
        };
        History.commit(labels[op] || "Table edit");
    }
};

// ============================================================================
// EDITOR OPERATIONS
// ============================================================================
const EditorOps = {
    lineBounds(text, start, end) {
        const lineStart = text.lastIndexOf('\n', start - 1) + 1;
        let lineEnd = text.indexOf('\n', end);
        if (lineEnd === -1) lineEnd = text.length;
        return { lineStart, lineEnd };
    },

    replaceSpan(from, to, insert, selFrom, selTo) {
        const editor = DOM.editor;
        editor.setRangeText(insert, from, to, 'end');
        if (selFrom != null) {
            editor.selectionStart = selFrom;
            editor.selectionEnd = selTo;
        }
    },

    /**
     * Apply inline formatting to selected text in editor
     */
    applyInlineFormat(format) {
        const editor = DOM.editor;
        let start = editor.selectionStart;
        let end = editor.selectionEnd;
        const text = editor.value;
        while (start < end && /\s/.test(text[end - 1])) end--;
        while (start < end && /\s/.test(text[start])) start++;
        const selected = text.substring(start, end);
        if (!selected && editor.selectionStart !== editor.selectionEnd) {
            return;
        }
        
        let wrapper;
        switch (format) {
            case 'bold': wrapper = '**'; break;
            case 'italic': wrapper = '*'; break;
            case 'underline': wrapper = '++'; break;
            case 'strike': wrapper = '~~'; break;
            case 'code': wrapper = '`'; break;
            default: return;
        }
        
        // Check if already formatted
        const beforeWrapper = text.substring(start - wrapper.length, start);
        const afterWrapper = text.substring(end, end + wrapper.length);
        
        if (beforeWrapper === wrapper && afterWrapper === wrapper) {
            this.replaceSpan(start - wrapper.length, end + wrapper.length, selected,
                start - wrapper.length, end - wrapper.length);
        } else {
            const newText = wrapper + (selected || 'text') + wrapper;
            this.replaceSpan(start, end, newText, start + wrapper.length, start + wrapper.length + (selected || 'text').length);
        }
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Applied ${format} formatting`);
    },
    
    /**
     * Apply block formatting (headers, lists, quotes)
     */
    applyBlockFormat(format) {
        const editor = DOM.editor;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const text = editor.value;
        
        const { lineStart, lineEnd } = this.lineBounds(text, start, end);
        
        // Get all lines in selection
        const selectedLines = text.substring(lineStart, lineEnd).split('\n');
        
        let newLines;
        switch (format) {
            case 'h1':
            case 'h2':
            case 'h3':
            case 'h4':
            case 'h5':
            case 'h6':
                const level = parseInt(format.substring(1));
                const prefix = '#'.repeat(level) + ' ';
                newLines = selectedLines.map(line => {
                    const current = line.match(/^(#{1,6})\s/);
                    const stripped = line.replace(/^#{1,6}\s*/, '');
                    if (current && current[1].length === level) return stripped;
                    return prefix + stripped;
                });
                break;
                
            case 'bullet':
                newLines = selectedLines.map(line => {
                    // Check if already a bullet list
                    if (/^[-*+]\s/.test(line)) {
                        return line.replace(/^[-*+]\s/, '');
                    }
                    // Remove number list marker if present
                    line = line.replace(/^\d+\.\s/, '');
                    return '- ' + line;
                });
                break;
                
            case 'number':
                let num = 1;
                newLines = selectedLines.map(line => {
                    // Check if already a numbered list
                    if (/^\d+\.\s/.test(line)) {
                        return line.replace(/^\d+\.\s/, '');
                    }
                    // Remove bullet marker if present
                    line = line.replace(/^[-*+]\s/, '');
                    return `${num++}. ${line}`;
                });
                break;
                
            case 'quoteIncrease':
                let misplacedQuote = false;
                newLines = selectedLines.map(line => {
                    if (/^[^>\s].*>/.test(line)) {
                        misplacedQuote = true;
                        return line;
                    }
                    if (/^>+/.test(line)) return '>' + line;
                    return '> ' + line;
                });
                if (misplacedQuote) {
                    Dialog.tell('Quotes can only appear at the start of lines. Remove the text before ">" first.', 'Quote');
                }
                break;
                
            case 'quoteDecrease':
                newLines = selectedLines.map(line => {
                    if (line.startsWith('> ')) {
                        return line.substring(2);
                    } else if (line.startsWith('>')) {
                        return line.substring(1);
                    }
                    return line;
                });
                break;
                
            case 'codeBlock':
                const code = selectedLines.join('\n');
                newLines = ['```', code, '```'];
                break;
                
            case 'hr':
                newLines = ['---', ...selectedLines];
                break;
                
            default:
                return;
        }
        
        const newContent = newLines.join('\n');
        this.replaceSpan(lineStart, lineEnd, newContent, lineStart, lineStart + newContent.length);
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Applied ${format} block formatting`);
    },
    
    /**
     * Insert link at cursor position
     */
    insertLink(text, url) {
        const editor = DOM.editor;
        const start = editor.selectionStart;
        const content = editor.value;
        
        const linkMd = `[${text}](${url})`;
        this.replaceSpan(start, editor.selectionEnd, linkMd);
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Inserted link: ${url}`);
    },
    
    /**
     * Insert image at cursor position
     */
    insertImage(alt, url) {
        const editor = DOM.editor;
        const start = editor.selectionStart;
        const content = editor.value;
        
        const imgMd = `![${alt}](${url})`;
        this.replaceSpan(start, editor.selectionEnd, imgMd);
        
        this.updatePreviewNow();
        AppState.setModified(true);
        Logger.info('Editor', `Inserted image: ${url}`);
    },
    
    _previewTimer: null,

    /**
     * Update preview pane from editor content (debounced)
     */
    updatePreview() {
        if (this._previewTimer) clearTimeout(this._previewTimer);
        this._previewTimer = setTimeout(() => {
            Doc.load(DOM.editor.value);
            DOM.preview.innerHTML = Doc.previewHTML();
            this.updateStatus();
        }, 30);
    },

    /**
     * Update preview immediately (for programmatic changes)
     */
    updatePreviewNow() {
        if (this._previewTimer) clearTimeout(this._previewTimer);
        Doc.load(DOM.editor.value);
        DOM.preview.innerHTML = Doc.previewHTML();
        this.updateStatus();
    },
    
    /**
     * Update status bar
     */
    updateStatus() {
        const text = DOM.editor.value;
        const lines = text.split('\n').length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        
        DOM.statusRight.textContent = `Lines: ${lines} | Words: ${words} | Characters: ${chars}`;
    }
};

// ============================================================================
// BLOCK STYLE PICKERS — code-block language and callout type. A <select>
// takes focus, so the preview path uses the selection Doc already holds and
// the raw path uses the textarea's (kept across blur). Both return focus.
// ============================================================================
const BlockStyleOps = {
    init() {
        const lang = DOM.codeLangSelect;
        if (lang) {
            lang.innerHTML = Highlight.CHOICES
                .map(([value, label]) => '<option value="' + value + '">' + label + '</option>').join('');
            lang.addEventListener('change', () => this.setCodeLang(lang.value));
        }
        if (DOM.alertSelect) DOM.alertSelect.addEventListener('change', () => this.setAlert(DOM.alertSelect.value));
    },

    /* lang: string, or null when the caret is not in a fence.
       alert: kind, "" for a plain quote, or null outside a quote. */
    reflect(lang, alert) {
        if (DOM.codeLangSelect) {
            DOM.codeLangSelect.disabled = lang === null;
            this.choose(DOM.codeLangSelect, lang || '');
        }
        if (DOM.alertSelect) this.choose(DOM.alertSelect, alert === null ? 'none' : alert);
    },

    /* A fence may name a language the list does not (```sh): show it as is. */
    choose(select, value) {
        select.querySelectorAll('option[data-extra]').forEach(o => o.remove());
        if (![...select.options].some(o => o.value === value)) {
            const o = document.createElement('option');
            o.value = value;
            o.textContent = value;
            o.setAttribute('data-extra', '');
            select.appendChild(o);
        }
        select.value = value;
    },

    /* Flush pending typing before the change, or the change is folded into
       the Typing entry instead of getting its own. */
    setCodeLang(lang) {
        History.flush();
        if (AppState.activePane === 'preview') {
            if (!Doc.setCodeLang(lang)) return;
            syncFromDoc('preview');
            DOM.preview.focus();
        } else {
            const ed = DOM.editor;
            const s = RawBlocks.setFenceLang(ed.value, ed.selectionStart, lang);
            if (!s) return;
            this.applyRaw(s);
        }
        History.commit('Code language: ' + (lang || 'plain text'));
    },

    setAlert(kind) {
        if (kind === 'none') return;
        History.flush();
        if (AppState.activePane === 'preview') {
            if (!Doc.setAlert(kind)) {
                IconHighlighter.checkPreviewFormats();
                return;
            }
            syncFromDoc('preview');
            DOM.preview.focus();
        } else {
            const ed = DOM.editor;
            const s = RawBlocks.setAlert(ed.value, ed.selectionStart, ed.selectionEnd, kind);
            if (!s) {
                ed.focus();
                return;
            }
            this.applyRaw(s);
        }
        History.commit(kind ? 'Callout: ' + kind[0].toUpperCase() + kind.slice(1) : 'Plain quote');
    },

    applyRaw(s) {
        const ed = DOM.editor;
        const a = s.map(ed.selectionStart), b = s.map(ed.selectionEnd);
        EditorOps.replaceSpan(s.from, s.to, s.insert, a, b);
        EditorOps.updatePreviewNow();
        AppState.setModified(true);
        ed.focus();
        IconHighlighter.checkEditorFormats();
    }
};

/* ==== module 50-preview.js ==== */
/* @requires-dom */
// ============================================================================
// PREVIEW — contenteditable is an input surface. The document is Doc.
// ============================================================================
const PreviewOps = {
    _opLock: false,

    init() {
        DOM.preview.addEventListener("beforeinput", e => this.onBeforeInput(e));
        DOM.preview.addEventListener("keydown", e => this.onKeyDown(e));
        DOM.preview.addEventListener("paste", e => this.onPaste(e));
        DOM.preview.addEventListener("mousedown", e => this.onMouseDown(e));
    },

    onMouseDown(e) {
        const hr = e.target.closest && e.target.closest("#preview hr");
        if (hr && DOM.preview.contains(hr)) {
            e.preventDefault();
            AppState.activePane = "preview";
            const a = +hr.getAttribute("data-from") || 0;
            const b = +hr.getAttribute("data-to") || a + 1;
            Doc.setSelection(a, b);
            try {
                const r = document.createRange();
                r.selectNode(hr);
                const s = window.getSelection();
                s.removeAllRanges();
                s.addRange(r);
            } catch (err) { /* hr may not accept a range */ }
            DOM.preview.focus();
            IconHighlighter.checkPreviewFormats();
            return;
        }
        const last = DOM.preview.lastElementChild;
        if (!last) return;
        const below = e.clientY > last.getBoundingClientRect().bottom + 2;
        const onChrome = e.target === DOM.preview;
        if (!below && !onChrome) return;
        if (last.contains(e.target) && !below) return;
        e.preventDefault();
        AppState.activePane = "preview";
        Doc.landAtEnd();
        DOM.preview.focus();
        syncFromDoc("preview");
    },

    runOp(op) {
        if (this._opLock) return;
        this._opLock = true;
        try {
            Doc.readPreviewSelection(DOM.preview);
            if (op === "split") Doc.splitBlock();
            else if (op === "back") Doc.deleteBackward();
            else if (op === "fwd") Doc.deleteForward();
            syncFromDoc("preview");
            if (op === "split") History.commit("New line");
            else History.schedule("Delete");
        } finally {
            /* Release after the rest of this task (keydown and beforeinput
               both arrive for one key) and even when an op throws; a stuck
               lock would leave Enter and Backspace dead in the preview. */
            queueMicrotask(() => { this._opLock = false; });
        }
    },

    onKeyDown(e) {
        if (AppState.activePane !== "preview") return;
        if (e.isComposing || e.keyCode === 229) return;
        const keys = { Enter: "split", Backspace: "back", Delete: "fwd" };
        const op = keys[e.key];
        if (!op) return;
        e.preventDefault();
        this.runOp(op);
    },

    onBeforeInput(e) {
        if (AppState.activePane !== "preview") return;
        const t = e.inputType || "";
        if (t === "insertCompositionText") return;
        e.preventDefault();
        if (t === "insertText" || t === "insertReplacementText") {
            Doc.readPreviewSelection(DOM.preview);
            Doc.insertText(e.data || "");
            syncFromDoc("preview");
            History.schedule("Typing");
        } else if (t === "insertParagraph" || t === "insertLineBreak") {
            this.runOp("split");
        } else if (t === "deleteContentBackward" || t === "deleteByCut") {
            this.runOp("back");
        } else if (t === "deleteContentForward") {
            this.runOp("fwd");
        }
    },

    onPaste(e) {
        if (AppState.activePane !== "preview") return;
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
        const html = (e.clipboardData && e.clipboardData.getData("text/html")) || "";
        if (html && /<(ol|ul)\b/i.test(html)) {
            try {
                const md = HtmlToMarkdown.convert(html);
                if (md && /(?:^|\n)\s*(?:\d+\.|[-*+])\s/.test(md)) text = md;
            } catch (err) { /* keep text/plain */ }
        }
        Doc.readPreviewSelection(DOM.preview);
        Doc.paste(text);
        syncFromDoc("preview");
        History.commit("Paste");
    },

    applyFormat(format) {
        Doc.readPreviewSelection(DOM.preview);
        applyDocFormat(format);
        syncFromDoc("preview");
    }
};

function applyDocFormat(format) {
    const inline = { bold: "bold", italic: "italic", underline: "underline", strike: "strike", code: "code" };
    if (inline[format]) Doc.toggleMark(inline[format]);
    else if (/^h[1-6]$/.test(format)) Doc.toggleBlock(format);
    else if (format === "bullet") Doc.toggleBlock("ul");
    else if (format === "number") Doc.toggleBlock("ol");
    else if (format === "quoteIncrease") Doc.indentQuote();
    else if (format === "quoteDecrease") Doc.outdentQuote();
    else if (format === "hr") Doc.insertHr();
    else if (format === "codeBlock") {
        Doc.toggleBlock("pre");
    }
}

function syncFromDoc(focus) {
    DOM.editor.value = Doc.toMarkdown();
    DOM.preview.innerHTML = Doc.previewHTML();
    if (focus === "preview") Doc.restorePreviewSelection(DOM.preview);
    EditorOps.updateStatus();
    AppState.setModified(true);
    if (focus === "preview") IconHighlighter.checkPreviewFormats();
    else IconHighlighter.checkEditorFormats();
}

// ============================================================================
// SCROLL SYNC MANAGER
// ============================================================================
const ScrollSyncManager = {
    enabled: true,
    isSyncing: false,
    syncTimeout: null,
    lastSyncSource: null,
    heldUntil: 0,

    init(editor, previewContainer, trackBtn) {
        // editor = the textarea element (scrolls itself)
        // previewContainer = the container div (scrolls the preview content)
        this.editorEl = editor;
        this.previewEl = previewContainer;
        this.trackBtn = trackBtn;
        
        // Set up scroll listeners on the actual scrolling elements
        this.editorEl.addEventListener('scroll', () => this.handleScroll('editor'));
        this.previewEl.addEventListener('scroll', () => this.handleScroll('preview'));
        
        // Set up click listeners for alignment
        this.editorEl.addEventListener('click', () => this.handleClick('editor'));
        this.previewEl.addEventListener('click', () => this.handleClick('preview'));
        
        // Track button toggle
        this.trackBtn.addEventListener('click', () => this.toggle());
        
        Logger.info('ScrollSync', 'Initialized scroll synchronization');
    },
    
    toggle() {
        this.enabled = !this.enabled;
        this.trackBtn.classList.toggle('active', this.enabled);
        Logger.info('ScrollSync', `Scroll sync ${this.enabled ? 'enabled' : 'disabled'}`);
    },
    
    /* A programmatic scroll (Find in other pane) must not be mirrored, and a
       sync already queued must not undo it. */
    hold(ms) {
        if (this.syncTimeout) clearTimeout(this.syncTimeout);
        this.syncTimeout = null;
        this.lastSyncSource = null;
        this.heldUntil = Date.now() + ms;
    },

    handleScroll(source) {
        if (!this.enabled || this.isSyncing || Date.now() < this.heldUntil) return;
        if (this.lastSyncSource && this.lastSyncSource !== source) return;
        
        this.lastSyncSource = source;
        
        // Debounce
        if (this.syncTimeout) clearTimeout(this.syncTimeout);
        
        this.syncTimeout = setTimeout(() => {
            this.syncScroll(source);
            this.lastSyncSource = null;
        }, 10);
    },
    
    syncScroll(source) {
        this.isSyncing = true;
        
        const sourceEl = source === 'editor' ? this.editorEl : this.previewEl;
        const targetEl = source === 'editor' ? this.previewEl : this.editorEl;
        
        // Calculate scroll percentage
        const maxScroll = sourceEl.scrollHeight - sourceEl.clientHeight;
        if (maxScroll <= 0) {
            this.isSyncing = false;
            return;
        }
        
        const scrollPercent = sourceEl.scrollTop / maxScroll;
        
        // Apply to target
        const targetMaxScroll = targetEl.scrollHeight - targetEl.clientHeight;
        const targetScrollTop = scrollPercent * targetMaxScroll;
        targetEl.scrollTop = targetScrollTop;
        
        // Release sync lock after a short delay
        setTimeout(() => {
            this.isSyncing = false;
        }, 50);
    },
    
    handleClick(source) {
        if (!this.enabled) return;
        
        // Sync scroll position on click
        this.syncScroll(source);
    }
};

// ============================================================================
// VIEW MODE MANAGER
// ============================================================================
const ViewModeManager = {
    setMode(mode) {
        AppState.viewMode = mode;
        
        // Remove all view mode classes
        DOM.mainContainer.classList.remove('editor-only', 'preview-only');
        
        // Apply the new mode
        if (mode === 'editor') {
            DOM.mainContainer.classList.add('editor-only');
        } else if (mode === 'preview') {
            DOM.mainContainer.classList.add('preview-only');
        }
        
        // Update button states
        DOM.viewEditorBtn.classList.toggle('active', mode === 'editor');
        DOM.viewBothBtn.classList.toggle('active', mode === 'both');
        DOM.viewPreviewBtn.classList.toggle('active', mode === 'preview');
        
        // Focus the appropriate pane
        if (mode === 'editor') {
            DOM.editor.focus();
            AppState.activePane = 'editor';
        } else if (mode === 'preview') {
            DOM.preview.focus();
            AppState.activePane = 'preview';
        }
        
        Logger.info('ViewMode', `Switched to ${mode} view`);
    }
};

// ============================================================================
// PANE SPLITTER — drag the bar between raw and preview to change their widths.
// The editor pane's flex-basis is --split (a percent of the container's
// content box); the preview pane takes the rest. Persisted in localStorage.
// ============================================================================
const Splitter = {
    MIN_PCT: 18,
    MAX_PCT: 82,
    STORE: "md-editor-split",
    _drag: null,

    init() {
        const el = DOM.splitter;
        if (!el) return;
        try {
            const saved = localStorage.getItem(this.STORE);
            if (saved && /%$/.test(saved)) this.set(parseFloat(saved));
        } catch (err) { /* private mode */ }
        el.addEventListener("pointerdown", e => this.start(e));
        el.addEventListener("pointermove", e => this.move(e));
        el.addEventListener("pointerup", e => this.stop(e));
        el.addEventListener("pointercancel", e => this.stop(e));
        el.addEventListener("dblclick", () => this.reset());
        el.addEventListener("keydown", e => this.onKey(e));
        this.updateAria();
    },

    get() {
        const v = parseFloat(DOM.mainContainer.style.getPropertyValue("--split"));
        return isFinite(v) ? v : 50;
    },

    set(pct) {
        const n = Number(pct);
        if (!isFinite(n)) return;
        const clamped = Math.max(this.MIN_PCT, Math.min(this.MAX_PCT, n));
        DOM.mainContainer.style.setProperty("--split", clamped.toFixed(1) + "%");
        this.updateAria();
    },

    reset() {
        this.set(50);
        this.persist();
    },

    persist() {
        try {
            localStorage.setItem(this.STORE, this.get().toFixed(1) + "%");
        } catch (err) { /* private mode */ }
    },

    updateAria() {
        const el = DOM.splitter;
        if (!el) return;
        el.setAttribute("aria-valuemin", String(this.MIN_PCT));
        el.setAttribute("aria-valuemax", String(this.MAX_PCT));
        el.setAttribute("aria-valuenow", String(Math.round(this.get())));
    },

    /* Percent of the container's content box that puts the centre of the
       bar at clientX. The editor's flex-basis is calc(--split - 8px) and the
       bar's footprint is 16px, so the bar's centre sits at exactly --split of
       the content box. flex-basis percentages resolve against that box, so
       this keeps the bar under the pointer instead of drifting by the
       padding. */
    pctAt(clientX) {
        const root = DOM.mainContainer;
        const rect = root.getBoundingClientRect();
        const cs = getComputedStyle(root);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const content = rect.width - padL - padR;
        if (content < 320) return null;
        return ((clientX - rect.left - padL) / content) * 100;
    },

    start(e) {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        if (AppState.viewMode !== "both") return;
        e.preventDefault();
        this._drag = { id: e.pointerId };
        try { DOM.splitter.setPointerCapture(e.pointerId); } catch (err) { /* older engines */ }
        DOM.mainContainer.classList.add("resizing");
        this.move(e);
    },

    move(e) {
        if (!this._drag || e.pointerId !== this._drag.id) return;
        const pct = this.pctAt(e.clientX);
        if (pct !== null) this.set(pct);
    },

    stop(e) {
        if (!this._drag || e.pointerId !== this._drag.id) return;
        this._drag = null;
        try { DOM.splitter.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
        DOM.mainContainer.classList.remove("resizing");
        this.persist();
    },

    onKey(e) {
        const step = e.shiftKey ? 10 : 2;
        if (e.key === "ArrowLeft") this.set(this.get() - step);
        else if (e.key === "ArrowRight") this.set(this.get() + step);
        else if (e.key === "Home") this.set(this.MIN_PCT);
        else if (e.key === "End") this.set(this.MAX_PCT);
        else if (e.key === "Enter") this.reset();
        else return;
        e.preventDefault();
        this.persist();
    }
};

// ============================================================================
// ICON HIGHLIGHTING
// ============================================================================
const IconHighlighter = {
    /**
     * Check format at cursor position in editor
     */
    checkEditorFormats() {
        const editor = DOM.editor;
        const pos = editor.selectionStart;
        const text = editor.value;
        
        const { lineStart, lineEnd } = EditorOps.lineBounds(text, pos, pos);
        const line = text.substring(lineStart, lineEnd);
        
        // Get text around cursor for inline formats
        const before = text.substring(0, pos);
        const after = text.substring(pos);
        
        // Reset all buttons
        this.resetButtons();
        
        // Check inline formats
        if (this.isWrappedBy(before, after, '**') || this.isWrappedBy(before, after, '__')) {
            DOM.boldBtn.classList.add('active');
        }
        if (this.isWrappedBy(before, after, '*') || this.isWrappedBy(before, after, '_')) {
            if (!this.isWrappedBy(before, after, '**')) {
                DOM.italicBtn.classList.add('active');
            }
        }
        if (this.isWrappedBy(before, after, '++')) {
            DOM.underlineBtn.classList.add('active');
        }
        if (this.isWrappedBy(before, after, '~~')) {
            DOM.strikeBtn.classList.add('active');
        }
        if (this.isWrappedBy(before, after, '`')) {
            DOM.codeBtn.classList.add('active');
        }
        
        // Check block formats (most specific first to avoid overlap)
        if (/^###### /.test(line)) DOM.h6Btn.classList.add('active');
        else if (/^##### /.test(line)) DOM.h5Btn.classList.add('active');
        else if (/^#### /.test(line)) DOM.h4Btn.classList.add('active');
        else if (/^### /.test(line)) DOM.h3Btn.classList.add('active');
        else if (/^## /.test(line)) DOM.h2Btn.classList.add('active');
        else if (/^# /.test(line)) DOM.h1Btn.classList.add('active');
        if (/^[-*+] /.test(line)) DOM.bulletBtn.classList.add('active');
        if (/^\d+\. /.test(line)) DOM.numberBtn.classList.add('active');
        if (/^>/.test(line)) DOM.quoteIncreaseBtn.classList.add('active');
        
        // Check for links and images
        if (/\[([^\]]+)\]\(([^)]+)\)/.test(line)) {
            // Check if cursor is within a link
            const linkMatch = line.match(/\[([^\]]+)\]\(([^)]+)\)/);
            if (linkMatch) {
                const linkStart = lineStart + line.indexOf(linkMatch[0]);
                const linkEnd = linkStart + linkMatch[0].length;
                if (pos >= linkStart && pos <= linkEnd) {
                    DOM.linkBtn.classList.add('active');
                }
            }
        }
        if (/!\[([^\]]*)\]\(([^)]+)\)/.test(line)) {
            const imgMatch = line.match(/!\[([^\]]*)\]\(([^)]+)\)/);
            if (imgMatch) {
                const imgStart = lineStart + line.indexOf(imgMatch[0]);
                const imgEnd = imgStart + imgMatch[0].length;
                if (pos >= imgStart && pos <= imgEnd) {
                    DOM.imageBtn.classList.add('active');
                }
            }
        }

        const fence = RawBlocks.fenceAt(text, pos);
        const quote = RawBlocks.alertAt(text, pos);
        BlockStyleOps.reflect(fence ? fence.lang : null, quote ? quote.kind : null);
    },
    
    /**
     * Check format at cursor position in preview
     */
    checkPreviewFormats() {
        if (!DOM.preview.contains(window.getSelection().anchorNode)
            && window.getSelection().anchorNode !== DOM.preview) {
            /* still update from Doc if preview is the active pane */
        }
        Doc.readPreviewSelection(DOM.preview);
        this.resetButtons();
        const marks = Doc.marksAt();
        if (marks.has("bold")) DOM.boldBtn.classList.add("active");
        if (marks.has("italic")) DOM.italicBtn.classList.add("active");
        if (marks.has("underline")) DOM.underlineBtn.classList.add("active");
        if (marks.has("strike")) DOM.strikeBtn.classList.add("active");
        if (marks.has("code")) DOM.codeBtn.classList.add("active");
        const bt = Doc.blockTypeAt();
        if (bt === "h1") DOM.h1Btn.classList.add("active");
        else if (bt === "h2") DOM.h2Btn.classList.add("active");
        else if (bt === "h3") DOM.h3Btn.classList.add("active");
        else if (bt === "h4") DOM.h4Btn.classList.add("active");
        else if (bt === "h5") DOM.h5Btn.classList.add("active");
        else if (bt === "h6") DOM.h6Btn.classList.add("active");
        else if (bt === "ul") DOM.bulletBtn.classList.add("active");
        else if (bt === "ol") DOM.numberBtn.classList.add("active");
        else if (bt === "quote") DOM.quoteIncreaseBtn.classList.add("active");
        else if (bt === "hr") DOM.hrBtn.classList.add("active");
        this.setTableEditEnabled(bt === "table");
        BlockStyleOps.reflect(Doc.codeLangAt(), Doc.alertAt());
    },

    markFormatsFrom(node) {
        while (node && node !== DOM.preview) {
            if (node.nodeType === Node.ELEMENT_NODE) this.markElement(node);
            node = node.parentNode;
        }
    },

    markElement(el) {
        switch (el.tagName.toLowerCase()) {
            case 'strong':
            case 'b':
                DOM.boldBtn.classList.add('active');
                break;
            case 'em':
            case 'i':
                DOM.italicBtn.classList.add('active');
                break;
            case 'u':
                DOM.underlineBtn.classList.add('active');
                break;
            case 'del':
            case 's':
                DOM.strikeBtn.classList.add('active');
                break;
            case 'code':
                DOM.codeBtn.classList.add('active');
                break;
            case 'h1':
                DOM.h1Btn.classList.add('active');
                break;
            case 'h2':
                DOM.h2Btn.classList.add('active');
                break;
            case 'h3':
                DOM.h3Btn.classList.add('active');
                break;
            case 'h4':
                DOM.h4Btn.classList.add('active');
                break;
            case 'h5':
                DOM.h5Btn.classList.add('active');
                break;
            case 'h6':
                DOM.h6Btn.classList.add('active');
                break;
            case 'li': {
                const parent = el.parentElement;
                if (parent && parent.tagName === 'UL') DOM.bulletBtn.classList.add('active');
                if (parent && parent.tagName === 'OL') DOM.numberBtn.classList.add('active');
                break;
            }
            case 'blockquote':
                DOM.quoteIncreaseBtn.classList.add('active');
                break;
            case 'a':
                DOM.linkBtn.classList.add('active');
                break;
            case 'img':
                DOM.imageBtn.classList.add('active');
                break;
        }
    },
    
    /**
     * Check if text is wrapped by a marker
     */
    isWrappedBy(before, after, marker) {
        /* Only the caret's line counts. On the last line "after" has no
           newline, so cut at the line end instead of comparing indexes
           (indexOf('\n') is -1 there and nothing is ever less than -1). */
        const nl = after.indexOf('\n');
        const lineAfter = nl < 0 ? after : after.slice(0, nl);
        const beforeHas = before.lastIndexOf(marker) > before.lastIndexOf('\n');
        return beforeHas && lineAfter.indexOf(marker) !== -1;
    },
    
    /**
     * Reset all button states
     */
    resetButtons() {
        const buttons = [
            DOM.boldBtn, DOM.italicBtn, DOM.underlineBtn, DOM.strikeBtn,
            DOM.h1Btn, DOM.h2Btn, DOM.h3Btn, DOM.h4Btn, DOM.h5Btn, DOM.h6Btn,
            DOM.bulletBtn, DOM.numberBtn, DOM.quoteIncreaseBtn,
            DOM.linkBtn, DOM.imageBtn, DOM.codeBtn, DOM.hrBtn
        ];
        
        buttons.forEach(btn => {
            if (btn) btn.classList.remove('active');
        });
        this.setTableEditEnabled(Doc.blockTypeAt() === "table");
    },

    setTableEditEnabled(on) {
        [
            DOM.tableRowAboveBtn, DOM.tableRowBelowBtn, DOM.tableRowDelBtn,
            DOM.tableColLeftBtn, DOM.tableColRightBtn, DOM.tableColDelBtn
        ].forEach(btn => { if (btn) btn.disabled = !on; });
    }
};

// ============================================================================
// FIND IN OTHER PANE — the button beside Track. Select a word (or leave the
// caret in one) in either pane; the same occurrence is selected in the other
// pane and scrolled into view. The offset mapping is Locate (18-locate.js).
// ============================================================================
const PaneLocator = {
    init() {
        if (DOM.locateBtn) DOM.locateBtn.addEventListener('click', () => this.jump());
    },

    jump() {
        if (AppState.viewMode !== 'both') ViewModeManager.setMode('both');
        /* Keep the source pane where it is; scroll only the pane we land in. */
        ScrollSyncManager.hold(250);
        return AppState.activePane === 'preview' ? this.previewToEditor() : this.editorToPreview();
    },

    editorToPreview() {
        const ed = DOM.editor;
        EditorOps.updatePreviewNow();
        const hit = Locate.rawToDoc(ed.value, ed.selectionStart, ed.selectionEnd);
        if (!hit) return this.miss('raw');
        DOM.preview.focus({ preventScroll: true });
        AppState.activePane = 'preview';
        Doc.setSelection(hit.from, hit.to);
        Doc.restorePreviewSelection(DOM.preview);
        this.scrollPreviewToSelection();
        IconHighlighter.checkPreviewFormats();
        return this.found(window.getSelection().toString(), 'preview');
    },

    previewToEditor() {
        Doc.readPreviewSelection(DOM.preview);
        const s = Doc.selection();
        const ed = DOM.editor;
        const hit = Locate.docToRaw(ed.value, s.from, s.to);
        if (!hit) return this.miss('preview');
        ed.focus({ preventScroll: true });
        ed.setSelectionRange(hit.from, hit.to);
        AppState.activePane = 'editor';
        this.scrollEditorTo(hit.from);
        IconHighlighter.checkEditorFormats();
        return this.found(ed.value.slice(hit.from, hit.to), 'raw');
    },

    scrollPreviewToSelection() {
        const s = window.getSelection();
        if (!s.rangeCount) return;
        const r = s.getRangeAt(0).getBoundingClientRect();
        if (!r.width && !r.height) return;
        const box = DOM.previewContainer.getBoundingClientRect();
        DOM.previewContainer.scrollTop += r.top - box.top - box.height / 3;
    },

    /* A textarea has no range rects. Measure the offset in a hidden mirror that
       wraps like the textarea, then put that line a third of the way down. */
    scrollEditorTo(pos) {
        const ed = DOM.editor;
        const cs = getComputedStyle(ed);
        const mirror = document.createElement('div');
        ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'tabSize',
         'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'wordBreak'].forEach(p => { mirror.style[p] = cs[p]; });
        Object.assign(mirror.style, {
            position: 'absolute', visibility: 'hidden', top: '0', left: '-9999px',
            boxSizing: 'border-box', width: ed.clientWidth + 'px',
            whiteSpace: 'pre-wrap', overflowWrap: 'break-word'
        });
        mirror.textContent = ed.value.slice(0, pos);
        const mark = document.createElement('span');
        mark.textContent = '\u200b';
        mirror.appendChild(mark);
        document.body.appendChild(mirror);
        const y = mark.offsetTop;
        document.body.removeChild(mirror);
        ed.scrollTop = Math.max(0, y - ed.clientHeight / 3);
    },

    found(text, pane) {
        DOM.statusLeft.textContent = 'Found "' + text + '" in the ' + pane + ' pane';
        Logger.info('Locate', 'Selected "' + text + '" in the ' + pane + ' pane');
        return true;
    },

    miss(pane) {
        DOM.statusLeft.textContent = 'Could not find that in the other pane. Select a word in the ' + pane + ' pane and try again.';
        return false;
    }
};

// ============================================================================
// FILE OPERATIONS
// ============================================================================
const FileOps = {
    newDocument() {
        if (AppState.isModified) {
            return Dialog.ask('You have unsaved changes. Create a new document anyway?',
                { title: 'Unsaved changes', ok: 'Discard changes' })
                .then(yes => { if (yes) this.clearDocument(); });
        }
        this.clearDocument();
    },

    clearDocument() {
        
        DOM.editor.value = '';
        Doc.load('');
        DOM.preview.innerHTML = Doc.previewHTML();
        AppState.currentFile = null;
        AppState.fileHandle = null;
        AppState.setModified(false);
        this.updateFileNameDisplay();
        EditorOps.updateStatus();
        History.reset('New document');
        Logger.info('File', 'Created new document');
    },
    
    /* Chrome, Edge and Brave expose the File System Access API. With it,
       Open returns a handle and Save writes back to that file. Elsewhere
       (Firefox, Safari) Open uses the <input type=file> and Save downloads. */
    hasFsAccess() {
        return typeof window.showSaveFilePicker === "function"
            && typeof window.showOpenFilePicker === "function";
    },

    OPEN_TYPES: [{
        description: "Markdown, text or HTML",
        accept: { "text/markdown": [".md", ".markdown"], "text/plain": [".txt"], "text/html": [".html"] }
    }],
    SAVE_TYPES: [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown"] } }],

    openFile() {
        if (!this.hasFsAccess()) {
            DOM.fileInput.click();
            return;
        }
        window.showOpenFilePicker({ types: this.OPEN_TYPES, multiple: false })
            .then(handles => {
                const handle = handles && handles[0];
                if (!handle) return;
                return handle.getFile().then(file => this.loadFile(file, handle));
            })
            .catch(err => {
                if (err && err.name === "AbortError") { Logger.info("File", "Open cancelled"); return; }
                Logger.error("File", "Open picker failed: " + (err && err.message));
                DOM.statusLeft.textContent = "Open failed: " + (err && err.message);
            });
    },
    
    handleFileOpen(event) {
        const file = event.target.files[0];
        if (!file) return;
        this.loadFile(file);
        // Reset file input
        event.target.value = '';
    },
    
    loadFile(file, handle) {
        // Validate file type
        const validExtensions = ['.md', '.markdown', '.txt', '.html'];
        const extension = '.' + file.name.split('.').pop().toLowerCase();
        
        if (!validExtensions.includes(extension)) {
            Dialog.tell(`${file.name} is not a supported file type. Please use .md, .txt, or .html files.`, 'Cannot open file');
            return;
        }
        
        const reader = new FileReader();
        reader.onload = (e) => {
            let content = e.target.result;
            
            // If HTML file, convert to markdown
            if (file.name.endsWith('.html')) {
                const doc = new DOMParser().parseFromString(content, 'text/html');
                content = HtmlToMarkdown.convert(doc.body ? doc.body.innerHTML : '');
            }
            
            DOM.editor.value = content;
            EditorOps.updatePreviewNow();
            AppState.currentFile = file.name;
            /* Never write markdown back over an .html source. */
            AppState.fileHandle = handle && extension !== '.html' ? handle : null;
            AppState.setModified(false);
            this.updateFileNameDisplay();
            DOM.statusLeft.textContent = `Opened: ${file.name}`;
            History.reset('Open ' + file.name);
            Logger.info('File', `Opened: ${file.name}`);
        };
        reader.onerror = () => {
            Dialog.tell(`Error reading ${file.name}. Please try again.`, 'Cannot open file');
            Logger.error('File', `Error reading: ${file.name}`);
        };
        reader.readAsText(file);
    },
    
    /* Ctrl+S. Writes back to the opened file when we hold a handle; asks
       where the first time; downloads where the API does not exist. */
    saveFile() {
        if (AppState.fileHandle) {
            return this.writeToHandle(AppState.fileHandle).then(ok => ok ? true : this.saveAs());
        }
        return this.saveAs();
    },

    /* Ctrl+Shift+S. Always asks where. */
    saveAs() {
        if (!this.hasFsAccess()) {
            this.exportAs('md');
            return Promise.resolve(true);
        }
        return window.showSaveFilePicker({ suggestedName: this.suggestedName(), types: this.SAVE_TYPES })
            .then(handle => this.writeToHandle(handle).then(ok => {
                if (ok) AppState.fileHandle = handle;
                return ok;
            }))
            .catch(err => {
                if (err && err.name === "AbortError") { Logger.info("File", "Save As cancelled"); return false; }
                Logger.warn("File", "Save picker failed (" + (err && err.message) + "); downloading instead");
                this.exportAs('md');
                return true;
            });
    },

    suggestedName() {
        const base = AppState.currentFile ? AppState.currentFile.replace(/\.[^/.]+$/, '') : 'document';
        return base + '.md';
    },

    async writeToHandle(handle) {
        try {
            if (typeof handle.queryPermission === "function") {
                let p = await handle.queryPermission({ mode: "readwrite" });
                if (p !== "granted" && typeof handle.requestPermission === "function") {
                    p = await handle.requestPermission({ mode: "readwrite" });
                }
                if (p !== "granted") {
                    Logger.warn("File", "Write permission not granted for " + handle.name);
                    DOM.statusLeft.textContent = "Not saved: permission denied for " + handle.name;
                    return false;
                }
            }
            const writable = await handle.createWritable();
            await writable.write(DOM.editor.value);
            await writable.close();
            AppState.currentFile = handle.name;
            AppState.setModified(false);
            this.updateFileNameDisplay();
            DOM.statusLeft.textContent = "Saved: " + handle.name;
            Logger.success("File", "Saved: " + handle.name);
            return true;
        } catch (err) {
            Logger.error("File", "Save failed: " + (err && err.message));
            DOM.statusLeft.textContent = "Save failed: " + (err && err.message);
            return false;
        }
    },
    
    exportAs(format) {
        const markdown = DOM.editor.value;
        let content, mimeType, extension;
        
        switch (format) {
            case 'md':
                content = markdown;
                mimeType = 'text/markdown';
                extension = '.md';
                break;
                
            case 'html':
                const htmlContent = MarkdownParser.parse(markdown);
                content = this.generateHtmlDocument(htmlContent);
                mimeType = 'text/html';
                extension = '.html';
                break;
                
            case 'txt':
                // Strip markdown formatting for plain text
                content = this.stripMarkdown(markdown);
                mimeType = 'text/plain';
                extension = '.txt';
                break;
                
            default:
                return;
        }
        
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        
        // Get base filename without extension
        let baseName = 'document';
        if (AppState.currentFile) {
            baseName = AppState.currentFile.replace(/\.[^/.]+$/, '');
        }
        
        const a = document.createElement('a');
        a.href = url;
        a.download = baseName + extension;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        if (format === 'md') {
            AppState.setModified(false);
            AppState.currentFile = a.download;
            this.updateFileNameDisplay();
        }
        
        DOM.statusLeft.textContent = `Downloaded: ${a.download}`;
        Logger.info('File', `Downloaded as ${format.toUpperCase()}: ${a.download}`);
    },

    // Hosted demo only: grab the original file, not the live DOM (which has
    // whatever the visitor typed). file:// cannot fetch; the href is enough.
    downloadEditor() {
        const name = "markdown-editor.html";
        const clickHref = (href, revoke) => {
            const a = document.createElement("a");
            a.href = href;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (revoke) setTimeout(() => URL.revokeObjectURL(href), 1500);
            DOM.statusLeft.textContent = "Downloaded: " + name;
            Logger.info("File", "Downloaded editor app: " + name);
        };
        const pageUrl = location.href.split("#")[0].split("?")[0];
        if (location.protocol === "http:" || location.protocol === "https:") {
            fetch(pageUrl, { cache: "no-store" }).then(r => {
                if (!r.ok) throw new Error(String(r.status));
                return r.blob();
            }).then(blob => clickHref(URL.createObjectURL(blob), true))
              .catch(() => clickHref("markdown-editor.html", false));
            return;
        }
        clickHref("markdown-editor.html", false);
    },
    
    generateHtmlDocument(bodyContent) {
        return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${AppState.currentFile ? AppState.currentFile.replace(/\.[^/.]+$/, '') : 'Document'}</title>
    <style>
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    line-height: 1.6;
    color: #333;
}
h1, h2, h3, h4, h5, h6 { margin-top: 1.5em; margin-bottom: 0.5em; }
h1 { border-bottom: 2px solid #eee; padding-bottom: 0.3em; }
h2 { border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
pre { background: #1f2937; color: #f9fafb; padding: 16px; border-radius: 8px; overflow-x: auto; }
pre code { background: none; padding: 0; color: inherit; }
blockquote { border-left: 4px solid #3b82f6; margin: 1em 0; padding: 0.5em 1em; background: #eff6ff; }
a { color: #2563eb; }
img { max-width: 100%; height: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
th { background: #f9f9f9; }
pre[data-lang] { position: relative; }
pre[data-lang]::before { content: attr(data-lang); position: absolute; top: 5px; right: 10px; font: 600 10px/1 sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #9ca3af; }
.hl-k { color: #c4a7ff; } .hl-s { color: #a5e3a0; } .hl-c { color: #8b949e; font-style: italic; }
.hl-n { color: #ffb86c; } .hl-v { color: #7dd3fc; } .hl-f { color: #82b1ff; } .hl-t { color: #ff9eb1; }
.hl-a { color: #fcd34d; } .hl-h { color: #93c5fd; font-weight: 600; }
.hl-ins { color: #86efac; background: rgba(34, 197, 94, .14); } .hl-del { color: #fca5a5; background: rgba(239, 68, 68, .14); }
.markdown-alert-title { font-weight: 600; margin: 0 0 .35em; }
.markdown-alert-note { border-left-color: #2563eb; background: #eff6ff; } .markdown-alert-note .markdown-alert-title { color: #1d4ed8; }
.markdown-alert-tip { border-left-color: #16a34a; background: #f0fdf4; } .markdown-alert-tip .markdown-alert-title { color: #15803d; }
.markdown-alert-important { border-left-color: #9333ea; background: #faf5ff; } .markdown-alert-important .markdown-alert-title { color: #7e22ce; }
.markdown-alert-warning { border-left-color: #d97706; background: #fffbeb; } .markdown-alert-warning .markdown-alert-title { color: #b45309; }
.markdown-alert-caution { border-left-color: #dc2626; background: #fef2f2; } .markdown-alert-caution .markdown-alert-title { color: #b91c1c; }
    </style>
</head>
<body>
${bodyContent}
</body>
</html>`;
    },
    
    stripMarkdown(markdown) {
        let text = markdown;
        // Remove headers
        text = text.replace(/^#{1,6}\s+/gm, '');
        // Remove bold/italic
        text = text.replace(/\*\*(.+?)\*\*/g, '$1');
        text = text.replace(/\*(.+?)\*/g, '$1');
        text = text.replace(/__(.+?)__/g, '$1');
        text = text.replace(/_(.+?)_/g, '$1');
        // Remove strikethrough
        text = text.replace(/~~(.+?)~~/g, '$1');
        // Remove links but keep text
        text = text.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        // Remove images
        text = text.replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1');
        // Remove inline code
        text = text.replace(/`([^`]+)`/g, '$1');
        // Remove code blocks
        text = text.replace(/```[\s\S]*?```/g, '');
        // Remove blockquotes
        text = text.replace(/^>\s*/gm, '');
        // Remove list markers
        text = text.replace(/^[-*+]\s+/gm, '');
        text = text.replace(/^\d+\.\s+/gm, '');
        // Remove horizontal rules
        text = text.replace(/^(-{3,}|\*{3,}|_{3,})$/gm, '');
        return text;
    },
    
    updateFileNameDisplay() {
        if (DOM.fileNameDisplay) {
            DOM.fileNameDisplay.textContent = AppState.currentFile || '';
        }
    }
};

// ============================================================================
// DRAG AND DROP HANDLER
// ============================================================================
const DragDropHandler = {
    dragCounter: 0,
    
    init() {
        // Prevent default drag behaviors on document
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, this.preventDefaults, false);
        });
        
        // Handle drag enter/leave for overlay
        document.body.addEventListener('dragenter', (e) => this.handleDragEnter(e), false);
        document.body.addEventListener('dragleave', (e) => this.handleDragLeave(e), false);
        document.body.addEventListener('dragover', (e) => this.handleDragOver(e), false);
        document.body.addEventListener('drop', (e) => this.handleDrop(e), false);
        
        Logger.info('DragDrop', 'Drag and drop initialized');
    },
    
    preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    },
    
    handleDragEnter(e) {
        this.dragCounter++;
        
        // Check if dragging files
        if (e.dataTransfer && e.dataTransfer.types.includes('Files')) {
            DOM.dragOverlay.classList.add('active');
        }
    },
    
    handleDragLeave(e) {
        this.dragCounter--;
        
        if (this.dragCounter === 0) {
            DOM.dragOverlay.classList.remove('active');
        }
    },
    
    handleDragOver(e) {
        e.dataTransfer.dropEffect = 'copy';
    },
    
    handleDrop(e) {
        this.dragCounter = 0;
        DOM.dragOverlay.classList.remove('active');
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            // Only handle the first file
            const file = files[0];
            
            // Check for unsaved changes
            /* Not confirm(): in a sandboxed iframe without allow-modals it
               returns false with no prompt, and the drop was thrown away. */
            if (AppState.isModified) {
                Dialog.ask('You have unsaved changes. Load the dropped file anyway?',
                    { title: 'Unsaved changes', ok: 'Discard changes' })
                    .then(yes => {
                        if (!yes) { Logger.info('DragDrop', `Drop cancelled: ${file.name}`); return; }
                        FileOps.loadFile(file);
                        Logger.info('DragDrop', `File dropped: ${file.name}`);
                    });
                return;
            }
            
            FileOps.loadFile(file);
            Logger.info('DragDrop', `File dropped: ${file.name}`);
        }
    }
};

// ============================================================================
// DIALOG — in-page confirm/alert. Never call window.confirm()/alert(): a
// sandboxed iframe without allow-modals ignores them (confirm returns false
// with nothing shown), so a host embedding the editor loses every answer.
// ============================================================================
const Dialog = {
    _resolve: null,
    _return: null,

    /* Resolves true for OK, false for Cancel / Escape / backdrop. */
    ask(message, opts) {
        opts = opts || {};
        if (this._resolve) this.close(false);
        this._return = document.activeElement;
        DOM.dialogTitle.textContent = opts.title || 'Markdown Editor';
        DOM.dialogMessage.textContent = message;
        DOM.dialogOk.textContent = opts.ok || 'OK';
        DOM.dialogCancel.textContent = opts.cancel || 'Cancel';
        DOM.dialogCancel.hidden = !!opts.notice;
        DOM.dialogModal.classList.add('active');
        (opts.notice ? DOM.dialogOk : DOM.dialogCancel).focus();
        return new Promise(res => { this._resolve = res; });
    },

    tell(message, title) {
        return this.ask(message, { title, notice: true }).then(() => undefined);
    },

    isOpen() {
        return !!this._resolve;
    },

    close(result) {
        if (!this._resolve) return;
        const res = this._resolve;
        const back = this._return;
        this._resolve = null;
        this._return = null;
        DOM.dialogModal.classList.remove('active');
        if (back && back.focus && document.contains(back) && back !== document.body) back.focus();
        res(!!result);
    }
};

// MODAL HANDLERS
// ============================================================================
const ModalOps = {
    _saved: null,

    saveCaret() {
        if (AppState.activePane === "preview") Doc.readPreviewSelection(DOM.preview);
        this._saved = {
            pane: AppState.activePane,
            from: Doc.selection().from,
            to: Doc.selection().to,
            editorStart: DOM.editor.selectionStart,
            editorEnd: DOM.editor.selectionEnd
        };
    },

    insertAtSaved(md, label) {
        const s = this._saved || { pane: AppState.activePane, from: Doc.selection().from, to: Doc.selection().to };
        if (s.pane === "editor") {
            AppState.activePane = "editor";
            const from = s.editorStart != null ? s.editorStart : DOM.editor.selectionStart;
            const to = s.editorEnd != null ? s.editorEnd : DOM.editor.selectionEnd;
            EditorOps.replaceSpan(from, to, md);
            EditorOps.updatePreviewNow();
            AppState.setModified(true);
            DOM.editor.focus();
            const end = from + md.length;
            DOM.editor.setSelectionRange(end, end);
        } else {
            AppState.activePane = "preview";
            Doc.setSelection(s.from, s.to);
            Doc.insertInlineMarkdown(md);
            syncFromDoc("preview");
            DOM.preview.focus();
        }
        History.commit(label || "Insert");
    },

    openLinkModal() {
        // Check if cursor is on an existing link
        const selection = window.getSelection();
        let existingText = '';
        let existingUrl = '';
        
        if (AppState.activePane === 'editor') {
            const editor = DOM.editor;
            const pos = editor.selectionStart;
            const text = editor.value;
            
            const { lineStart, lineEnd } = EditorOps.lineBounds(text, pos, pos);
            const line = text.substring(lineStart, lineEnd);
            
            // Check for link at cursor position
            const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let match;
            while ((match = linkRegex.exec(line)) !== null) {
                const linkStart = lineStart + match.index;
                const linkEnd = linkStart + match[0].length;
                if (pos >= linkStart && pos <= linkEnd) {
                    existingText = match[1];
                    existingUrl = match[2];
                    break;
                }
            }
            
            // If no existing link, use selected text
            if (!existingText && editor.selectionStart !== editor.selectionEnd) {
                existingText = text.substring(editor.selectionStart, editor.selectionEnd);
            }
        } else if (AppState.activePane === 'preview') {
            // Check for link in preview
            if (selection.rangeCount) {
                let node = selection.anchorNode;
                while (node && node !== DOM.preview) {
                    if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'A') {
                        existingText = node.textContent;
                        existingUrl = node.getAttribute('href');
                        break;
                    }
                    node = node.parentNode;
                }
                
                if (!existingText) {
                    existingText = selection.toString();
                }
            }
        }
        
        this.saveCaret();
        DOM.linkText.value = existingText;
        DOM.linkUrl.value = existingUrl;
        DOM.linkModal.classList.add('active');
        DOM.linkText.focus();
    },
    
    closeLinkModal() {
        DOM.linkModal.classList.remove('active');
        DOM.linkText.value = '';
        DOM.linkUrl.value = '';
        DOM.linkText.blur();
        DOM.linkUrl.blur();
    },
    
    submitLink() {
        const text = DOM.linkText.value.trim();
        const url = DOM.linkUrl.value.trim();
        
        if (!text || !url) {
            Dialog.tell('Please enter both link text and URL.', 'Insert Link');
            return;
        }
        
        this.closeLinkModal();
        this.insertAtSaved("[" + text + "](" + url + ")", "Insert link");
    },
    
    openImageModal() {
        // Check if cursor is on an existing image
        let existingAlt = '';
        let existingUrl = '';
        
        if (AppState.activePane === 'editor') {
            const editor = DOM.editor;
            const pos = editor.selectionStart;
            const text = editor.value;
            
            const { lineStart, lineEnd } = EditorOps.lineBounds(text, pos, pos);
            const line = text.substring(lineStart, lineEnd);
            
            // Check for image at cursor position
            const imgRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
            let match;
            while ((match = imgRegex.exec(line)) !== null) {
                const imgStart = lineStart + match.index;
                const imgEnd = imgStart + match[0].length;
                if (pos >= imgStart && pos <= imgEnd) {
                    existingAlt = match[1];
                    existingUrl = match[2];
                    break;
                }
            }
        } else if (AppState.activePane === 'preview') {
            const selection = window.getSelection();
            if (selection.rangeCount) {
                let node = selection.anchorNode;
                while (node && node !== DOM.preview) {
                    if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'IMG') {
                        existingAlt = node.getAttribute('alt') || '';
                        existingUrl = node.getAttribute('src') || '';
                        break;
                    }
                    node = node.parentNode;
                }
            }
        }
        
        this.saveCaret();
        DOM.imageAlt.value = existingAlt;
        DOM.imageUrl.value = existingUrl;
        DOM.imageModal.classList.add('active');
        DOM.imageAlt.focus();
    },
    
    closeImageModal() {
        DOM.imageModal.classList.remove('active');
        DOM.imageAlt.value = '';
        DOM.imageUrl.value = '';
        DOM.imageAlt.blur();
        DOM.imageUrl.blur();
    },
    
    submitImage() {
        const alt = DOM.imageAlt.value.trim();
        const url = DOM.imageUrl.value.trim();
        
        if (!url) {
            Dialog.tell('Please enter an image URL.', 'Insert Image');
            return;
        }
        
        this.closeImageModal();
        this.insertAtSaved("![" + alt + "](" + url + ")", "Insert image");
    }
};

// HELP — HELP_MD (src/help.md, embedded by build.js) rendered by Doc.html in a
// panel over the editor. It never touches the document. Download saves the
// same Markdown: the file an AI needs next to markdown-editor.html.

const HelpOps = {
    FILE_NAME: 'markdown-editor-help.md',
    _rendered: false,
    _return: null,

    isOpen() {
        return !!DOM.helpPanel && DOM.helpPanel.classList.contains('active');
    },

    render() {
        DOM.helpBody.innerHTML = Doc.html(Doc.parse(HELP_MD));
        /* Export HTML carries a title element; here the shared ::before draws it. */
        DOM.helpBody.querySelectorAll('.markdown-alert-title').forEach(el => el.remove());
        DOM.helpBody.querySelectorAll('a[href]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
        DOM.helpToc.innerHTML = '';
        DOM.helpBody.querySelectorAll('h2').forEach((h, i) => {
            h.id = 'help-section-' + i;
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'help-toc-item';
            item.textContent = h.textContent;
            item.addEventListener('click', () => h.scrollIntoView({ block: 'start' }));
            DOM.helpToc.appendChild(item);
        });
        DOM.helpVersion.textContent = 'v' + BUILD.version;
        this._rendered = true;
    },

    open() {
        if (!this._rendered) this.render();
        if (this.isOpen()) return;
        /* Clicking Help focuses the button; closing should go back to writing. */
        const active = document.activeElement;
        this._return = active === DOM.editor || active === DOM.preview
            ? active
            : (AppState.activePane === 'preview' ? DOM.preview : DOM.editor);
        DOM.helpPanel.classList.add('active');
        DOM.helpClose.focus();
    },

    close() {
        if (!this.isOpen()) return;
        DOM.helpPanel.classList.remove('active');
        const back = this._return;
        this._return = null;
        if (back && back.focus && document.contains(back) && back !== document.body) back.focus();
    },

    toggle() {
        if (this.isOpen()) this.close(); else this.open();
    },

    download() {
        const blob = new Blob([HELP_MD], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = this.FILE_NAME;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        DOM.statusLeft.textContent = 'Downloaded: ' + this.FILE_NAME;
        Logger.info('Help', 'Downloaded ' + this.FILE_NAME);
    }
};

    });
