            if (j < 0 || j === from) return false;
            /* Delimiters hug their text: "2 * 3 * 4" is arithmetic, not
               italics. Code spans keep their inner spaces. */
            if (mark !== "code" && (/\s/.test(s[from]) || /\s/.test(s[j - 1]))) return false;
            flush();
            const next = new Set(marks);
            next.add(mark);
            runs.push(...parseInlines(s.slice(from, j), next));
            i = j + close.length;
            return true;
        };
        while (i < s.length) {
            if (s.startsWith("![", i)) {
                const m = s.slice(i).match(/^!\[([^\]]*)\]\(([^)]+)\)/);
                if (m) {
                    flush();
                    runs.push({ type: "image", text: m[1] || "", alt: m[1], src: m[2], marks: [...marks] });
                    i += m[0].length;
                    continue;
                }
            }
            if (s[i] === "[") {
                const m = s.slice(i).match(/^\[([^\]]+)\]\(([^)]+)\)/);
                if (m) {
                    flush();
                    const inner = parseInlines(m[1], marks);
                    inner.forEach(r => { r.href = m[2]; });
                    runs.push(...inner);
                    i += m[0].length;
                    continue;
                }
            }
            if (!marks.has("bold") && !marks.has("italic") && s.startsWith("***", i)) {
                const j = s.indexOf("***", i + 3);
                if (j > i + 3) {
                    flush();
                    const next = new Set(marks);
                    next.add("bold");
                    next.add("italic");
                    runs.push(...parseInlines(s.slice(i + 3, j), next));
                    i = j + 3;
                    continue;
                }
            }
            if (tryPair("**", "**", "bold")) continue;
            if (tryPair("++", "++", "underline")) continue;
            if (tryPair("~~", "~~", "strike")) continue;
            if (tryPair("`", "`", "code")) continue;
            if (tryPair("*", "*", "italic")) continue;
            if (s[i] === "_" && (i === 0 || /[^A-Za-z0-9_]/.test(s[i - 1])) && !marks.has("italic")) {
                const j = s.indexOf("_", i + 1);
                if (j > i + 1 && (j + 1 >= s.length || /[^A-Za-z0-9_]/.test(s[j + 1]))) {
                    flush();
                    const next = new Set(marks);
                    next.add("italic");
                    runs.push(...parseInlines(s.slice(i + 1, j), next));
                    i = j + 1;
                    continue;
                }
            }
            buf += s[i++];
        }
        flush();
        return mergeInlines(runs);
    }

    function serRun(r) {
        if (r.type === "image") return "![" + (r.alt || "") + "](" + (r.src || "") + ")";
        let s = r.text || "";
        const m = r.marks || [];
        const bold = m.includes("bold");
        const italic = m.includes("italic");
        if (m.includes("code")) s = "`" + s + "`";
        if (m.includes("strike")) s = "~~" + s + "~~";
        if (m.includes("underline")) s = "++" + s + "++";
        /* Never emit ***text*** — a ** pair would wrap "*text" and round-trip wrong. */
        if (italic) s = (bold ? "_" : "*") + s + (bold ? "_" : "*");
        if (bold) s = "**" + s + "**";
        if (r.href) s = "[" + s + "](" + r.href + ")";
        return s;
    }
    function serInlines(ins) { return (ins || []).map(serRun).join(""); }

    function serBlock(b) {
        switch (b.type) {
            case "h1": case "h2": case "h3": case "h4": case "h5": case "h6":
                return "#".repeat(+b.type[1]) + " " + serInlines(b.inlines);
            case "hr": return "---";
            case "pre": return "```" + (b.lang || "") + "\n" + (b.text || "") + "\n```";
            case "ul": return (b.items || []).map(it => "- " + serInlines(it)).join("\n");
            case "ol": return (b.items || []).map((it, i) => (i + 1) + ". " + serInlines(it)).join("\n");
            case "quote": {
                const kids = dropTrailingEmpty((b.blocks || []).slice());
                let inner = kids.map(serBlock).join("\n\n");
                if (ALERTS.includes(b.alert)) inner = "[!" + b.alert.toUpperCase() + "]" + (inner ? "\n" + inner : "");
                return inner.split("\n").map(l => l === "" ? ">" : "> " + l).join("\n");
            }
            case "table": {
                const rows = b.rows || [];
                if (!rows.length) return "";
                const pipe = row => "| " + row.join(" | ") + " |";
                const lines = [pipe(rows[0]), "| " + rows[0].map(() => "---").join(" | ") + " |"];
                for (let i = 1; i < rows.length; i++) lines.push(pipe(rows[i]));
                return lines.join("\n");
            }
            default: return serInlines(b.inlines);
        }
    }

    function parse(md) {
        if (!md) return empty();
        const fences = [];
        md = String(md).replace(/```([\w+#-]*)\n([\s\S]*?)```/g, (_, lang, body) => {
            fences.push({ lang, body: body.replace(/\n$/, "") });
            return "\n\x00FENCE" + (fences.length - 1) + "\x00\n";
        });
        const lines = md.split("\n");
        const blocks = [];
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];
            const fm = line.match(/^\x00FENCE(\d+)\x00$/);
            if (fm) { blocks.push({ type: "pre", lang: fences[+fm[1]].lang, text: fences[+fm[1]].body }); i++; continue; }
            if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim()) && line.trim().length >= 3) { blocks.push({ type: "hr" }); i++; continue; }
            const h = line.match(/^(#{1,6})\s+(.*)$/);
            if (h) { blocks.push({ type: "h" + h[1].length, inlines: parseInlines(h[2]) }); i++; continue; }
            if (/^\s*$/.test(line)) { i++; continue; }
            if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i + 1].trim())) {
                const rows = [];
                while (i < lines.length && lines[i].trim().startsWith("|") && lines[i].trim().endsWith("|")) {
                    if (!/^\|[\s\-:|]+\|$/.test(lines[i].trim())) {
                        rows.push(lines[i].split("|").slice(1, -1).map(c => c.trim()));
                    }
                    i++;
                }
                blocks.push({ type: "table", rows });
                continue;
            }
            if (/^>/.test(line)) {
                const q = [];
                while (i < lines.length && /^>/.test(lines[i])) {
                    q.push(lines[i].replace(/^>\s?/, ""));
                    i++;
                }
                const am = q.length ? ALERT_LINE.exec(q[0]) : null;
                if (am) q.shift();
                const quote = { type: "quote", blocks: parse(q.join("\n")).blocks };
                if (am) quote.alert = am[1].toLowerCase();
                blocks.push(quote);
                continue;
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                const got = collectList(lines, i, /^\s*[-*+]\s+/);
                blocks.push({ type: "ul", items: got.items });
                i = got.i;
                continue;
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                const got = collectList(lines, i, /^\s*\d+\.\s+/);
                blocks.push({ type: "ol", items: got.items });
                i = got.i;
                continue;
            }
            /* No block rule above took this line, so it is paragraph text
               even when it starts with a pipe (a table header typed before
               its separator line). Consume it unconditionally: a paragraph
               that does not advance i is an infinite loop. */
            const para = [lines[i++]];
            while (i < lines.length && lines[i].trim() !== ""
                && !/^(#{1,6}\s|\x00FENCE|>\s?|[-*+]\s|\d+\.\s|\|)/.test(lines[i])
                && !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
                para.push(lines[i]);
                i++;
            }
            blocks.push({ type: "p", inlines: parseInlines(para.join(" ")) });
        }
        if (!blocks.length) blocks.push({ type: "p", inlines: [] });
        return { blocks: mergeAdjacentLists(blocks) };
    }

    function collectList(lines, start, re) {
        const items = [];
        let i = start;
        while (i < lines.length) {
            if (re.test(lines[i])) {
                items.push(parseInlines(lines[i].replace(re, "")));
                i++;
                continue;
            }
            if (/^\s*$/.test(lines[i])) {
                let j = i;
                while (j < lines.length && /^\s*$/.test(lines[j])) j++;
                if (j < lines.length && re.test(lines[j])) {
                    i = j;
                    continue;
                }
            }
            break;
        }
        return { items, i };
    }

    function mergeAdjacentLists(blocks) {
        const out = [];
        for (const b of blocks) {
            const prev = out[out.length - 1];
            if (prev && (b.type === "ol" || b.type === "ul") && prev.type === b.type) {
                prev.items = (prev.items || []).concat(b.items || []);
            } else out.push(b);
        }
        return out;
    }

    function toMarkdown(doc) {
        return exportBlocks(doc || state).map(serBlock).join("\n\n");
    }

    /* ---- HTML render ----------------------------------------------------- */
    function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escUrl(u) {
        u = String(u || "").trim();
        if (/^(javascript|data|vbscript):/i.test(u)) return "#";
        return esc(u);
    }
    function wrapRun(r, from, mapped) {
        const to = from + (r.text || "").length;
        if (r.type === "image") {
            return "<img src=\"" + escUrl(r.src) + "\" alt=\"" + esc(r.alt || "") + "\""
                + (mapped ? " data-from=\"" + from + "\" data-to=\"" + to + "\"" : "") + ">";
        }
        let inner = esc(r.text || "");
        const order = ["code", "strike", "underline", "italic", "bold"];
        for (const mk of order) {
            if ((r.marks || []).includes(mk)) inner = "<" + MARK_TAG[mk] + ">" + inner + "</" + MARK_TAG[mk] + ">";
        }
        if (r.href) inner = "<a href=\"" + escUrl(r.href) + "\">" + inner + "</a>";
        if (mapped) inner = "<span data-from=\"" + from + "\" data-to=\"" + to + "\">" + inner + "</span>";
        return inner;
    }
    function renderInlines(ins, from, mapped) {
        let html = "", pos = from;
        for (const r of ins || []) {
            html += wrapRun(r, pos, mapped);
            pos += (r.text || "").length;
        }
        return html;
    }
    function renderBlock(b, from, mapped) {
        const body = () => renderInlines(b.inlines, from, mapped);
        const caretHole = () => (mapped && !inlinesText(b.inlines))
            ? "<span data-from=\"" + from + "\" data-to=\"" + from + "\"><br></span>"
            : "";
        switch (b.type) {
            case "h1": case "h2": case "h3": case "h4": case "h5": case "h6":
                return "<" + b.type + ">" + (body() || caretHole()) + "</" + b.type + ">";
            case "hr":
                return mapped
                    ? "<hr data-from=\"" + from + "\" data-to=\"" + (from + 1) + "\">"
                    : "<hr>";
            case "pre": {
                const lang = String(b.lang || "").replace(/[^\w+#-]/g, "");
                const body = b.text || "";
                /* Colour spans nest inside the data-from span; the caret map counts text only. */
                const colored = Highlight.html(body, lang);
                const inner = mapped
                    ? "<span data-from=\"" + from + "\" data-to=\"" + (from + body.length) + "\">"
                        + (body ? colored : "<br>") + "</span>"
                    : colored;
                return (lang ? "<pre data-lang=\"" + lang + "\">" : "<pre>")
                    + "<code class=\"language-" + lang + "\">" + inner + "</code></pre>";
            }
            case "ul":
            case "ol": {
                const tag = b.type;
                let pos = from, html = "<" + tag + ">";
                (b.items || []).forEach((it, i) => {
                    const inner = renderInlines(it, pos, mapped);
                    const hole = mapped && !inlinesText(it)
                        ? "<span data-from=\"" + pos + "\" data-to=\"" + pos + "\"><br></span>"
                        : "";
                    html += "<li>" + (inner || hole) + "</li>";
                    pos += inlinesText(it).length + (i < b.items.length - 1 ? 1 : 0);
                });
                return html + "</" + tag + ">";
            }
            case "quote": {
                /* The preview title is CSS (::before) so it is not editable text.
                   Export gets a real title element; the classes are GitHub's. */
                const alert = ALERTS.includes(b.alert) ? b.alert : "";
                const title = alert ? alert[0].toUpperCase() + alert.slice(1) : "";
                let pos = from, html = alert
                    ? "<blockquote class=\"markdown-alert markdown-alert-" + alert + "\" data-alert=\"" + title + "\">"
                        + (mapped ? "" : "<p class=\"markdown-alert-title\">" + title + "</p>")
                    : "<blockquote>";
                (b.blocks || []).forEach((inner, i) => {
                    html += renderBlock(inner, pos, mapped);
                    pos += blockText(inner).length + (i < b.blocks.length - 1 ? 1 : 0);
                });
                return html + "</blockquote>";
            }
            case "table": {
                const rows = b.rows || [];
                if (!rows.length) return "";
                let pos = from;
                const cell = (tag, text, r, c) => {
                    const t = String(text || "");
                    const to = pos + t.length;
                    const attrs = mapped ? " data-from=\"" + pos + "\" data-to=\"" + to + "\" data-row=\"" + r + "\" data-col=\"" + c + "\"" : "";
                    const inner = t ? esc(t) : (mapped ? "<br>" : "");
                    const html = "<" + tag + attrs + ">" + inner + "</" + tag + ">";
                    const last = r === rows.length - 1 && c === rows[r].length - 1;
                    pos = last ? to : to + 1;
                    return html;
                };
                let html = "<table><thead><tr>";
                rows[0].forEach((c, i) => { html += cell("th", c, 0, i); });
                html += "</tr></thead><tbody>";
                for (let r = 1; r < rows.length; r++) {
                    html += "<tr>";
                    rows[r].forEach((c, i) => { html += cell("td", c, r, i); });
                    html += "</tr>";
                }
                return html + "</tbody></table>";
            }
            default: return "<p>" + (body() || caretHole()) + "</p>";
        }
    }
    function html(doc) {
        return exportBlocks(doc || state).map(b => renderBlock(b, 0, false)).join("\n");
    }
    function previewHTML(doc) {
        if (doc === undefined || doc === state) ensureTrail();
        doc = doc || state;
        const ix = index(doc);
        return (doc.blocks || []).map((b, i) => renderBlock(b, ix[i] ? ix[i].from : 0, true)).join("\n");
    }

    /* ---- ops ------------------------------------------------------------- */
    function splitInlines(ins, offset) {
        /* Do not merge after the cut. mergeInlines would glue the two halves
           back because they still share marks, and applyMarkToInlines would
           then skip the run (a >= lo && b <= hi fails). That was the
           "**abc **" / trailing-space no-op. Merge only after the mark is applied. */
        let o = 0;
        const out = [];
        for (const r of ins || []) {
            if (r.type === "image") { out.push(r); o += (r.text || "").length; continue; }
            const n = (r.text || "").length;
            if (offset > o && offset < o + n) {
                const k = offset - o;
                out.push({ ...r, text: r.text.slice(0, k) });
                out.push({ ...r, text: r.text.slice(k) });
            } else out.push(r);
            o += n;
        }
        return out;
    }
    function applyMarkToInlines(ins, lo, hi, mark, remove) {
        if (lo === hi) return ins;
        ins = splitInlines(ins, lo);
        ins = splitInlines(ins, hi);
        let o = 0;
        const out = [];
        for (const r of ins) {
            const n = (r.text || "").length;
            const a = o, b = o + n;
            o = b;
            if (n && a >= lo && b <= hi && r.type !== "image") {
                const set = new Set(r.marks);
                if (remove) set.delete(mark); else set.add(mark);
                out.push({ ...r, marks: [...set].sort() });
            } else out.push(r);
        }
        return mergeInlines(out);
    }
    function walkCharRuns(doc, from, to, fn) {
        const ix = index(doc);
        for (const b of ix) {
            if (to <= b.from || from >= b.to) continue;
            const lo = Math.max(0, from - b.from);
            const hi = Math.min(b.text.length, to - b.from);
            const block = doc.blocks[b.i];
            if (block.inlines) fn(block, lo, hi, "inlines");
            else if (block.items) {
                let o = 0;
                block.items.forEach((it, k) => {
                    const n = inlinesText(it).length;
                    const a = o, c = o + n;
                    o = c + (k < block.items.length - 1 ? 1 : 0);
                    const rlo = Math.max(0, lo - a);
                    const rhi = Math.min(n, hi - a);
                    if (rhi > rlo) fn(block, rlo, rhi, "item", k);
                });
            }
        }
    }
    function rangeFullyMarked(from, to, mark) {
        if (from === to) return false;
        let ok = true, any = false;
        walkCharRuns(state, from, to, (block, lo, hi, kind, item) => {
            const ins = kind === "item" ? block.items[item] : block.inlines;
            let o = 0;
            for (const r of ins || []) {
                const n = (r.text || "").length;
                const a = o, b = o + n;
                o = b;
                const s = Math.max(a, lo), e = Math.min(b, hi);
                if (e > s) {
                    any = true;
                    if (!(r.marks || []).includes(mark)) ok = false;
                }
            }
        });
        return any && ok;
    }

    function trimRange(from, to) {
        const text = docText(state);
        while (from < to && /\s/.test(text[from])) from++;
        while (to > from && /\s/.test(text[to - 1])) to--;
        return { from, to };
    }
    function trimSelWs() {
        sel = trimRange(sel.from, sel.to);
    }

    function toggleMark(mark) {
        trimSelWs();
        let { from, to } = sel;
        if (from === to) return;
        const remove = rangeFullyMarked(from, to, mark);
        walkCharRuns(state, from, to, (block, lo, hi, kind, item) => {
            if (kind === "item") block.items[item] = applyMarkToInlines(block.items[item], lo, hi, mark, remove);
            else block.inlines = applyMarkToInlines(block.inlines, lo, hi, mark, remove);
        });
    }

    function blocksOverlapping(from, to) {
        const ix = index(state);
        const out = [];
        for (const b of ix) {
            if (to < b.from || from > b.to) continue;
            if (from === to && from === b.from && b.i > 0 && from === ix[b.i - 1].to + 1) continue;
            out.push(b);
        }
        if (!out.length && ix.length) out.push(ix[locAt(state, from).block] || ix[0]);
        return out;
    }

    function convertBlockToPIn(blocks, i) {
        const block = blocks[i];
        if (!block || block.type === "p") return;
        if (block.type === "quote" && block.blocks && block.blocks.length) {
            blocks.splice(i, 1, ...block.blocks);
            return;
        }
        if (block.items) {
            const paras = (block.items.length ? block.items : [[]]).map(it => ({
                type: "p", inlines: mergeInlines(it)
            }));
            blocks.splice(i, 1, ...paras);
            return;
        }
        if (block.type === "pre") {
            const lines = String(block.text || "").split("\n");
            const paras = lines.map(l => ({ type: "p", inlines: l ? [{ text: l, marks: [] }] : [] }));
            blocks.splice(i, 1, ...(paras.length ? paras : [{ type: "p", inlines: [] }]));
            return;
        }
        if (block.inlines) {
            block.type = "p";
            return;
        }
        blocks[i] = { type: "p", inlines: [] };
    }
    function convertBlockToP(i) {
        convertBlockToPIn(state.blocks, i);
    }

    function insertHr() {
        const { from } = sel;
        let c = containerAt(from);
        if (c.block && c.block.type === "hr") {
            c.blocks.splice(c.i, 1);
            ensureTrail();
            return;
        }
        if (c.offset === 0 && c.i > 0 && c.blocks[c.i - 1] && c.blocks[c.i - 1].type === "hr") {
            c.blocks.splice(c.i - 1, 1);
            ensureTrail();
            return;
        }
        const hit = blocksOverlapping(from, sel.to);
        const hrHit = hit.find(b => state.blocks[b.i] && state.blocks[b.i].type === "hr");
        if (hrHit) {
            state.blocks.splice(hrHit.i, 1);
            ensureTrail();
            return;
        }
        if (c.block && c.block.inlines) {
            const n = inlinesText(c.block.inlines).length;
            if (n && c.offset > 0 && c.offset < n) splitBlock();
        }
        c = containerAt(sel.from);
        const hr = { type: "hr" };
        if (!c.block) {
            state.blocks = [hr];
        } else if (c.block.inlines && !inlinesText(c.block.inlines)) {
            c.blocks[c.i] = hr;
        } else if (c.offset === 0) {
            c.blocks.splice(c.i, 0, hr);
        } else {
            c.blocks.splice(c.i + 1, 0, hr);
        }
        ensureTrail();
    }

    function insertEmptyPre() {
        const { from } = sel;
        let c = containerAt(from);
        if (c.block && c.block.type === "pre") {
            convertBlockToPIn(c.blocks, c.i);
            ensureTrail();
            return;
        }
        if (c.block && c.block.inlines) {
            const n = inlinesText(c.block.inlines).length;
            if (n && c.offset > 0 && c.offset < n) splitBlock();
        }
        c = containerAt(sel.from);
        const pre = { type: "pre", lang: "", text: "" };
        if (!c.block) {
            state.blocks = [pre];
        } else if (c.block.inlines && !inlinesText(c.block.inlines)) {
            c.blocks[c.i] = pre;
        } else if (c.offset === 0) {
            c.blocks.splice(c.i, 0, pre);
        } else {
            c.blocks.splice(c.i + 1, 0, pre);
        }
        ensureTrail();
        const at = blockStart(pre);
        setSelection(at < 0 ? 0 : at);
    }

    function insertRow(where) {
        const t = tableContext();
        if (!t) return;
        const cols = (t.block.rows[0] || []).length;
        const empty = [];
        for (let i = 0; i < cols; i++) empty.push("");
        const at = where === "above" ? t.row : t.row + 1;
        t.block.rows.splice(at, 0, empty);
    }
    function deleteRow() {
        const t = tableContext();
        if (!t || t.block.rows.length <= 1) return;
        t.block.rows.splice(t.row, 1);
    }
    function insertCol(where) {
        const t = tableContext();
        if (!t) return;
        const at = where === "left" ? t.col : t.col + 1;
        t.block.rows.forEach(row => row.splice(at, 0, ""));
    }
    function deleteCol() {
        const t = tableContext();
        if (!t || !(t.block.rows[0] || []).length || t.block.rows[0].length <= 1) return;
        t.block.rows.forEach(row => { if (row.length > t.col) row.splice(t.col, 1); });
    }

    function itemsFromBlock(block) {
        if (!block) return [[]];
        if (block.items) return block.items.slice();
        if (block.inlines) return [block.inlines];
        if (block.blocks && block.blocks.length) {
            const items = [];
            block.blocks.forEach(inner => items.push(...itemsFromBlock(inner)));
            return items.length ? items : [[]];
        }
        const t = blockText(block);
        return t ? [[{ text: t, marks: [] }]] : [[]];
    }

    function toggleBlock(type) {
        const { from, to } = sel;
        const hit = blocksOverlapping(from, to);
        if (!hit.length) return;
        const indices = hit.map(b => b.i).sort((a, b) => a - b);

        if (type === "quote") {
            indentQuote();
            return;
        }

        if (type === "ul" || type === "ol") {
            const t = quoteTarget();
            if (!t.indices.length) return;
            const idx = t.indices.slice().sort((a, b) => a - b);
            if (idx.every(i => t.blocks[i].type === type)) {
                for (let k = idx.length - 1; k >= 0; k--) convertBlockToPIn(t.blocks, idx[k]);
                ensureTrail();
                return;
            }
            const items = [];
            for (const i of idx) items.push(...itemsFromBlock(t.blocks[i]));
            if (!items.length) items.push([]);
            const first = idx[0], last = idx[idx.length - 1];
            t.blocks.splice(first, last - first + 1, { type, items });
            ensureTrail();
            return;
        }

        if (type === "pre") {
            if (from === to) {
                insertEmptyPre();
                return;
            }
            const t = quoteTarget();
            if (!t.indices.length) {
                insertEmptyPre();
                return;
            }
            const idx = t.indices.slice().sort((a, b) => a - b);
            if (idx.every(i => t.blocks[i].type === "pre")) {
                for (let k = idx.length - 1; k >= 0; k--) convertBlockToPIn(t.blocks, idx[k]);
                ensureTrail();
                return;
            }
            const text = idx.map(i => blockText(t.blocks[i])).join("\n");
            t.blocks.splice(idx[0], idx[idx.length - 1] - idx[0] + 1, { type: "pre", lang: "", text });
            ensureTrail();
            return;
        }

        if (type === "p" || indices.every(i => state.blocks[i].type === type)) {
            for (let k = indices.length - 1; k >= 0; k--) convertBlockToP(indices[k]);
            return;
        }
        indices.forEach(i => {
            const block = state.blocks[i];
            if (block.inlines) {
                block.type = type;
            } else {
                state.blocks[i] = { type, inlines: parseInlines(blockText(block)) };
            }
        });
    }

    function indexOf(blocks, startPos) {
        let pos = startPos || 0;
        return (blocks || []).map((b, i) => {
            const text = b.type === "hr" ? "\n" : blockText(b);
            const from = pos;
            const to = pos + text.length;
            pos = to + (i < blocks.length - 1 ? 1 : 0);
            return { from, to, text, i, type: b.type };
        });
    }

    function overlappingIn(blocks, from, to, startPos) {
        const ix = indexOf(blocks, startPos);
        const out = [];
        for (const b of ix) {
            if (to < b.from || from > b.to) continue;
            if (from === to && from === b.from && b.i > 0 && from === ix[b.i - 1].to + 1) continue;
            out.push(b);
        }
        if (!out.length && ix.length) {
            let pick = ix[0];
            for (const b of ix) {
                if (from >= b.from) pick = b;
            }
            out.push(pick);
        }
        return out;
    }

    /* Descend into quotes so >+ / >- apply to the selected inner lines,
       not always the whole outer blockquote. */
    function quoteTarget() {
        let blocks = state.blocks;
        let parentBlocks = null;
        let parentIndex = -1;
        let base = 0;
        const { from, to } = sel;
        for (;;) {
            const hit = overlappingIn(blocks, from, to, base)
                .filter(b => !(blocks[b.i] && blocks[b.i].type === "p" && isEmptyBlock(blocks[b.i])));
            if (hit.length === 1 && blocks[hit[0].i] && blocks[hit[0].i].type === "quote"
                && (blocks[hit[0].i].blocks || []).length) {
                parentBlocks = blocks;
                parentIndex = hit[0].i;
                base = hit[0].from;
                blocks = blocks[hit[0].i].blocks;
                continue;
            }
            return { blocks, indices: hit.map(b => b.i), parentBlocks, parentIndex };
        }
    }

    function indentQuote() {
        const t = quoteTarget();
        if (!t.indices.length) return;
        const indices = t.indices.slice().sort((a, b) => a - b);
        let first = indices[0], last = indices[indices.length - 1];
        while (last > first && isEmptyBlock(t.blocks[last])) last--;
        const inner = dropTrailingEmpty(t.blocks.slice(first, last + 1));
        t.blocks.splice(first, last - first + 1, { type: "quote", blocks: inner });
        ensureTrail();
    }

    function outdentQuote() {
        const t = quoteTarget();
        if (!t.indices.length) return;
        const sorted = t.indices.slice().sort((a, b) => a - b);
        if (sorted.every(i => t.blocks[i] && t.blocks[i].type === "quote")) {
            for (let k = sorted.length - 1; k >= 0; k--) {
                const i = sorted[k];
                const inner = t.blocks[i].blocks && t.blocks[i].blocks.length
                    ? t.blocks[i].blocks
                    : [{ type: "p", inlines: [] }];
                t.blocks.splice(i, 1, ...inner);
            }
            return;
        }
        if (!t.parentBlocks || t.parentIndex < 0) return;
        const first = sorted[0], last = sorted[sorted.length - 1];
        const before = t.blocks.slice(0, first);
        const lifted = t.blocks.slice(first, last + 1);
        const after = t.blocks.slice(last + 1);
        /* A callout keeps its title on the part that stays above the lifted lines. */
        const alert = t.parentBlocks[t.parentIndex].alert;
        const quoteOf = (blocks, keep) => keep && alert ? { type: "quote", alert, blocks } : { type: "quote", blocks };
        const replacement = [];
        if (before.length) replacement.push(quoteOf(before, true));
        replacement.push(...lifted);
        if (after.length) replacement.push(quoteOf(after, !before.length));
        t.parentBlocks.splice(t.parentIndex, 1, ...replacement);
        ensureTrail();
    }

    function runAt(pos) {
        const loc = locAt(state, pos);
        const block = state.blocks[loc.block];
        if (!block || !block.inlines) return null;
        let o = 0;
        for (const r of block.inlines) {
            const n = (r.text || "").length;
            if (pos - index(state)[loc.block].from < o + n || o + n === blockText(block).length) {
                if (index(state)[loc.block].from + o + n >= pos) return r;
            }
            o += n;
        }
        return block.inlines[block.inlines.length - 1] || null;
    }

    function marksAt(from, to) {
        from = from === undefined ? sel.from : from;
        to = to === undefined ? sel.to : to;
        if (from !== to) {
            const t = trimRange(from, to);
            from = t.from;
            to = t.to;
        }
        if (from === to) {
            const p = from > 0 ? from - 1 : from;
            const r = runContaining(p);
            return new Set(r ? r.marks || [] : []);
        }
        const counts = { bold: 0, italic: 0, underline: 0, strike: 0, code: 0 };
        let chars = 0;
        walkCharRuns(state, from, to, (block, lo, hi, kind, item) => {
            const ins = kind === "item" ? block.items[item] : block.inlines;
            let o = 0;
            for (const r of ins || []) {
                const n = (r.text || "").length;
                const a = o, b = o + n;
                o = b;
                const s = Math.max(a, lo), e = Math.min(b, hi);
                if (e > s) {
                    chars += e - s;
                    (r.marks || []).forEach(m => { if (counts[m] !== undefined) counts[m] += e - s; });
                }
            }
        });
        const set = new Set();
        Object.keys(counts).forEach(m => { if (chars && counts[m] === chars) set.add(m); });
        return set;
    }
    function runContaining(pos) {
        const c = containerAt(pos);
        const block = c.block;
        if (!block) return null;
        let ins = block.inlines;
        let offset = c.offset;
        if (block.items) {
            const it = itemAt(block, c.offset);
            ins = block.items[it.item];
            offset = it.offset;
        }
        if (!ins) return null;
        let o = 0;
        for (const r of ins) {
            const n = (r.text || "").length;
            if (offset >= o && offset < o + n) return r;
            if (offset === o + n && o + n === inlinesText(ins).length) return r;
            o += n;
        }
        return null;
    }
    function blockTypeAt(pos) {
        const loc = locAt(state, pos === undefined ? sel.from : pos);
        return (state.blocks[loc.block] || {}).type || "p";
    }

    function deleteRange(from, to) {
        if (from === to) return from;
        if (from > to) { const t = from; from = to; to = t; }
        /* character-wise across blocks: rebuild blocks */
        const text = docText(state);
        const next = text.slice(0, from) + text.slice(to);
        /* keep block structure by deleting inside blocks then dropping empties */
        const ix = index(state).slice();
        for (let k = ix.length - 1; k >= 0; k--) {
            const b = ix[k];
            if (to <= b.from || from >= b.to) continue;
            const lo = Math.max(0, from - b.from);
            const hi = Math.min(b.text.length, to - b.from);
            const block = state.blocks[b.i];
            if (block.type === "hr") { state.blocks.splice(b.i, 1); continue; }
            if (block.type === "table") {
                const cell = cellInTable(block, lo);
                const cur = String(block.rows[cell.r][cell.c] || "");
                const localHi = Math.min(cur.length, cell.offset + Math.max(0, hi - lo));
                block.rows[cell.r][cell.c] = cur.slice(0, cell.offset) + cur.slice(localHi);
                continue;
            }
            if (block.inlines) block.inlines = spliceInlines(block.inlines, lo, hi, "");
            else if (block.items) block.items = deleteInItems(block.items, lo, hi);
            else if (block.blocks) deleteInQuoted(block, lo, hi);
            else if (block.text != null) block.text = (block.text || "").slice(0, lo) + (block.text || "").slice(hi);
        }
        mergeEmpty();
        return from;
    }
    function spliceInlines(ins, lo, hi, insert, marks) {
        ins = splitInlines(ins, lo);
        ins = splitInlines(ins, hi);
        let o = 0;
        const out = [];
        let placed = false;
        for (const r of ins) {
            const n = (r.text || "").length;
            const a = o, b = o + n;
            o = b;
            if (b <= lo || a >= hi) {
                if (!placed && a >= hi && insert) {
                    out.push({ text: insert, marks: marksOf({ marks: marks || r.marks }) });
                    placed = true;
                }
                out.push(r);
            }
        }
        if (!placed && insert) out.push({ text: insert, marks: marksOf({ marks: marks || [] }) });
        return mergeInlines(out);
    }
    function docText(doc) {
        return index(doc).map(b => b.text).join("\n");
    }
    function mergeEmpty() {
        state.blocks = state.blocks.filter((b, i) => {
            if (state.blocks.length === 1) return true;
            if (b.type === "hr" || b.type === "pre" || b.type === "table") return true;
            return blockText(b).length > 0 || i === 0;
        });
        if (!state.blocks.length) state = empty();
    }

    function deleteInQuoted(block, lo, hi) {
        const blocks = block.blocks || [];
        let pos = 0;
        const ix = blocks.map((b, i) => {
            const n = blockText(b).length;
            const rec = { from: pos, to: pos + n, i };
            pos += n + (i < blocks.length - 1 ? 1 : 0);
            return rec;
        });
        for (let k = ix.length - 1; k >= 0; k--) {
            const b = ix[k];
            if (hi <= b.from || lo >= b.to) continue;
            const rlo = Math.max(0, lo - b.from);
            const rhi = Math.min(b.to - b.from, hi - b.from);
            const inner = blocks[b.i];
            if (inner.inlines) inner.inlines = spliceInlines(inner.inlines, rlo, rhi, "");
            else if (inner.items) inner.items = deleteInItems(inner.items, rlo, rhi);
            else if (inner.blocks) deleteInQuoted(inner, rlo, rhi);
            else if (inner.text != null) inner.text = (inner.text || "").slice(0, rlo) + (inner.text || "").slice(rhi);
        }
    }

    function insertAt(block, offset, text, marks) {
        if (!block) return;
        if (block.type === "table") {
            const cell = cellInTable(block, offset);
            const cur = String(block.rows[cell.r][cell.c] || "");
            const t = String(text || "").replace(/\n/g, " ");
            block.rows[cell.r][cell.c] = cur.slice(0, cell.offset) + t + cur.slice(cell.offset);
            return;
        }
        if (block.type === "quote" && block.blocks) {
            const inner = innerAt(block.blocks, offset);
            insertAt(inner.block, inner.offset, text, marks);
            return;
        }
        if (block.items) {
            const it = itemAt(block, offset);
            block.items[it.item] = spliceInlines(block.items[it.item], it.offset, it.offset, text, marks);
            return;
        }
        if (block.inlines) {
            block.inlines = spliceInlines(block.inlines, offset, offset, text, marks);
            return;
        }
        if (block.text != null) {
            block.text = (block.text || "").slice(0, offset) + text + (block.text || "").slice(offset);
        }
    }

    function insertText(text) {
        let { from, to } = sel;
        if (from !== to) from = deleteRange(from, to);
        const c0 = containerAt(from);
        if (c0.block && c0.block.type === "pre") {
            const t = String(text || "");
            insertAt(c0.block, c0.offset, t, []);
            setSelection(from + t.length, from + t.length);
            return;
        }
        if (c0.block && c0.block.type === "table") {
            const t = String(text || "").replace(/\n/g, " ");
            insertAt(c0.block, c0.offset, t, []);
            setSelection(from + t.length, from + t.length);
            return;
        }
        const parts = String(text || "").split("\n");
        const leftMarks = (runContaining(from > 0 ? from - 1 : from) || {}).marks || [];
        const loc = locAt(state, from);
        insertAt(state.blocks[loc.block], loc.offset, parts[0], leftMarks);
        let pos = from + parts[0].length;
        for (let p = 1; p < parts.length; p++) {
            setSelection(pos, pos);
            splitBlock();
            pos = sel.from;
            const loc2 = locAt(state, pos);
            insertAt(state.blocks[loc2.block], loc2.offset, parts[p], leftMarks);
            pos += parts[p].length;
        }
        setSelection(pos, pos);
    }

    function insertInlineMarkdown(md) {
        let { from, to } = sel;
        if (from !== to) from = deleteRange(from, to);
        const c = containerAt(from);
        if (c.block && c.block.type === "pre") {
            insertAt(c.block, c.offset, md, []);
            setSelection(from + String(md).length);
            return;
        }
        const runs = parseInlines(md);
        const n = runs.reduce((s, r) => s + (r.text || "").length, 0);
        let ins = null, off = c.offset;
        if (c.block && c.block.items) {
            const it = itemAt(c.block, c.offset);
            ins = c.block.items[it.item];
            off = it.offset;
        } else if (c.block && c.block.inlines) {
            ins = c.block.inlines;
        }
        if (!ins) {
            insertText(md);
            return;
        }
        const { left, right } = splitInlinesAt(ins, off);
        const next = mergeInlines(left.concat(runs).concat(right));
        if (c.block.items) {
            const it = itemAt(c.block, c.offset);
            c.block.items[it.item] = next;
        } else c.block.inlines = next;
        setSelection(from + n);
    }

    function paste(text) {
        text = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        if (!text) return;
        const parsed = parse(text);
        const structured = parsed.blocks.some(b => b.type !== "p") || parsed.blocks.length > 1;
        if (!structured) {
            insertText(text.replace(/\n+$/, ""));
            return;
        }
        let { from, to } = sel;
        if (from !== to) from = deleteRange(from, to);
        setSelection(from, from);
        const loc = locAt(state, from);
        const cur = state.blocks[loc.block];
        const empty = !blockText(cur);
        let at = loc.block;
        if (!empty && loc.offset > 0) {
            if (loc.offset < blockText(cur).length) splitBlock();
            else {
                state.blocks.splice(loc.block + 1, 0, { type: "p", inlines: [] });
                at = loc.block + 1;
                setSelection(index(state)[at].from);
            }
            at = locAt(state, sel.from).block;
        }
        if (!blockText(state.blocks[at] || {})) {
            state.blocks.splice(at, 1, ...parsed.blocks);
        } else {
            state.blocks.splice(at, 0, ...parsed.blocks);
        }
        const ix = index(state);
        const last = ix[Math.min(at + parsed.blocks.length - 1, ix.length - 1)];
        setSelection(last ? last.to : totalLen(state));
    }

    function exitListAt(blockIndex, itemIndex) {
        const block = state.blocks[blockIndex];
        const before = block.items.slice(0, itemIndex);
        const after = block.items.slice(itemIndex + 1);
        const replacement = [];
        if (before.length) replacement.push({ type: block.type, items: before });
        replacement.push({ type: "p", inlines: [] });
        if (after.length) replacement.push({ type: block.type, items: after });
        state.blocks.splice(blockIndex, 1, ...replacement);
        const paraI = blockIndex + (before.length ? 1 : 0);
        const at = index(state)[paraI].from;
        setSelection(at, at);
    }

    function splitBlock() {
        const { from } = sel;
        const c = containerAt(from);
        const block = c.block;
        if (!block) return;
        if (block.type === "pre") {
            const t = block.text || "";
            const o = clamp(c.offset, 0, t.length);
            block.text = t.slice(0, o) + "\n" + t.slice(o);
            setSelection(from + 1, from + 1);
            return;
        }
        if (block.type === "table") {
            insertRow("below");
            return;
        }
        if (block.items) {
            const it = itemAt(block, c.offset);
            if (!inlinesText(block.items[it.item])) {
                if (c.blocks === state.blocks) {
                    exitListAt(c.i, it.item);
                } else {
                    const before = block.items.slice(0, it.item);
                    const after = block.items.slice(it.item + 1);
                    const replacement = [];
                    if (before.length) replacement.push({ type: block.type, items: before });
                    replacement.push({ type: "p", inlines: [] });
                    if (after.length) replacement.push({ type: block.type, items: after });
                    c.blocks.splice(c.i, 1, ...replacement);
                    setSelection(from, from);
                }
                return;
            }
            const { left, right } = splitInlinesAt(block.items[it.item], it.offset);
            block.items[it.item] = left;
            block.items.splice(it.item + 1, 0, right);
            setSelection(from + 1, from + 1);
            return;
        }
        if (!block.inlines) {
            c.blocks.splice(c.i + 1, 0, { type: "p", inlines: [] });
            setSelection(from + 1, from + 1);
            return;
        }
        const empty = !inlinesText(block.inlines);
        const atEnd = c.offset >= inlinesText(block.inlines).length;
        const last = c.i === c.blocks.length - 1;
        if (c.parentBlocks && (empty || (last && atEnd))) {
            exitQuoteAt(c);
            return;
        }
        const { left, right } = splitInlinesAt(block.inlines, c.offset);
        block.inlines = left;
        c.blocks.splice(c.i + 1, 0, { type: "p", inlines: right });
        setSelection(from + 1, from + 1);
    }

    function blockStart(target) {
        const walk = (blocks, pos) => {
            for (let i = 0; i < blocks.length; i++) {
                if (blocks[i] === target) return pos;
                if (blocks[i].blocks) {
                    const hit = walk(blocks[i].blocks, pos);
                    if (hit >= 0) return hit;
                }
                pos += blockText(blocks[i]).length + (i < blocks.length - 1 ? 1 : 0);
            }
            return -1;
        };
        return walk(state.blocks, 0);
    }

    function exitQuoteAt(c) {
        const parent = c.parentBlocks;
        const qi = c.parentIndex;
        const quote = parent[qi];
        const empty = c.block && c.block.inlines && !inlinesText(c.block.inlines);
        if (empty) quote.blocks.splice(c.i, 1);
        const para = { type: "p", inlines: [] };
        let target;
        if (!(quote.blocks && quote.blocks.length)) {
            parent.splice(qi, 1, para);
            target = para;
        } else if (parent[qi + 1] && parent[qi + 1].type === "p" && isEmptyBlock(parent[qi + 1])) {
            target = parent[qi + 1];
        } else {
            parent.splice(qi + 1, 0, para);
            target = para;
        }
        const at = blockStart(target);
        setSelection(at < 0 ? totalLen(state) : at);
    }

    function deleteBackward() {
        let { from, to } = sel;
        if (from !== to) { setSelection(deleteRange(from, to)); return; }
        if (from <= 0) return;
        const c = containerAt(from);
        const block = c.block;
        if (block && block.type === "hr") {
            c.blocks.splice(c.i, 1);
            ensureTrail();
            setSelection(from > 0 ? from - 1 : 0);
            return;
        }
        if (c.offset === 0 && c.i > 0 && c.blocks[c.i - 1] && c.blocks[c.i - 1].type === "hr") {
            c.blocks.splice(c.i - 1, 1);
            ensureTrail();
            setSelection(from > 0 ? from - 1 : 0);
            return;
        }
        if (block && block.items) {
            const it = itemAt(block, c.offset);
            if (it.offset === 0 && it.item > 0) {
                block.items[it.item - 1] = mergeInlines(block.items[it.item - 1].concat(block.items[it.item]));
                block.items.splice(it.item, 1);
                setSelection(from - 1);
                return;
            }
            if (it.offset === 0 && it.item === 0) {
                const first = block.items[0];
                const rest = block.items.slice(1);
                const para = { type: "p", inlines: first };
                if (rest.length) c.blocks.splice(c.i, 1, para, { type: block.type, items: rest });
                else c.blocks[c.i] = para;
                setSelection(from);
                return;
            }
        }
        if (c.offset === 0 && c.i > 0) {
            const prev = c.blocks[c.i - 1];
            const cur = block;
            if (prev && prev.inlines && cur && cur.inlines) {
                prev.inlines = mergeInlines(prev.inlines.concat(cur.inlines));
                c.blocks.splice(c.i, 1);
                setSelection(from - 1);
                return;
            }
            if (prev && prev.items && cur && cur.inlines) {
                prev.items.push(cur.inlines);
                c.blocks.splice(c.i, 1);
                setSelection(from - 1);
                return;
            }
        }
        deleteRange(from - 1, from);
        setSelection(from - 1);
    }
    function deleteForward() {
        let { from, to } = sel;
        if (from !== to) { setSelection(deleteRange(from, to)); return; }
        const n = totalLen(state);
        if (from >= n) return;
        deleteRange(from, from + 1);
        setSelection(from);
    }

    /* ---- code language and callouts --------------------------------------- */
    function codeLangAt(pos) {
        const c = containerAt(pos === undefined ? sel.from : pos);
        return c.block && c.block.type === "pre" ? String(c.block.lang || "") : null;
    }
    function setCodeLang(lang) {
        const c = containerAt(sel.from);
        if (!c.block || c.block.type !== "pre") return false;
        c.block.lang = String(lang || "").replace(/[^\w+#-]/g, "");
        return true;
    }
    function quoteAround(pos) {
        const c = containerAt(pos);
        if (c.block && c.block.type === "quote") return c.block;
        return c.parentBlocks ? c.parentBlocks[c.parentIndex] : null;
    }
    /* The innermost quote at pos: its alert, "" for a plain quote, null outside. */
    function alertAt(pos) {
        const q = quoteAround(pos === undefined ? sel.from : pos);
        return q ? (ALERTS.includes(q.alert) ? q.alert : "") : null;
    }
    /* "" leaves a plain quote. Outside a quote the selected blocks are quoted
       first; an empty line becomes an empty callout to type into. */
    function setAlert(kind) {
        kind = String(kind || "").toLowerCase();
        if (kind && !ALERTS.includes(kind)) return false;
        let q = quoteAround(sel.from);
        if (!q) {
            indentQuote();
            q = quoteAround(sel.from);
        }
        if (!q) {
            const c = containerAt(sel.from);
            if (!c.block || !isEmptyBlock(c.block)) return false;
            q = { type: "quote", blocks: [{ type: "p", inlines: [] }] };
            c.blocks[c.i] = q;
            ensureTrail();
        }
        if (kind) q.alert = kind; else delete q.alert;
        return true;
    }

    function load(md) {
        state = parse(md);
        ensureTrail();
        const n = totalLen(state);
        sel = { from: clamp(sel.from, 0, n), to: clamp(sel.to, 0, n) };
        return state;
    }

    /* ---- caret map ------------------------------------------------------- */
    function domPointToDoc(root, node, offset) {
        if (!root || !node) return 0;
        const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        const holder = el && el.closest ? el.closest("[data-from]") : null;
        if (holder && root.contains(holder)) {
            const base = +holder.getAttribute("data-from");
            try {
                const prefix = document.createRange();
                prefix.selectNodeContents(holder);
                prefix.setEnd(node, offset);
                return base + prefix.toString().length;
            } catch (e) { return base; }
        }
        const spans = root.querySelectorAll("[data-from]");
        if (!spans.length) return 0;
        return +spans[spans.length - 1].getAttribute("data-to") || 0;
    }
    function readPreviewSelection(root) {
        if (typeof window === "undefined") return sel;
        const s = window.getSelection();
        if (!s.rangeCount) return sel;
        const r = s.getRangeAt(0);
        const hrFromRange = () => {
            const nodes = [r.startContainer, r.endContainer];
            if (r.startContainer.nodeType === 1) {
                const c = r.startContainer.childNodes[r.startOffset];
                if (c) nodes.push(c);
            }
            for (const n of nodes) {
                if (!n) continue;
                if (n.nodeType === 1 && n.tagName === "HR" && root.contains(n)) return n;
                const el = n.nodeType === 1 ? n : n.parentElement;
                const hr = el && el.closest && el.closest("hr[data-from]");
                if (hr && root.contains(hr)) return hr;
            }
            return null;
        };
        const hr = hrFromRange();
        if (hr) {
            setSelection(+hr.getAttribute("data-from"), +hr.getAttribute("data-to") || +hr.getAttribute("data-from") + 1);
            return sel;
        }
        if (!root.contains(s.anchorNode)) return sel;
        let a = domPointToDoc(root, r.startContainer, r.startOffset);
        let b = domPointToDoc(root, r.endContainer, r.endOffset);
        setSelection(a, b);
        return sel;
    }
    function docPointToDom(root, pos) {
        const spans = [...root.querySelectorAll("[data-from]")];
        if (!spans.length) return null;
        for (let i = 0; i < spans.length; i++) {
            const a = +spans[i].getAttribute("data-from");
            const b = +spans[i].getAttribute("data-to");
            if (pos < a || pos > b) continue;
            if (pos === b && i < spans.length - 1 && +spans[i + 1].getAttribute("data-from") === pos) continue;
            let remain = pos - a;
            const walker = document.createTreeWalker(spans[i], NodeFilter.SHOW_TEXT);
            let n;
            while ((n = walker.nextNode())) {
                if (remain <= n.length) return { node: n, offset: remain };
                remain -= n.length;
            }
            const texts = spans[i].querySelectorAll ? null : null;
            return { node: spans[i], offset: 0 };
        }
        const last = spans[spans.length - 1];
        const walker = document.createTreeWalker(last, NodeFilter.SHOW_TEXT);
        let n, lastText = null;
        while ((n = walker.nextNode())) lastText = n;
        if (lastText) return { node: lastText, offset: lastText.length };
        return null;
    }
    function restorePreviewSelection(root) {
        if (typeof window === "undefined") return;
        const a = docPointToDom(root, sel.from);
        const b = docPointToDom(root, sel.to);
        if (!a || !b) return;
        try {
            const r = document.createRange();
            r.setStart(a.node, a.offset);
            r.setEnd(b.node, b.offset);
            const s = window.getSelection();
            s.removeAllRanges();
            s.addRange(r);
        } catch (e) { /* layout not ready */ }
    }

    return {
        empty, parse, load, get,
        toMarkdown, html, previewHTML,
        selection, setSelection,
        toggleMark, toggleBlock, indentQuote, outdentQuote, insertHr,
        insertRow, deleteRow, insertCol, deleteCol, tableContext,
        insertText, insertInlineMarkdown, paste, splitBlock, deleteBackward, deleteForward, deleteRange,
        marksAt, blockTypeAt, totalLen: () => totalLen(state),
        codeLangAt, setCodeLang, alertAt, setAlert, ALERTS,
        text: doc => docText(doc || state),
        ensureTrail, landAtEnd,
        readPreviewSelection, restorePreviewSelection,
        MARK_TAG, TAG_MARK
    };
})();

/* ==== module 18-locate.js ==== */
// ============================================================================
// LOCATE — map a selection between the raw markdown and Doc's visible text
// (the offsets the preview uses). No DOM: tested from dist/editor.cjs.
//
// Raw → Doc: wrap the span in two private-use sentinels, parse, read where
// they land. Exact, unless the sentinels vanish (a word inside a URL) or
// change the parse; then the same-ordinal occurrence is used.
// Doc → raw: try raw occurrences of the same text, nearest the same ordinal
// first, and keep the one that maps back to exactly this Doc range.
// ============================================================================
const Locate = (() => {
    const OPEN = "\uE000", CLOSE = "\uE001";
    const WORD_CHAR = /[\p{L}\p{N}_'\u2019-]/u;
    const MAX_TRIES = 60;

    function visible(md) {
        return Doc.text(Doc.parse(md));
    }

    /* Trim a range to non-space; a collapsed caret grows to the word around it. */
    function span(text, from, to) {
        from = Math.max(0, Math.min(text.length, from | 0));
        to = Math.max(from, Math.min(text.length, to | 0));
        if (from === to) {
            while (from > 0 && WORD_CHAR.test(text[from - 1])) from--;
            while (to < text.length && WORD_CHAR.test(text[to])) to++;
        } else {
            while (from < to && /\s/.test(text[from])) from++;
            while (to > from && /\s/.test(text[to - 1])) to--;
        }
        return { from, to };
    }

    function hits(hay, needle) {
        const out = [];
        if (!needle) return out;
        for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, i + 1)) out.push(i);
        return out;
    }

    function ordinal(text, needle, at) {
        return hits(text, needle).filter(i => i < at).length;
    }

    function sameOrdinal(srcText, s, dstText) {
        const needle = srcText.slice(s.from, s.to);
        const list = hits(dstText, needle);
        if (!list.length) return null;
        const pos = list[Math.min(ordinal(srcText, needle, s.from), list.length - 1)];
        return { from: pos, to: pos + needle.length };
    }

    function exactRawToDoc(md, from, to, plain) {
        const marked = md.slice(0, from) + OPEN + md.slice(from, to) + CLOSE + md.slice(to);
        const t = visible(marked);
        const a = t.indexOf(OPEN), b = t.indexOf(CLOSE);
        if (a < 0 || b < a) return null;
        if (t.slice(0, a) + t.slice(a + 1, b) + t.slice(b + 1) !== plain) return null;
        return { from: a, to: b - 1 };
    }

    /* Raw selection → Doc range, or null when there is nothing to find. */
    function rawToDoc(md, from, to) {
        const s = span(md, from, to);
        if (s.from === s.to) return null;
        const plain = visible(md);
        const exact = exactRawToDoc(md, s.from, s.to, plain);
        if (exact && exact.from < exact.to) return exact;
        return sameOrdinal(md, s, plain);
    }

    /* Doc range → raw selection, or null when there is nothing to find. */
    function docToRaw(md, from, to) {
        const plain = visible(md);
        const s = span(plain, from, to);
        if (s.from === s.to) return null;
        const needle = plain.slice(s.from, s.to);
        const raw = hits(md, needle);
        if (!raw.length) return null;
        const k = ordinal(plain, needle, s.from);
        const order = raw.map((pos, i) => ({ pos, d: Math.abs(i - k) }))
            .sort((x, y) => x.d - y.d)
            .slice(0, MAX_TRIES);
        for (const { pos } of order) {
            const m = exactRawToDoc(md, pos, pos + needle.length, plain);
            if (m && m.from === s.from && m.to === s.to) return { from: pos, to: pos + needle.length };
        }
        return sameOrdinal(plain, s, md);
    }

    return { rawToDoc, docToRaw, span };
})();

/* ==== module 19-rawblocks.js ==== */
// ============================================================================
// RAW BLOCKS — the code fence or quote around a caret in the raw markdown.
// The raw pane edits text, not Doc. Each setter returns a splice
// { from, to, insert, map(pos) } (or null when there is nothing to change);
// map moves an old caret offset to where it belongs after the splice.
// No DOM: tested from dist/editor.cjs.
// ============================================================================
const RawBlocks = (() => {
    const ALERTS = ["note", "tip", "important", "warning", "caution"];
    const OPEN_FENCE = /^```([\w+#-]*)[ \t]*$/;

    function lines(text) {
        const out = [];
        let from = 0;
        String(text).split("\n").forEach(line => {
            out.push({ text: line, from, to: from + line.length });
            from += line.length + 1;
        });
        return out;
    }
    function lineIndexAt(ls, pos) {
        for (let k = 0; k < ls.length; k++) if (pos <= ls[k].to) return k;
        return ls.length - 1;
    }

    /* The closed fence whose opening..closing lines contain pos. */
    function fenceAt(text, pos) {
        const ls = lines(text);
        let open = null;
        for (const l of ls) {
            if (!open) {
                const m = OPEN_FENCE.exec(l.text);
                if (m) open = { from: l.from, to: l.to, lang: m[1] };
            } else if (/^```/.test(l.text)) {
                if (pos >= open.from && pos <= l.to) return { lineFrom: open.from, lineTo: open.to, lang: open.lang };
                open = null;
            }
        }
        return null;
    }

    function shiftAfter(from, to, insert) {
        const delta = insert.length - (to - from);
        return pos => pos <= from ? pos : pos >= to ? pos + delta : from + insert.length;
    }

    function setFenceLang(text, pos, lang) {
        const f = fenceAt(text, pos);
        if (!f) return null;
        const insert = "```" + String(lang || "").replace(/[^\w+#-]/g, "");
        const { lineFrom: from, lineTo: to } = f;
        const delta = insert.length - (to - from);
        return { from, to, insert, map: p => p <= from ? p : p >= to ? p + delta : Math.min(p + delta, from + insert.length) };
    }

    const depthOf = line => ((/^(?:>[ \t]?)*/.exec(line)[0].match(/>/g)) || []).length;
    const stripDepth = (line, d) => line.replace(new RegExp("^(?:>[ \\t]?){" + d + "}"), "");
    const marker = (d, kind) => "> ".repeat(d) + "[!" + kind.toUpperCase() + "]";

    /* The innermost quote on the caret's line: { kind, depth, first, markerLine }.
       kind is "" for a plain quote. Null when the line is not quoted. */
    function alertAt(text, pos) {
        const ls = lines(text);
        let k = lineIndexAt(ls, pos);
        const d = depthOf(ls[k].text);
        if (!d) return null;
        while (k > 0 && depthOf(ls[k - 1].text) >= d) k--;
        const m = /^\s*\[!(\w+)\]\s*$/.exec(stripDepth(ls[k].text, d));
        const kind = m && ALERTS.includes(m[1].toLowerCase()) ? m[1].toLowerCase() : "";
        return { kind, depth: d, first: ls[k], markerLine: kind ? ls[k] : null, all: ls };
    }

    function setAlert(text, from, to, kind) {
        kind = String(kind || "").toLowerCase();
        if (kind && !ALERTS.includes(kind)) return null;
        text = String(text);
        const q = alertAt(text, from);
        if (q) {
            if (q.markerLine) {
                const l = q.markerLine;
                if (kind) {
                    const insert = marker(q.depth, kind);
                    if (insert === l.text) return null;
                    return { from: l.from, to: l.to, insert, map: shiftAfter(l.from, l.to, insert) };
                }
                const end = Math.min(text.length, l.to + 1);
                return { from: l.from, to: end, insert: "", map: shiftAfter(l.from, end, "") };
            }
            if (!kind) return null;
            const insert = marker(q.depth, kind) + "\n";
            const at = q.first.from;
            return { from: at, to: at, insert, map: p => p < at ? p : p + insert.length };
        }
        /* Not in a quote: quote the selected lines, with the marker on top. */
        const ls = lines(text);
        const a = lineIndexAt(ls, from), b = lineIndexAt(ls, Math.max(from, to));
        const head = kind ? marker(1, kind) + "\n" : "";
        const quoted = ls.slice(a, b + 1).map(l => l.text ? "> " + l.text : ">");
        const start = ls[a].from, end = ls[b].to;
        const insert = head + quoted.join("\n");
        const map = p => {
            if (p < start) return p;
            if (p > end) return p + insert.length - (end - start);
            const k = lineIndexAt(ls, p);
            const added = head.length + (k - a + 1) * 2 - ls.slice(a, k + 1).filter(l => !l.text).length;
            return p + added;
        };
        return { from: start, to: end, insert, map };
    }

    return { fenceAt, setFenceLang, alertAt: (text, pos) => {
        const q = alertAt(text, pos);
        return q ? { kind: q.kind, depth: q.depth } : null;
    }, setAlert, ALERTS };
})();

/* ==== module 25-htmlmd.js ==== */
/* @requires-dom — HtmlToMarkdown uses document.createElement. */
// ============================================================================
// HTML TO MARKDOWN CONVERTER
// ============================================================================
const HtmlToMarkdown = {
    convert(html) {
        if (!html) return '';
        
        // Create a temporary container
        const temp = document.createElement('div');
        temp.innerHTML = html;
        
        return this.processNode(temp).trim();
    },
    
    processNode(node) {
        let result = '';
        
        for (const child of node.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                result += child.textContent;
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                result += this.convertElement(child);
            }
        }
        
        return result;
    },
    
    convertElement(el) {
        const tag = el.tagName.toLowerCase();
        const content = this.processNode(el);
        
        switch (tag) {
            case 'strong':
            case 'b':
                return this.wrapInline('**', content);
            case 'em':
            case 'i':
                return this.wrapInline('*', content);
            case 'u':
                return this.wrapInline('++', content);
            case 'del':
            case 's':
                return this.wrapInline('~~', content);
            case 'h1':
                return `# ${content}\n\n`;
            case 'h2':
                return `## ${content}\n\n`;
            case 'h3':
                return `### ${content}\n\n`;
            case 'h4':
                return `#### ${content}\n\n`;
            case 'h5':
                return `##### ${content}\n\n`;
            case 'h6':
                return `###### ${content}\n\n`;
            case 'p':
                return `${content}\n\n`;
            case 'br':
                return '\n';
            case 'hr':
                return '---\n\n';
            case 'a':
                return `[${content}](${el.getAttribute('href') || ''})`;
            case 'img':
                return `![${el.getAttribute('alt') || ''}](${el.getAttribute('src') || ''})`;
            case 'code':
                if (el.parentElement && el.parentElement.tagName.toLowerCase() === 'pre') {
                    return content;
                }
                return `\`${content}\``;
            case 'pre':
                const codeEl = el.querySelector('code');
                const lang = codeEl ? (codeEl.className.replace('language-', '') || '') : '';
                return `\`\`\`${lang}\n${content}\n\`\`\`\n\n`;
            case 'blockquote':
                return this.convertBlockquote(el);
            case 'ul':
                return this.convertList(el, 'ul');
            case 'ol':
                return this.convertList(el, 'ol');
            case 'li':
                return content;
            case 'table':
                return this.convertTable(el);
            case 'thead':
            case 'tbody':
            case 'tr':
            case 'th':
            case 'td':
                return content;
            case 'div':
                if (this.alertKind(el)) return this.convertBlockquote(el);
                return content + (content.endsWith('\n') ? '' : '\n');
            default:
                return content;
        }
    },

    /* Keep leading/trailing spaces outside the markers so
       <strong>Widget </strong> becomes **Widget** not **Widget **. */
    wrapInline(marker, content) {
        const lead = content.match(/^\s*/)[0];
        const trail = content.match(/\s*$/)[0];
        const core = content.slice(lead.length, content.length - trail.length);
        if (!core) return content;
        return lead + marker + core + marker + trail;
    },
    
    /* Our export's <blockquote class="markdown-alert markdown-alert-note">, or
       GitHub's rendered <div> with the same classes. */
    alertKind(el) {
        const m = /(?:^|\s)markdown-alert-(note|tip|important|warning|caution)(?:\s|$)/.exec(el.className || '');
        return m ? m[1] : '';
    },

    convertBlockquote(el, depth = 1) {
        const prefix = '>'.repeat(depth) + ' ';
        const kind = this.alertKind(el);
        let result = kind ? prefix + '[!' + kind.toUpperCase() + ']\n' : '';
        
        for (const child of el.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                const text = child.textContent.trim();
                if (text) {
                    result += text.split('\n').map(line => prefix + line).join('\n') + '\n';
                }
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                const tag = child.tagName.toLowerCase();
                if (/(?:^|\s)markdown-alert-title(?:\s|$)/.test(child.className || '')) continue;
                if (tag === 'blockquote') {
                    result += this.convertBlockquote(child, depth + 1);
                } else if (tag === 'ul' || tag === 'ol') {
                    result += this.convertListInBlockquote(child, tag, depth);
                } else if (tag === 'p') {
                    const content = this.processNode(child);
                    result += content.split('\n').map(line => prefix + line).join('\n') + '\n';
                } else {
                    const content = this.convertElement(child);
                    result += content.split('\n').filter(l => l.trim()).map(line => prefix + line).join('\n') + '\n';
                }
            }
        }
        
        return result + '\n';
    },
    
    convertListInBlockquote(el, type, quoteDepth) {
        const prefix = '>'.repeat(quoteDepth) + ' ';
        let result = '';
        let index = 1;
        
        for (const li of el.querySelectorAll(':scope > li')) {
            const content = this.processNode(li);
            const marker = type === 'ol' ? `${index}. ` : '- ';
            result += prefix + marker + content + '\n';
            index++;
        }
        
        return result;
    },
    
    convertTable(el) {
        const rows = Array.from(el.querySelectorAll('tr'));
        if (!rows.length) return '';
        const cells = row => Array.from(row.querySelectorAll('th,td'))
            .map(c => this.processNode(c).replace(/\|/g, '\\|').trim());
        const header = cells(rows[0]);
        if (!header.length) return '';
        let md = '| ' + header.join(' | ') + ' |\n';
        md += '| ' + header.map(() => '---').join(' | ') + ' |\n';
        for (let i = 1; i < rows.length; i++) {
            md += '| ' + cells(rows[i]).join(' | ') + ' |\n';
        }
        return md + '\n';
    },

    convertList(el, type) {
        let result = '';
        let index = 1;
        
        for (const li of el.querySelectorAll(':scope > li')) {
            const content = this.processNode(li);
            const marker = type === 'ol' ? `${index}. ` : '- ';
            result += marker + content + '\n';
            index++;
        }
        
        return result + '\n';
    }
};

    currentFile: null,

    activePane: 'editor',
