        const IconHighlighter = {
            /**
             * Check format at cursor position in editor
             */
            checkEditorFormats() {
                const editor = DOM.editor;
                const pos = editor.selectionStart;
                const text = editor.value;
                
                // Find current line
                let lineStart = text.lastIndexOf('\n', pos - 1) + 1;
                let lineEnd = text.indexOf('\n', pos);
                if (lineEnd === -1) lineEnd = text.length;
                const line = text.substring(lineStart, lineEnd);
                
                // Get text around cursor for inline formats
                const before = text.substring(0, pos);
                const after = text.substring(pos);
                
                // Reset all buttons
                this.resetButtons();
                
                // Check inline formats
                if (this.isWrappedBy(before, after, '**') || this.isWrappedBy(before, after, '__')) {
                    DOM.boldBtn.classList.add('active');
                }
                if (this.isWrappedBy(before, after, '*') || this.isWrappedBy(before, after, '_')) {
                    if (!this.isWrappedBy(before, after, '**')) {
                        DOM.italicBtn.classList.add('active');
                    }
                }
                if (this.isWrappedBy(before, after, '++')) {
                    DOM.underlineBtn.classList.add('active');
                }
                if (this.isWrappedBy(before, after, '~~')) {
                    DOM.strikeBtn.classList.add('active');
                }
                if (this.isWrappedBy(before, after, '`')) {
                    DOM.codeBtn.classList.add('active');
                }
                
                // Check block formats
                if (/^# /.test(line)) DOM.h1Btn.classList.add('active');
                if (/^## /.test(line)) DOM.h2Btn.classList.add('active');
                if (/^### /.test(line)) DOM.h3Btn.classList.add('active');
                if (/^#### /.test(line)) DOM.h4Btn.classList.add('active');
                if (/^##### /.test(line)) DOM.h5Btn.classList.add('active');
                if (/^###### /.test(line)) DOM.h6Btn.classList.add('active');
                if (/^[-*+] /.test(line)) DOM.bulletBtn.classList.add('active');
                if (/^\d+\. /.test(line)) DOM.numberBtn.classList.add('active');
                if (/^>/.test(line)) DOM.quoteIncreaseBtn.classList.add('active');
                
                // Check for links and images
                if (/\[([^\]]+)\]\(([^)]+)\)/.test(line)) {
                    // Check if cursor is within a link
                    const linkMatch = line.match(/\[([^\]]+)\]\(([^)]+)\)/);
                    if (linkMatch) {
                        const linkStart = lineStart + line.indexOf(linkMatch[0]);
                        const linkEnd = linkStart + linkMatch[0].length;
                        if (pos >= linkStart && pos <= linkEnd) {
                            DOM.linkBtn.classList.add('active');
                        }
                    }
                }
                if (/!\[([^\]]*)\]\(([^)]+)\)/.test(line)) {
                    const imgMatch = line.match(/!\[([^\]]*)\]\(([^)]+)\)/);
                    if (imgMatch) {
                        const imgStart = lineStart + line.indexOf(imgMatch[0]);
                        const imgEnd = imgStart + imgMatch[0].length;
                        if (pos >= imgStart && pos <= imgEnd) {
                            DOM.imageBtn.classList.add('active');
                        }
                    }
                }
            },
            
            /**
             * Check format at cursor position in preview
             */
            checkPreviewFormats() {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                
                let node = selection.anchorNode;
                if (!node || !DOM.preview.contains(node)) return;
                
                // Reset all buttons
                this.resetButtons();
                
                // Walk up the tree and check for formatting elements
                while (node && node !== DOM.preview) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName.toLowerCase();
                        
                        switch (tag) {
                            case 'strong':
                            case 'b':
                                DOM.boldBtn.classList.add('active');
                                break;
                            case 'em':
                            case 'i':
                                DOM.italicBtn.classList.add('active');
                                break;
                            case 'u':
                                DOM.underlineBtn.classList.add('active');
                                break;
                            case 'del':
                            case 's':
                                DOM.strikeBtn.classList.add('active');
                                break;
                            case 'code':
                                DOM.codeBtn.classList.add('active');
                                break;
                            case 'h1':
                                DOM.h1Btn.classList.add('active');
                                break;
                            case 'h2':
                                DOM.h2Btn.classList.add('active');
                                break;
                            case 'h3':
                                DOM.h3Btn.classList.add('active');
                                break;
                            case 'h4':
                                DOM.h4Btn.classList.add('active');
                                break;
                            case 'h5':
                                DOM.h5Btn.classList.add('active');
                                break;
                            case 'h6':
                                DOM.h6Btn.classList.add('active');
                                break;
                            case 'li':
                                const parent = node.parentElement;
                                if (parent.tagName === 'UL') DOM.bulletBtn.classList.add('active');
                                if (parent.tagName === 'OL') DOM.numberBtn.classList.add('active');
                                break;
                            case 'blockquote':
                                DOM.quoteIncreaseBtn.classList.add('active');
                                break;
                            case 'a':
                                DOM.linkBtn.classList.add('active');
                                break;
                            case 'img':
                                DOM.imageBtn.classList.add('active');
                                break;
                        }
                    }
                    node = node.parentNode;
                }
            },
            
            /**
             * Check if text is wrapped by a marker
             */
            isWrappedBy(before, after, marker) {
                const len = marker.length;
                // Check if marker appears before cursor and after cursor
                const beforeHas = before.lastIndexOf(marker) > before.lastIndexOf('\n');
                const afterHas = after.indexOf(marker) !== -1 && after.indexOf(marker) < after.indexOf('\n');
                return beforeHas && afterHas;
            },
            
            /**
             * Reset all button states
             */
            resetButtons() {
                const buttons = [
                    DOM.boldBtn, DOM.italicBtn, DOM.underlineBtn, DOM.strikeBtn,
                    DOM.h1Btn, DOM.h2Btn, DOM.h3Btn, DOM.h4Btn, DOM.h5Btn, DOM.h6Btn,
                    DOM.bulletBtn, DOM.numberBtn, DOM.quoteIncreaseBtn,
                    DOM.linkBtn, DOM.imageBtn, DOM.codeBtn
                ];
                
                buttons.forEach(btn => {
                    if (btn) btn.classList.remove('active');
                });
            }
        };
        
        // ============================================================================
        // FILE OPERATIONS
        // ============================================================================
        const FileOps = {
            newDocument() {
                if (AppState.isModified) {
                    if (!confirm('You have unsaved changes. Create a new document anyway?')) {
                        return;
                    }
                }
                
                DOM.editor.value = '';
                DOM.preview.innerHTML = '';
                AppState.currentFile = null;
                AppState.setModified(false);
                this.updateFileNameDisplay();
                EditorOps.updateStatus();
                Logger.info('File', 'Created new document');
            },
            
            openFile() {
                DOM.fileInput.click();
            },
            
            handleFileOpen(event) {
                const file = event.target.files[0];
                if (!file) return;
                this.loadFile(file);
                // Reset file input
                event.target.value = '';
            },
            
            loadFile(file) {
                // Validate file type
                const validExtensions = ['.md', '.txt', '.html'];
                const extension = '.' + file.name.split('.').pop().toLowerCase();
                
                if (!validExtensions.includes(extension)) {
                    alert('Unsupported file type. Please use .md, .txt, or .html files.');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    let content = e.target.result;
                    
                    // If HTML file, convert to markdown
                    if (file.name.endsWith('.html')) {
                        const temp = document.createElement('div');
                        temp.innerHTML = content;
                        content = HtmlToMarkdown.convert(temp.innerHTML);
                    }
                    
                    DOM.editor.value = content;
                    EditorOps.updatePreview();
                    AppState.currentFile = file.name;
                    AppState.setModified(false);
                    this.updateFileNameDisplay();
                    DOM.statusLeft.textContent = `Opened: ${file.name}`;
                    Logger.info('File', `Opened: ${file.name}`);
                };
                reader.onerror = () => {
                    alert('Error reading file. Please try again.');
                    Logger.error('File', `Error reading: ${file.name}`);
                };
                reader.readAsText(file);
            },
            
            saveFile() {
                this.exportAs('md');
            },
            
            exportAs(format) {
                const markdown = DOM.editor.value;
                let content, mimeType, extension;
                
                switch (format) {
                    case 'md':
                        content = markdown;
                        mimeType = 'text/markdown';
                        extension = '.md';
                        break;
                        
                    case 'html':
                        const htmlContent = MarkdownParser.parse(markdown);
                        content = this.generateHtmlDocument(htmlContent);
                        mimeType = 'text/html';
                        extension = '.html';
                        break;
                        
                    case 'txt':
                        // Strip markdown formatting for plain text
                        content = this.stripMarkdown(markdown);
                        mimeType = 'text/plain';
                        extension = '.txt';
                        break;
                        
                    default:
                        return;
                }
                
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                
                // Get base filename without extension
                let baseName = 'document';
                if (AppState.currentFile) {
                    baseName = AppState.currentFile.replace(/\.[^/.]+$/, '');
                }
                
                const a = document.createElement('a');
                a.href = url;
                a.download = baseName + extension;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                if (format === 'md') {
                    AppState.setModified(false);
                    AppState.currentFile = a.download;
                    this.updateFileNameDisplay();
                }
                
                DOM.statusLeft.textContent = `Exported: ${a.download}`;
                Logger.info('File', `Exported as ${format.toUpperCase()}: ${a.download}`);
            },
            
            generateHtmlDocument(bodyContent) {
                return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${AppState.currentFile ? AppState.currentFile.replace(/\.[^/.]+$/, '') : 'Document'}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
        }
        h1, h2, h3, h4, h5, h6 { margin-top: 1.5em; margin-bottom: 0.5em; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 0.3em; }
        h2 { border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
        pre { background: #1f2937; color: #f9fafb; padding: 16px; border-radius: 8px; overflow-x: auto; }
        pre code { background: none; padding: 0; color: inherit; }
        blockquote { border-left: 4px solid #3b82f6; margin: 1em 0; padding: 0.5em 1em; background: #eff6ff; }
        a { color: #2563eb; }
        img { max-width: 100%; height: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #f9f9f9; }
    </style>
</head>
<body>
${bodyContent}
</body>
</html>`;
            },
            
            stripMarkdown(markdown) {
                let text = markdown;
                // Remove headers
                text = text.replace(/^#{1,6}\s+/gm, '');
                // Remove bold/italic
                text = text.replace(/\*\*(.+?)\*\*/g, '$1');
                text = text.replace(/\*(.+?)\*/g, '$1');
                text = text.replace(/__(.+?)__/g, '$1');
                text = text.replace(/_(.+?)_/g, '$1');
                // Remove strikethrough
                text = text.replace(/~~(.+?)~~/g, '$1');
                // Remove links but keep text
                text = text.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
                // Remove images
                text = text.replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1');
                // Remove inline code
                text = text.replace(/`([^`]+)`/g, '$1');
                // Remove code blocks
                text = text.replace(/```[\s\S]*?```/g, '');
                // Remove blockquotes
                text = text.replace(/^>\s*/gm, '');
                // Remove list markers
                text = text.replace(/^[-*+]\s+/gm, '');
                text = text.replace(/^\d+\.\s+/gm, '');
                // Remove horizontal rules
                text = text.replace(/^(-{3,}|\*{3,}|_{3,})$/gm, '');
                return text;
            },
            
            updateFileNameDisplay() {
                if (DOM.fileNameDisplay) {
                    DOM.fileNameDisplay.textContent = AppState.currentFile || '';
                }
            }
        };
        
        // ============================================================================
        // DRAG AND DROP HANDLER
        // ============================================================================
        const DragDropHandler = {
            dragCounter: 0,
            
            init() {
                // Prevent default drag behaviors on document
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    document.body.addEventListener(eventName, this.preventDefaults, false);
                });
                
                // Handle drag enter/leave for overlay
                document.body.addEventListener('dragenter', (e) => this.handleDragEnter(e), false);
                document.body.addEventListener('dragleave', (e) => this.handleDragLeave(e), false);
                document.body.addEventListener('dragover', (e) => this.handleDragOver(e), false);
                document.body.addEventListener('drop', (e) => this.handleDrop(e), false);
                
                Logger.info('DragDrop', 'Drag and drop initialized');
            },
            
            preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            },
            
            handleDragEnter(e) {
                this.dragCounter++;
                
                // Check if dragging files
                if (e.dataTransfer && e.dataTransfer.types.includes('Files')) {
                    DOM.dragOverlay.classList.add('active');
                }
            },
            
            handleDragLeave(e) {
                this.dragCounter--;
                
                if (this.dragCounter === 0) {
                    DOM.dragOverlay.classList.remove('active');
                }
            },
            
            handleDragOver(e) {
                e.dataTransfer.dropEffect = 'copy';
            },
            
            handleDrop(e) {
                this.dragCounter = 0;
                DOM.dragOverlay.classList.remove('active');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    // Only handle the first file
                    const file = files[0];
                    
                    // Check for unsaved changes
                    if (AppState.isModified) {
                        if (!confirm('You have unsaved changes. Load the dropped file anyway?')) {
                            return;
                        }
                    }
                    
                    FileOps.loadFile(file);
                    Logger.info('DragDrop', `File dropped: ${file.name}`);
                }
            }
        };

                            existingText = match[1];

                    img.src = url;
                    img.alt = alt;
                    
                    const selection = window.getSelection();
                    if (selection.rangeCount) {
                        const range = selection.getRangeAt(0);
                        range.deleteContents();
                        range.insertNode(img);
                    }
                    PreviewOps.syncToEditor();
                }
                
                this.closeImageModal();
            }
        };
        
        // ============================================================================
        // EVENT HANDLERS
        // ============================================================================
        function setupEventListeners() {
            // Editor input
            DOM.editor.addEventListener('input', () => {
                EditorOps.updatePreview();
                AppState.setModified(true);
            });
            
            // Editor selection change
            DOM.editor.addEventListener('keyup', () => IconHighlighter.checkEditorFormats());
            DOM.editor.addEventListener('click', () => IconHighlighter.checkEditorFormats());
            DOM.editor.addEventListener('focus', () => {
                AppState.activePane = 'editor';
                IconHighlighter.checkEditorFormats();
            });
            
            // Preview events
            DOM.preview.addEventListener('input', () => {
                PreviewOps.syncToEditor();
            });
            
            DOM.preview.addEventListener('keyup', () => IconHighlighter.checkPreviewFormats());
            DOM.preview.addEventListener('click', () => IconHighlighter.checkPreviewFormats());
            DOM.preview.addEventListener('focus', () => {
                AppState.activePane = 'preview';
                IconHighlighter.checkPreviewFormats();
            });
            
            // File Menu
            DOM.fileMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                DOM.fileMenu.classList.toggle('open');
            });
            
            // Close file menu when clicking outside
            document.addEventListener('click', (e) => {
                if (!DOM.fileMenu.contains(e.target)) {
                    DOM.fileMenu.classList.remove('open');
                }
            });
            
            // File menu items
            DOM.menuNew.addEventListener('click', () => {
                FileOps.newDocument();
                DOM.fileMenu.classList.remove('open');
            });
            DOM.menuOpen.addEventListener('click', () => {
                FileOps.openFile();
                DOM.fileMenu.classList.remove('open');
            });
            DOM.menuSave.addEventListener('click', () => {
                FileOps.saveFile();
                DOM.fileMenu.classList.remove('open');
            });
            DOM.exportMd.addEventListener('click', () => {
                FileOps.exportAs('md');
                DOM.fileMenu.classList.remove('open');
            });
            DOM.exportHtml.addEventListener('click', () => {
                FileOps.exportAs('html');
                DOM.fileMenu.classList.remove('open');
            });
            DOM.exportTxt.addEventListener('click', () => {
                FileOps.exportAs('txt');
                DOM.fileMenu.classList.remove('open');
            });
            DOM.fileInput.addEventListener('change', (e) => FileOps.handleFileOpen(e));
            
            // Format buttons
            DOM.boldBtn.addEventListener('click', () => handleFormat('bold'));
            DOM.italicBtn.addEventListener('click', () => handleFormat('italic'));
            DOM.underlineBtn.addEventListener('click', () => handleFormat('underline'));
            DOM.strikeBtn.addEventListener('click', () => handleFormat('strike'));
            DOM.h1Btn.addEventListener('click', () => handleFormat('h1'));
            DOM.h2Btn.addEventListener('click', () => handleFormat('h2'));
            DOM.h3Btn.addEventListener('click', () => handleFormat('h3'));
            DOM.h4Btn.addEventListener('click', () => handleFormat('h4'));
            DOM.h5Btn.addEventListener('click', () => handleFormat('h5'));
            DOM.h6Btn.addEventListener('click', () => handleFormat('h6'));
            DOM.bulletBtn.addEventListener('click', () => handleFormat('bullet'));
            DOM.numberBtn.addEventListener('click', () => handleFormat('number'));
            DOM.quoteIncreaseBtn.addEventListener('click', () => handleFormat('quoteIncrease'));
            DOM.quoteDecreaseBtn.addEventListener('click', () => handleFormat('quoteDecrease'));
            DOM.codeBtn.addEventListener('click', () => handleFormat('code'));
            DOM.codeBlockBtn.addEventListener('click', () => handleFormat('codeBlock'));
            DOM.hrBtn.addEventListener('click', () => handleFormat('hr'));
            
            // Table button
            DOM.tableBtn.addEventListener('click', () => TableOps.openModal());
            
            // View mode buttons
            DOM.viewEditorBtn.addEventListener('click', () => ViewModeManager.setMode('editor'));
            DOM.viewBothBtn.addEventListener('click', () => ViewModeManager.setMode('both'));
            DOM.viewPreviewBtn.addEventListener('click', () => ViewModeManager.setMode('preview'));
            
            // Link and image buttons
            DOM.linkBtn.addEventListener('click', () => ModalOps.openLinkModal());
            DOM.imageBtn.addEventListener('click', () => ModalOps.openImageModal());
            
            // Modal buttons
            DOM.linkCancel.addEventListener('click', () => ModalOps.closeLinkModal());
            DOM.linkSubmit.addEventListener('click', () => ModalOps.submitLink());
            DOM.imageCancel.addEventListener('click', () => ModalOps.closeImageModal());
            DOM.imageSubmit.addEventListener('click', () => ModalOps.submitImage());
            DOM.tableCancel.addEventListener('click', () => TableOps.closeModal());
            DOM.tableSubmit.addEventListener('click', () => TableOps.insert());
            
            // Table preview update on input change
            DOM.tableRows.addEventListener('input', () => TableOps.updatePreview());
            DOM.tableCols.addEventListener('input', () => TableOps.updatePreview());
            
            // Modal overlay click to close
            DOM.linkModal.addEventListener('click', (e) => {
                if (e.target === DOM.linkModal) ModalOps.closeLinkModal();
            });
            DOM.imageModal.addEventListener('click', (e) => {
                if (e.target === DOM.imageModal) ModalOps.closeImageModal();
            });
            DOM.tableModal.addEventListener('click', (e) => {
                if (e.target === DOM.tableModal) TableOps.closeModal();
            });
            
            // Modal Enter key
            DOM.linkUrl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') ModalOps.submitLink();
            });
            DOM.imageUrl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') ModalOps.submitImage();
            });
            DOM.tableCols.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') TableOps.insert();
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    switch (e.key.toLowerCase()) {
                        case 'n':
                            e.preventDefault();
                            FileOps.newDocument();
                            break;
                        case 'o':
                            e.preventDefault();
                            FileOps.openFile();
                            break;
                        case 'b':
                            e.preventDefault();
                            handleFormat('bold');
                            break;
                        case 'i':
                            e.preventDefault();
                            handleFormat('italic');
                            break;
                        case 'u':
                            e.preventDefault();
                            handleFormat('underline');
                            break;
                        case 'k':
                            e.preventDefault();
                            ModalOps.openLinkModal();
                            break;
                        case 's':
                            e.preventDefault();
                            FileOps.saveFile();
                            break;
                    }
                }
                
                // Escape to close modals and file menu
                if (e.key === 'Escape') {
                    ModalOps.closeLinkModal();
                    ModalOps.closeImageModal();
                    TableOps.closeModal();
                    DOM.fileMenu.classList.remove('open');
                }
            });
            
            // Before unload warning
            window.addEventListener('beforeunload', (e) => {
                if (AppState.isModified) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
        }
        
        /**
         * Handle format button clicks
         */
        function handleFormat(format) {
            const inlineFormats = ['bold', 'italic', 'underline', 'strike', 'code'];
            const blockFormats = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'bullet', 'number', 'quoteIncrease', 'quoteDecrease', 'codeBlock', 'hr'];
            
            if (AppState.activePane === 'editor') {
                if (inlineFormats.includes(format)) {
                    EditorOps.applyInlineFormat(format);
                } else if (blockFormats.includes(format)) {
                    EditorOps.applyBlockFormat(format);
                }
            } else if (AppState.activePane === 'preview') {
                PreviewOps.applyFormat(format);
            }
        }
        
        // ============================================================================
        // INITIALIZATION
        // ============================================================================
        // ============================================================================
        // BAT FILE LAUNCHER PAYLOAD LOADER
        // markdown-editor.bat injects window.MD_PAYLOAD into a temp copy of the
        // HTML before opening it in the browser.
        // MD_PAYLOAD = { b64: "<base64 utf-8 content>", filename: "<name.md>" }
        // ============================================================================
        function loadFromPayload() {
            if (!window.MD_PAYLOAD) return false;

            try {
                const { b64, filename } = window.MD_PAYLOAD;

                // Decode base64 → UTF-8 text
                const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
                const content = new TextDecoder('utf-8').decode(bytes);

                // Populate editor
                DOM.editor.value = content;
                EditorOps.updatePreview();
                AppState.currentFile = filename;
                AppState.setModified(false);
                FileOps.updateFileNameDisplay();
                DOM.statusLeft.textContent = `Opened: ${filename}`;
                document.title = `Markdown Editor v1.0.39 - ${filename}`;

                Logger.success('App', `Loaded from bat payload: ${filename}`);
                return true;
            } catch (err) {
                Logger.error('App', `Failed to load from bat payload: ${err.message}`);
                return false;
            }
        }

        function init() {
            Logger.info('App', 'MARKDOWN EDITOR v1.0.39 - Initializing Application');
            
            // Set up event listeners
            setupEventListeners();
            
            // Initialize scroll sync
            ScrollSyncManager.init(DOM.editor, DOM.previewContainer, DOM.trackBtn);
            
            // Initialize drag and drop
            DragDropHandler.init();
            
            // Load file from URL hash if launched via bat/context menu
            const loadedFromHash = loadFromPayload();

            // Initial status update
            EditorOps.updateStatus();
            
            // Set focus to editor
            DOM.editor.focus();
            AppState.activePane = 'editor';
            
            Logger.success('App', 'Application initialized successfully');
        }
        
        // Start the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
