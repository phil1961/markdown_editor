                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    <button class="file-menu-item" id="menuDownloadEditor">

        </div>
        <div class="header-right">
            <a id="downloadAppBtn" class="download-app-btn" href="markdown-editor.html" download="markdown-editor.html" title="Save this editor to your computer. Open the file in any browser — no install, no network.">

                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>

        </div>
    </header>
    
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button id="undoBtn" class="toolbar-btn" title="Undo (Ctrl+Z)" disabled>

                </svg>
            </button>
            <button id="redoBtn" class="toolbar-btn" title="Redo (Ctrl+Y)" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>
                </svg>
            </button>
            <button id="historyBtn" class="toolbar-btn" title="History (Ctrl+Shift+H)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="12 7 12 12 15.5 14"/>
                </svg>
            </button>
        </div>
        <!-- Text Formatting Group -->
        <div class="toolbar-group">
            <button id="boldBtn" class="toolbar-btn" title="Bold (Ctrl+B)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
                    <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
                </svg>
            </button>
            <button id="italicBtn" class="toolbar-btn" title="Italic (Ctrl+I)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="4" x2="10" y2="4"/>
                    <line x1="14" y1="20" x2="5" y2="20"/>
                    <line x1="15" y1="4" x2="9" y2="20"/>
                </svg>
            </button>
            <button id="underlineBtn" class="toolbar-btn" title="Underline (Ctrl+U)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/>
                    <line x1="4" y1="21" x2="20" y2="21"/>
                </svg>
            </button>
            <button id="strikeBtn" class="toolbar-btn" title="Strikethrough">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.3 4.9c-2.3-.6-4.4-1-6.2-.9-2.7 0-5.3.7-5.3 3.6 0 1.5 1.8 3.3 5.7 3.9"/>
                    <line x1="4" y1="12" x2="20" y2="12"/>
                    <path d="M18.6 13c.3.5.4 1 .4 1.7 0 2.5-2 4.4-6 4.4-2.2 0-4.4-.5-6-1.2"/>
                </svg>
            </button>
        </div>
        
        <!-- Headers Group -->
        <div class="toolbar-group">
            <button id="h1Btn" class="toolbar-btn wide" title="Heading 1">H1</button>
            <button id="h2Btn" class="toolbar-btn wide" title="Heading 2">H2</button>
            <button id="h3Btn" class="toolbar-btn wide" title="Heading 3">H3</button>
            <button id="h4Btn" class="toolbar-btn wide" title="Heading 4">H4</button>
            <button id="h5Btn" class="toolbar-btn wide" title="Heading 5">H5</button>
            <button id="h6Btn" class="toolbar-btn wide" title="Heading 6">H6</button>
        </div>
        
        <!-- Lists & Blocks Group -->
        <div class="toolbar-group">
            <button id="bulletBtn" class="toolbar-btn" title="Bullet List">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <circle cx="4" cy="6" r="1" fill="currentColor"/>
                    <circle cx="4" cy="12" r="1" fill="currentColor"/>
                    <circle cx="4" cy="18" r="1" fill="currentColor"/>
                </svg>
            </button>
            <button id="numberBtn" class="toolbar-btn" title="Numbered List">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="10" y1="6" x2="21" y2="6"/>
                    <line x1="10" y1="12" x2="21" y2="12"/>
                    <line x1="10" y1="18" x2="21" y2="18"/>
                    <text x="3" y="7" font-size="6" fill="currentColor" stroke="none">1</text>
                    <text x="3" y="13" font-size="6" fill="currentColor" stroke="none">2</text>
                    <text x="3" y="19" font-size="6" fill="currentColor" stroke="none">3</text>
                </svg>
            </button>
            <button id="quoteIncreaseBtn" class="toolbar-btn wide" title="Add Quote Level">❯ +</button>
            <button id="quoteDecreaseBtn" class="toolbar-btn wide" title="Remove Quote Level">❮ -</button>
        </div>
        
        <!-- Insert Group -->
        <div class="toolbar-group">
            <button id="linkBtn" class="toolbar-btn" title="Insert Link (Ctrl+K)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </button>
            <button id="imageBtn" class="toolbar-btn" title="Insert Image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <button id="codeBtn" class="toolbar-btn" title="Inline Code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"/>

                </svg>
            </button>
            <button id="codeBlockBtn" class="toolbar-btn" title="Code Block">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M7 8l4 4-4 4"/>
                    <line x1="13" y1="16" x2="17" y2="16"/>
                </svg>
            </button>
            <button id="tableBtn" class="toolbar-btn" title="Insert Table">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="3" y1="15" x2="21" y2="15"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                    <line x1="15" y1="3" x2="15" y2="21"/>
                </svg>
            </button>
            <button id="tableRowAboveBtn" class="toolbar-btn" title="Insert Row Above" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="10" width="16" height="10" rx="1"/>
                    <line x1="4" y1="15" x2="20" y2="15"/>
                    <line x1="12" y1="10" x2="12" y2="20"/>
                    <line x1="12" y1="3" x2="12" y2="8"/>
                    <line x1="9" y1="5" x2="15" y2="5"/>
                </svg>
            </button>
            <button id="tableRowBelowBtn" class="toolbar-btn" title="Insert Row Below" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="3" width="16" height="10" rx="1"/>
                    <line x1="4" y1="8" x2="20" y2="8"/>
                    <line x1="12" y1="3" x2="12" y2="13"/>
                    <line x1="12" y1="16" x2="12" y2="21"/>
                    <line x1="9" y1="19" x2="15" y2="19"/>
                </svg>
            </button>
            <button id="tableRowDelBtn" class="toolbar-btn" title="Delete Row" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="1"/>
                    <line x1="4" y1="12" x2="20" y2="12"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                    <line x1="8" y1="12" x2="16" y2="12" stroke-width="3"/>
                </svg>
            </button>
            <button id="tableColLeftBtn" class="toolbar-btn" title="Insert Column Left" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="10" y="4" width="10" height="16" rx="1"/>
                    <line x1="10" y1="12" x2="20" y2="12"/>
                    <line x1="15" y1="4" x2="15" y2="20"/>
                    <line x1="3" y1="12" x2="8" y2="12"/>
                    <line x1="5" y1="9" x2="5" y2="15"/>
                </svg>
            </button>
            <button id="tableColRightBtn" class="toolbar-btn" title="Insert Column Right" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="10" height="16" rx="1"/>
                    <line x1="4" y1="12" x2="14" y2="12"/>
                    <line x1="9" y1="4" x2="9" y2="20"/>
                    <line x1="16" y1="12" x2="21" y2="12"/>
                    <line x1="19" y1="9" x2="19" y2="15"/>
                </svg>
            </button>
            <button id="tableColDelBtn" class="toolbar-btn" title="Delete Column" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="1"/>
                    <line x1="4" y1="12" x2="20" y2="12"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                    <line x1="12" y1="8" x2="12" y2="16" stroke-width="3"/>
                </svg>
            </button>
            <button id="hrBtn" class="toolbar-btn" title="Horizontal Rule">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                </svg>
            </button>
        </div>
        
        <!-- View Mode Group -->
        <div class="toolbar-group">
            <div class="view-toggle-group">
                <button id="viewEditorBtn" class="view-toggle-btn" title="Editor Only">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                    </svg>
                    Editor
                </button>
                <button id="viewBothBtn" class="view-toggle-btn active" title="Both Panes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="12" y1="3" x2="12" y2="21"/>
                    </svg>
                    Both
                </button>
                <button id="viewPreviewBtn" class="view-toggle-btn" title="Preview Only">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="15" y1="3" x2="15" y2="21"/>
                    </svg>
                    Preview
                </button>
            </div>
        </div>
        
        <!-- Utility Group -->
        <div class="toolbar-group">
            <button id="trackBtn" class="toolbar-btn track-btn active" title="Toggle Scroll Sync">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Main Container -->
    <div class="main-container" id="mainContainer" style="--split: 50%;">
        <!-- Editor Pane -->
        <div class="pane" id="editorPane">
            <div class="pane-header">Editor (Markdown)</div>
            <div class="pane-content" id="editorContainer">
                <textarea id="editor" placeholder="Start writing markdown here..."></textarea>
            </div>
        </div>
        <div class="splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize panes" aria-controls="editorPane previewPane" title="Drag to resize. Double-click to reset. Arrow keys nudge."></div>
        <!-- Preview Pane -->
        <div class="pane" id="previewPane">
            <div class="pane-header">Preview (Rendered)</div>
            <div class="pane-content" id="previewContainer">
                <div id="preview" contenteditable="true"></div>
            </div>
        </div>
        <!-- History panel: the undo/redo stack, newest first -->
        <aside class="history-panel" id="historyPanel" aria-label="Undo history">
            <div class="history-header">
                <span class="history-title">History</span>
                <span class="history-summary" id="historySummary"></span>
                <button class="history-close" id="historyClose" title="Close (Ctrl+Shift+H)">&times;</button>
            </div>
            <div class="history-list" id="historyList"></div>
            <div class="history-foot">Click a row to jump. Undo/Redo tooltips name the next step.</div>
        </aside>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
        <span id="statusLeft">Ready</span>
        <span id="statusRight">Lines: 0 | Words: 0 | Characters: 0</span>
    </div>
    
    <!-- Console Panel (for debugging) -->
    <div class="console-panel" id="consolePanel"></div>
    
    <!-- Link Modal -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal">
            <div class="modal-title">Insert Link</div>
            <div class="modal-field">
                <label for="linkText">Link Text</label>
                <input type="text" id="linkText" placeholder="Enter display text">
            </div>
            <div class="modal-field">
                <label for="linkUrl">URL</label>
                <input type="url" id="linkUrl" placeholder="https://example.com">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="linkCancel">Cancel</button>
                <button class="modal-btn modal-btn-submit" id="linkSubmit">Insert Link</button>
            </div>
        </div>
    </div>
    
    <!-- Image Modal -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal">
            <div class="modal-title">Insert Image</div>
            <div class="modal-field">
                <label for="imageAlt">Alt Text</label>
                <input type="text" id="imageAlt" placeholder="Image description">
            </div>
            <div class="modal-field">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="imageCancel">Cancel</button>
                <button class="modal-btn modal-btn-submit" id="imageSubmit">Insert Image</button>
            </div>
        </div>
    </div>
    
    <!-- Table Modal -->
    <div class="modal-overlay" id="tableModal">
        <div class="modal">
            <div class="modal-title">Insert Table</div>
            <div class="table-config">
                <div class="modal-field">
                    <label for="tableRows">Rows</label>
                    <input type="number" id="tableRows" value="3" min="1" max="20">
                </div>
                <div class="modal-field">
                    <label for="tableCols">Columns</label>
                    <input type="number" id="tableCols" value="3" min="1" max="10">
                </div>
            </div>
            <div class="modal-field">
                <label>Preview</label>
                <div class="table-preview" id="tablePreview"></div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="tableCancel">Cancel</button>
                <button class="modal-btn modal-btn-submit" id="tableSubmit">Insert Table</button>
            </div>
        </div>
    </div>
    
    <!-- Hidden File Input -->
    <input type="file" id="fileInput" accept=".md,.txt,.html" style="display: none;">
    
    <!-- Drag and Drop Overlay -->
    <div class="drag-overlay" id="dragOverlay">
        <div class="drag-overlay-content">
            <div class="drag-overlay-icon">📄</div>
            <div class="drag-overlay-text">Drop your file here</div>
            <div class="drag-overlay-subtext">Supports .md, .txt, and .html files</div>
        </div>
    </div>

    <script>
@@SCRIPT@@
    </script>
</body>
</html>
